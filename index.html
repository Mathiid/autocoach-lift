<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<meta name="description" content="AutoCoach Lift — auto-regulating workout tracker with an AI strength coach.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AutoCoach">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d12'/%3E%3Cpath d='M14 32h36M18 20v24M46 20v24M10 26v12M54 26v12' stroke='%232dd4bf' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<title>AutoCoach Lift</title>
<style>
:root{
  --bg:#0b0d12; --bg2:#10131a; --card:#151a24; --card2:#1c2230; --line:#262e3f;
  --txt:#e9ecf3; --mut:#8c95a9; --dim:#5d667a;
  --acc:#2dd4bf; --on-acc:#04211d;
  --ok:#2dd4bf; --pr:#a78bfa; --warn:#fbbf24; --bad:#fb7185; --info:#60a5fa;
  --r:16px; --nav:62px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button,input,select,textarea{font-family:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:22px;letter-spacing:-.02em;line-height:1.2}
h2{font-size:18px;letter-spacing:-.01em}
h3{font-size:15px}
b,strong{font-weight:700}
.ic{flex:none;display:block}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 16px 10px;background:rgba(11,13,18,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:18px}
.brand b{color:var(--acc)}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2dd4bf,#38bdf8);display:grid;place-items:center;color:var(--on-acc)}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--mut);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.icon-btn:active{background:var(--card2)}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(var(--nav) + var(--safe-b) + 30px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(16,19,26,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar .inner{display:flex;max-width:720px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:var(--nav);padding:6px 2px;background:none;border:0;color:var(--mut);font-size:11px;font-weight:650;cursor:pointer}
.tab.on{color:var(--acc)}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap{gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--mut)}
.small{font-size:13px}
.xs{font-size:11.5px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--card2);color:var(--mut);font-size:12px;font-weight:650;border:1px solid var(--line);white-space:nowrap;font-family:inherit}
.chip.acc{color:var(--acc);border-color:rgba(45,212,191,.35);background:rgba(45,212,191,.08)}
.chip.warn{color:var(--warn);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
.chip.bad{color:var(--bad);border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.08)}
.chip.pr{color:var(--pr);border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.08)}
button.chip{cursor:pointer}
.btn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:12px;padding:10px 16px;font-size:15px;font-weight:650;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(251,113,133,.35);background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.link{appearance:none;background:none;border:0;color:var(--acc);font-size:13px;font-weight:650;cursor:pointer;padding:0}
.txt{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);padding:10px 12px;font-size:16px}
.txt:focus,.code:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
select.txt{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.code{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);padding:10px 12px;font:16px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;min-height:240px;white-space:pre;overflow:auto}
.field{margin-bottom:14px}
.field>label,.lbl{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:650;color:var(--mut);margin-bottom:6px}
.hint{font-size:12.5px;color:var(--dim);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.switch{display:flex;align-items:center;gap:12px;font-size:14px;margin:6px 0 14px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--acc)}
.prog{height:6px;border-radius:999px;background:var(--card2);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#38bdf8);border-radius:999px;transition:width .25s}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.hero{text-align:center;padding:26px 18px}
.hero h1{margin:12px 0 8px}
.hero-ic{width:60px;height:60px;border-radius:18px;margin:0 auto;background:linear-gradient(135deg,rgba(45,212,191,.2),rgba(56,189,248,.2));color:var(--acc);display:grid;place-items:center}
.steps{text-align:left;margin:16px auto;padding-left:22px;max-width:420px;color:var(--mut);display:grid;gap:6px}
.steps b{color:var(--txt)}

/* ---------- workout ---------- */
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-n{font-size:17px;font-weight:750;letter-spacing:-.01em}
.sets{margin-top:10px}
.sethead,.setrow{display:grid;grid-template-columns:24px minmax(0,1fr) 66px 54px 44px;gap:6px;align-items:center}
.sethead{font-size:10.5px;color:var(--dim);font-weight:750;letter-spacing:.07em;text-transform:uppercase;padding:0 6px 4px}
.sethead span:nth-child(n+3){text-align:center}
.setrow{padding:6px;border-radius:12px;margin-bottom:5px;background:var(--bg2);border:1px solid transparent;--sc:var(--ok)}
.setno{font-weight:800;color:var(--mut);text-align:center;font-variant-numeric:tabular-nums}
.tgt{min-width:0}
.t1{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1 .x{color:var(--dim);font-weight:600}
.t2{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:16px;font-weight:750;text-align:center;font-variant-numeric:tabular-nums;padding:0 4px;min-width:0}
.in::placeholder{color:var(--dim);font-weight:600}
.in:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.chk{width:44px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--dim);display:grid;place-items:center;cursor:pointer;padding:0}
.setrow.done{background:var(--card2);box-shadow:inset 3px 0 0 var(--sc)}
.setrow.done{background:color-mix(in srgb,var(--sc) 9%,var(--bg2))}
.setrow.done .chk{background:var(--sc);border-color:var(--sc);color:#0b0d12}
.setrow.done .t2 .sc{color:var(--sc);font-weight:750}
.st-hit,.st-logged{--sc:var(--ok)}
.st-exceeded{--sc:var(--pr)}
.st-minor{--sc:var(--warn)}
.st-fail{--sc:var(--bad)}
.st-adjusted{--sc:var(--info)}
.ex-f{display:flex;gap:8px;margin-top:8px}
.coach-card{border-color:rgba(45,212,191,.28);background:linear-gradient(180deg,rgba(45,212,191,.07),var(--card) 60%)}
.coach-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2dd4bf,#38bdf8);color:var(--on-acc);display:grid;place-items:center;font-weight:850;flex:none}
.md p{margin:0 0 8px}
.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 8px;padding-left:20px}
.md li{margin:3px 0}
.md code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:.92em}
.clamp{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.typing{display:inline-flex;gap:5px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:12px;padding:4px 0 8px;min-height:40vh}
.msg{display:flex;gap:9px;align-items:flex-end;max-width:92%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .av{width:30px;height:30px;font-size:13px}
.bub{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 13px;min-width:0;overflow-wrap:anywhere}
.msg.user .bub{background:var(--acc);border-color:var(--acc);color:var(--on-acc);border-radius:18px 18px 6px 18px}
.bub .who{font-size:11.5px;font-weight:750;color:var(--acc);margin-bottom:3px}
.bub .t{font-size:10.5px;color:var(--dim);margin-top:5px}
.msg.user .bub .t{color:rgba(4,33,29,.65)}
.msg.sys{align-self:center;max-width:100%}
.msg.sys .bub{background:transparent;border-style:dashed;color:var(--mut);font-size:13px;border-radius:12px}
.composer{position:sticky;bottom:calc(var(--nav) + var(--safe-b));background:linear-gradient(rgba(11,13,18,0),var(--bg) 22%);padding:12px 0 8px}
.composer form{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:44px;max-height:120px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:11px 13px;font-size:16px;resize:none;line-height:1.35}
.composer .btn{width:46px;padding:0}
.suggest{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.suggest::-webkit-scrollbar{display:none}

/* ---------- lifts / programs / history ---------- */
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:14px;color:var(--mut);font-weight:650;margin-left:3px;letter-spacing:0}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv div{background:var(--bg2);border-radius:12px;padding:8px 10px}
.kv span{display:block;font-size:11px;color:var(--mut);font-weight:650}
.kv b{font-variant-numeric:tabular-nums}
.spark{width:100%;height:42px;color:var(--acc);margin-top:10px;display:block}
.delta{font-size:13px;font-weight:750}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.miss-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.miss-row .txt{width:110px}
details{margin:0}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.blk{border:1px solid var(--line);border-radius:14px;margin-top:10px;background:var(--bg2)}
.blk>summary{padding:12px 14px;font-weight:750;display:flex;justify-content:space-between;align-items:center}
.blk .wk{padding:0 14px 12px}
.wk-h{font-size:12.5px;font-weight:700;color:var(--mut);margin:10px 0 6px;display:flex;gap:8px;align-items:center}
.days{display:flex;flex-wrap:wrap;gap:6px}
.daychip{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:650;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.daychip.done{color:var(--mut);border-color:rgba(45,212,191,.25)}
.daychip.done svg{color:var(--ok)}
.daychip.next{border-color:var(--acc);color:var(--acc)}
.log>summary{display:flex;justify-content:space-between;align-items:center;gap:10px}
.log-ex{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.log-ex+.log-ex{margin-top:10px}
.preview{margin-top:12px;font-size:13.5px}
.preview .err{color:var(--bad);display:grid;gap:3px}
.preview .okc{color:var(--ok);font-weight:700}
.preview .wn{color:var(--warn);margin-top:6px;display:grid;gap:3px}
.help{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;font-size:13px;color:var(--mut)}
.help code{background:var(--card2);padding:1px 6px;border-radius:5px;color:var(--txt);font-size:12.5px;white-space:pre-wrap}
.help pre{margin:8px 0 0;background:var(--card2);border-radius:8px;padding:10px;color:var(--txt);font-size:12.5px;overflow:auto}

/* ---------- modal & toast ---------- */
#modal-root{position:fixed;inset:0;z-index:50;pointer-events:none}
.wrapm{position:absolute;inset:0}
.backdrop{position:absolute;inset:0;background:rgba(3,5,9,.68);opacity:0;transition:opacity .18s;pointer-events:auto}
.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,24px);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;opacity:0;transition:transform .2s,opacity .2s;pointer-events:auto;padding-bottom:var(--safe-b)}
.wrapm.show .backdrop{opacity:1}
.wrapm.show .sheet{opacity:1;transform:translate(-50%,0)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 6px 18px}
.sheet-b{overflow:auto;padding:6px 18px 14px;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:10px;padding:12px 18px 14px;border-top:1px solid var(--line)}
@media(min-width:700px){
  .sheet{bottom:auto;top:50%;transform:translate(-50%,-46%);border-radius:22px}
  .wrapm.show .sheet{transform:translate(-50%,-50%)}
}
#toast-root{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--safe-b) + 14px);z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{max-width:480px;background:#222a3a;border:1px solid var(--line);border-left:4px solid var(--info);color:var(--txt);padding:11px 14px;border-radius:12px;font-size:14px;font-weight:550;box-shadow:0 8px 28px rgba(0,0,0,.45);opacity:0;transform:translateY(10px);transition:.22s}
.toast.in{opacity:1;transform:none}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)} .toast.err{border-left-color:var(--bad)} .toast.pr{border-left-color:var(--pr)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(min-width:700px){.code{font-size:14px}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></span>
      <span>AutoCoach <b>Lift</b></span>
    </div>
    <button class="icon-btn" data-action="open-settings" aria-label="Settings" id="gearBtn"></button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"><div class="inner"></div></nav>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
/* =====================================================================
   AutoCoach Lift — single-file PWA
   Dynamic weight engine + auto-regulation + Gemini strength coach.
   Everything is stored in localStorage (key: autocoach-lift:v1).
   ===================================================================== */
(() => {
'use strict';

/* ---------------------------------------------------------------------
   0. Helpers
   --------------------------------------------------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ESC[c]);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const num = v => {
  if (v === null || v === undefined) return null;
  const s = String(v).trim().replace(',', '.');
  if (!s) return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
};
const r1 = n => Math.round(n * 10) / 10;
const r2 = n => Math.round(n * 100) / 100;
const fmt = n => (n === null || n === undefined || !Number.isFinite(n)) ? '—' : String(r2(n));
const keyOf = n => String(n || '').trim().toLowerCase().replace(/\s+/g, ' ');
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const fmtDate = t => new Date(t).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
const fmtTime = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

const IC = {
  dumbbell: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',

/* ---------------------------------------------------------------------
   2. Weight engine
   --------------------------------------------------------------------- */
const EPS = 0.05;              // ignore float noise when comparing e1RMs
const MAX_E1RM_REPS = 12;      // Epley gets unreliable beyond ~12 reps: don't auto-raise e1RM from those
const LABELS = { heavy: 'Heavy', medium: 'Medium', light: 'Light' };

/** Epley: weight * (1 + reps/30). A true single (1 rep) is the weight itself. */
function epley(w, r) {
  if (!(w > 0) || !(r > 0)) return 0;
  return r === 1 ? w : w * (1 + r / 30);
}
function roundInc(x) {
  const inc = Number(S.settings.rounding) > 0 ? Number(S.settings.rounding) : 2.5;
  return Math.round(x / inc) * inc;
}
const getLift = name => S.lifts[keyOf(name)] || null;
function intPct(int) {
  if (!int) return null;
  if (int.t === 'pct') return int.v;
  if (int.t === 'label') return S.settings.labels[int.v] ?? null;
  return null;
}
/** Short name used in prescriptions and when serialising programs. */
function intName(int) {
  if (!int) return '';
  if (int.t === 'pct') return fmt(int.v) + '%';
  if (int.t === 'label') return LABELS[int.v];
  return fmt(int.v) + S.settings.units;
}
function intFull(int) {
  if (!int) return 'free';
  if (int.t === 'label') return `${LABELS[int.v]} ${fmt(S.settings.labels[int.v])}%`;
  return intName(int);
}
/** Target weight = e1RM * prescribed %, rounded to the loading increment. */
function targetFor(name, int) {
  if (!int) return null;
  if (int.t === 'abs') return int.v;
  const pct = intPct(int);
  const l = getLift(name);
  if (pct == null || !l || !(l.e1rm > 0)) return null;
  let w = roundInc(l.e1rm * pct / 100);
  if (l.hold && l.hold.weight > 0) w = Math.min(w, l.hold.weight);   // "hold steady" after a minor miss
  return r2(w);
}
function setE1rm(lift, v, why) {
  lift.e1rm = v;
  lift.history.push({ t: Date.now(), v, why });
  if (lift.history.length > 200) lift.history.splice(0, lift.history.length - 200);
}
function revertE1rm(lift, prev, next) {
  lift.e1rm = prev;
  const h = lift.history;
  if (h.length && Math.abs(h[h.length - 1].v - next) < 0.001) h.pop();
  else h.push({ t: Date.now(), v: prev, why: 'Undo' });
}
function newLift(name, baseline) {
  return { name: name.trim(), baseline, e1rm: baseline, hold: null, history: [{ t: Date.now(), v: baseline, why: 'Baseline' }] };
}

/** Significant-miss back-off: 2.5% (close) up to 5% (way short). */
const dropFor = ratio => ratio >= 0.7 ? 2.5 : ratio >= 0.5 ? 3.75 : 5;
/**
 * Classify one logged set.
 *  exceeded : Epley e1RM beats the stored e1RM  -> raise it
 *  hit      : reps >= target
 *  minor    : short by <=1 rep or <15%          -> hold e1RM / hold weight next time
 *  fail     : significantly short               -> drop e1RM 2.5-5% + coach
 *  adjusted : lifter chose a lighter weight than prescribed (not judged)
 *  logged   : nothing to compare against (accessories / no 1RM)
 */
function classify(o) {
  const e = epley(o.weight, o.reps);
  const canRaise = o.e1rmBefore != null && o.reps >= 1 && o.reps <= MAX_E1RM_REPS && e > o.e1rmBefore + EPS;
  if (canRaise) return { status: 'exceeded', e };
  if (o.targetWeight == null || !(o.targetReps > 0)) return { status: 'logged', e };
  if (o.reps >= o.targetReps) return { status: 'hit', e };
  if (o.weight < o.targetWeight * 0.975) return { status: 'adjusted', e };
  const short = o.targetReps - o.reps;
  const ratio = o.reps / o.targetReps;
  if (short <= 1 || ratio >= 0.85) return { status: 'minor', e, short };
  return { status: 'fail', e, short, drop: dropFor(ratio) };
}

/* ---------------------------------------------------------------------
   3. Programs: text format <-> structure
   Program = { id, name, cycle, blocks:[{ name, weeks:[{ num,label,note,deload,
               days:[{ name, exercises:[{ name, sets:[{reps,repsText,int}] }] }] }] }] }
   int = null | {t:'pct',v:75} | {t:'label',v:'heavy'} | {t:'abs',v:100}
   --------------------------------------------------------------------- */
const RE_BLOCK = /^block\b\s*(\d+)?\s*[:\-–—]?\s*(.*)$/i;
const RE_WEEK  = /^weeks?\b\s*(\d+)(?:\s*(?:-|–|—|to)\s*(\d+))?\s*(?:[:\-–—]\s*)?(.*)$/i;
const RE_DAY   = /^day\b\s*(\d+)?\s*[:\-–—]?\s*(.*)$/i;
const RE_PROG  = /^(?:program|plan)\s*[:\-–—]\s*(.+)$/i;
const SET_RE   = /(\d+)\s*[x×]\s*(\d+(?:\s*[-–]\s*\d+)?\+?|amrap|max)/i;
const PCT_RE   = /^(\d+(?:\.\d+)?)\s*%(?:\s*\(?\s*([+-]\s*\d+(?:\.\d+)?)\s*%?(?:\s*\/\s*(?:wk|week))?\s*\)?)?/i;
const LABEL_RE = /^(heavy|medium|med|light|deload)\b/i;
const ABS_RE   = /^(\d+(?:\.\d+)?)\s*(?:kgs?|lbs?)\b/i;

function parseIntensity(tail) {
  let t = tail.trim().replace(/^@\s*/, '').replace(/^[-–:]\s*/, '').trim();
  if (!t) return { int: null, leftover: '' };
  let m;
  if ((m = PCT_RE.exec(t))) {
    const v = parseFloat(m[1]);
    const ramp = m[2] ? parseFloat(m[2].replace(/\s+/g, '')) : 0;
    return { int: { t: 'pct', v, ramp }, leftover: t.slice(m[0].length).trim() };
  }
  if ((m = LABEL_RE.exec(t))) {
    const w = m[1].toLowerCase();
    return { int: { t: 'label', v: w === 'med' ? 'medium' : w === 'deload' ? 'light' : w }, leftover: t.slice(m[0].length).trim() };
  }
  if ((m = ABS_RE.exec(t))) return { int: { t: 'abs', v: parseFloat(m[1]) }, leftover: t.slice(m[0].length).trim() };
  if ((m = /^(\d+(?:\.\d+)?)\s*$/.exec(t)) && parseFloat(m[1]) <= 100) {
    return { int: { t: 'pct', v: parseFloat(m[1]), ramp: 0 }, leftover: '', assumed: true };
  }
  return { int: null, leftover: t };
}

function parseRepsToken(tok) {
  const txt = tok.toLowerCase().replace(/\s+/g, '');
  if (txt === 'amrap' || txt === 'max') return { reps: 1, repsText: 'AMRAP' };
  return { reps: parseInt(txt, 10), repsText: txt };
}

function parseExerciseLine(line, ln, errors, warnings) {
  const m = SET_RE.exec(line);
  if (!m) { errors.push({ line: ln, msg: `Couldn't find sets × reps in "${line.slice(0, 50)}" (expected e.g. "Squat 4x6 @ 75%")` }); return null; }
  const name = line.slice(0, m.index).replace(/[\s:\-–—@,|]+$/, '').replace(/\s+/g, ' ').trim();
  if (!name) { errors.push({ line: ln, msg: 'Exercise name is missing before the sets × reps' }); return null; }
  const rest = line.slice(m.index);
  const groups = rest.split(/\s*[;,]\s*|\s+then\s+/i).filter(g => g.trim());
  const sets = [];
  groups.forEach(g => {
    const gm = SET_RE.exec(g);
    if (!gm) { warnings.push({ line: ln, msg: `Ignored "${g.trim()}"` }); return; }
    const n = parseInt(gm[1], 10);
    const rp = parseRepsToken(gm[2]);
    if (!(n >= 1 && n <= 20)) { errors.push({ line: ln, msg: `${n} sets looks wrong (use 1–20)` }); return; }
    if (!(rp.reps >= 1 && rp.reps <= 100)) { errors.push({ line: ln, msg: `${rp.repsText} reps looks wrong` }); return; }
    const rng = /^(\d+)-(\d+)/.exec(rp.repsText);
    if (rng && +rng[2] < +rng[1]) { errors.push({ line: ln, msg: `Rep range ${rp.repsText} is backwards` }); return; }
    const pi = parseIntensity(g.slice(gm.index + gm[0].length));
    if (pi.int && pi.int.t === 'pct' && !(pi.int.v > 0 && pi.int.v <= 120)) { errors.push({ line: ln, msg: `${pi.int.v}% is outside 1–120%` }); return; }
    if (pi.leftover) warnings.push({ line: ln, msg: `Ignored "${pi.leftover}"` });
    if (pi.assumed) warnings.push({ line: ln, msg: `"${gm[0]} @ ${pi.int.v}" read as ${pi.int.v}% of 1RM — add "kg" if you meant an absolute weight` });
    for (let i = 0; i < n; i++) sets.push({ reps: rp.reps, repsText: rp.repsText, int: pi.int ? Object.assign({}, pi.int) : null });
  });
  if (!sets.length) return null;
  return { name, sets };
}

function parseProgramText(text) {
  const errors = [], warnings = [];
  const blocks = [];
  let progName = null, blk = null, grp = null, day = null;
  const newBlock = (name, hint) => { blk = { name, hint, groups: [] }; blocks.push(blk); grp = null; day = null; };
  const newGroup = (from, to, label, deload) => {
    if (!blk) newBlock('Block ' + (blocks.length + 1), null);
    grp = { from, to, label, deload, days: [] }; blk.groups.push(grp); day = null;
  };
  const newDay = name => {
    if (!grp) { if (blk && blk.hint) newGroup(blk.hint[0], blk.hint[1], '', false); else newGroup(1, 1, '', false); }
    day = { name, exercises: [] }; grp.days.push(day);
  };

  String(text || '').replace(/\r/g, '').split('\n').forEach((raw, i) => {
    const ln = i + 1;
    let line = raw.trim();
    if (!line || line.startsWith('//')) return;
    if (line[0] === '#') {
      line = line.replace(/^#+\s*/, '');
      if (!(RE_BLOCK.test(line) || RE_WEEK.test(line) || RE_DAY.test(line) || RE_PROG.test(line))) return; // comment
    }
    line = line.replace(/^(?:[-*•]|\d+[.)])\s+/, '').replace(/[*`]/g, '').trim();
    if (!line) return;
    let m;
    if ((m = RE_PROG.exec(line))) { progName = m[1].trim(); return; }
    if ((m = RE_BLOCK.exec(line))) {
      let name = (m[2] || '').trim(), hint = null;
      const hm = /\(?\bweeks?\s*(\d+)\s*(?:-|–|—|to)\s*(\d+)\)?/i.exec(name);
      if (hm) { hint = [+hm[1], +hm[2]]; name = name.replace(hm[0], '').replace(/[\s\-–—:,]+$/, '').trim(); }
      if (!name) name = 'Block ' + (m[1] || blocks.length + 1);
      newBlock(name, hint); return;
    }
    if ((m = RE_WEEK.exec(line))) {
      const a = +m[1]; let b = m[2] ? +m[2] : a;
      if (b < a) { errors.push({ line: ln, msg: `Week range ${a}-${b} is backwards` }); b = a; }
      if (b - a > 51) { errors.push({ line: ln, msg: 'A week range can span at most 52 weeks' }); b = a; }
      const rest = (m[3] || '').trim();
      const deload = /deload/i.test(rest);
      const label = rest.replace(/\(?\bdeload\b\)?/ig, '').replace(/^[\s:\-–—()]+|[\s:\-–—()]+$/g, '');
      newGroup(a, b, label, deload); return;
    }
    if ((m = RE_DAY.exec(line))) {
      const name = (m[2] || '').trim() || ('Day ' + (m[1] || (grp ? grp.days.length + 1 : 1)));
      newDay(name); return;
    }
    const ex = parseExerciseLine(line, ln, errors, warnings);
    if (!ex) return;
    if (!day) newDay('Day ' + (grp ? grp.days.length + 1 : 1));
    day.exercises.push(ex);
  });

  // expand week ranges (with optional per-week % ramp)
  const outBlocks = [];
  blocks.forEach((b, bi) => {
    const weeks = [];
    b.groups.forEach(g => {
      for (let n = g.from; n <= g.to; n++) {
        const k = n - g.from;
        const days = g.days.filter(d => d.exercises.length).map(d => ({
          name: d.name,
          exercises: d.exercises.map(ex => ({
            name: ex.name,
            sets: ex.sets.map(s => ({
              reps: s.reps, repsText: s.repsText,
              int: s.int ? (s.int.t === 'pct' ? { t: 'pct', v: r2(s.int.v + (s.int.ramp || 0) * k) } : Object.assign({}, s.int)) : null
            }))
          }))
        }));
        if (!days.length) { if (k === 0) warnings.push({ line: 0, msg: `Week ${n} has no exercises — skipped` }); continue; }
        weeks.push({ num: n, label: 'Week ' + n, note: g.label || '', deload: !!g.deload, days });
      }
    });
    if (weeks.length) outBlocks.push({ name: b.name, weeks });
    else warnings.push({ line: 0, msg: `Block "${b.name}" has no workouts — skipped` });
  });
  return finishParse({ name: progName, blocks: outBlocks }, errors, warnings);
}

function finishParse(program, errors, warnings) {
  const names = new Set();
  let weeks = 0, sessions = 0;
  program.blocks.forEach(b => b.weeks.forEach(w => { weeks++; w.days.forEach(d => { sessions++; d.exercises.forEach(e => names.add(keyOf(e.name))); }); }));
  if (!sessions && !errors.length) errors.push({ line: 0, msg: 'No workouts found. Add at least one exercise line like "Squat 4x6 @ 75%".' });
  return { program, errors, warnings, stats: { blocks: program.blocks.length, weeks, sessions, exercises: names.size } };
}

/** JSON import (same structure the app stores). */
function normalizeProgramJSON(o) {
  const errors = [], warnings = [];
  const normInt = i => {
    if (!i || typeof i !== 'object') return null;
    if (i.t === 'pct' && Number(i.v) > 0 && Number(i.v) <= 120) return { t: 'pct', v: Number(i.v) };
    if (i.t === 'label' && LABELS[i.v]) return { t: 'label', v: i.v };
    if (i.t === 'abs' && Number(i.v) > 0) return { t: 'abs', v: Number(i.v) };
    return null;
  };
  const prog = { name: o && o.name ? String(o.name) : null, blocks: [] };
  if (!o || !Array.isArray(o.blocks)) { errors.push({ line: 0, msg: 'JSON needs a "blocks" array' }); return finishParse(prog, errors, warnings); }
  o.blocks.forEach((b, bi) => {
    const blk = { name: String((b && b.name) || 'Block ' + (bi + 1)), weeks: [] };
    ((b && b.weeks) || []).forEach((w, wi) => {
      const num = Number.isFinite(+w.num) && +w.num > 0 ? +w.num : wi + 1;
      const wk = { num, label: String(w.label || 'Week ' + num), note: String(w.note || ''), deload: !!w.deload, days: [] };
      (w.days || []).forEach((d, di) => {
        const dy = { name: String(d.name || 'Day ' + (di + 1)), exercises: [] };
        (d.exercises || []).forEach(e => {
          if (!e || !e.name || !Array.isArray(e.sets) || !e.sets.length) { warnings.push({ line: 0, msg: 'Skipped an exercise without name/sets' }); return; }
          dy.exercises.push({
            name: String(e.name).trim(),
            sets: e.sets.map(s => {
              const reps = clamp(parseInt(s.reps, 10) || 1, 1, 100);
              return { reps, repsText: String(s.repsText || reps), int: normInt(s.int) };
            })
          });
        });
        if (dy.exercises.length) wk.days.push(dy);
      });
      if (wk.days.length) blk.weeks.push(wk);
    });
    if (blk.weeks.length) prog.blocks.push(blk);
  });
  return finishParse(prog, errors, warnings);
}

function parseInput(text, nameField) {
  const t = String(text || '').trim();
  let r;
  if (t.startsWith('{')) {
    try { r = normalizeProgramJSON(JSON.parse(t)); }
    catch (e) { r = finishParse({ name: null, blocks: [] }, [{ line: 0, msg: 'Invalid JSON: ' + e.message }], []); }
  } else r = parseProgramText(t);
  r.program.name = String(nameField || '').trim() || r.program.name || 'My Program';
  return r;
}

function groupSets(sets) {
  const out = [];
  sets.forEach(s => {
    const k = s.repsText + '|' + JSON.stringify(s.int || null);
    const l = out[out.length - 1];
    if (l && l.k === k) l.n++; else out.push({ k, n: 1, repsText: s.repsText, int: s.int });
  });
  return out;
}
const prescText = sets => groupSets(sets).map(g => `${g.n}×${g.repsText}${g.int ? ' @ ' + intName(g.int) : ''}`).join(', ');

function serializeProgram(p) {
  const out = [];
  p.blocks.forEach((b, bi) => {
    if (bi) out.push('');
    out.push(`BLOCK ${bi + 1}: ${b.name}`);
    b.weeks.forEach(w => {
      out.push(`WEEK ${w.num}${w.deload ? ' DELOAD' : ''}${w.note ? ' - ' + w.note : ''}`);
      w.days.forEach(d => {
        out.push(`DAY: ${d.name}`);
        d.exercises.forEach(ex => out.push(`${ex.name} ${groupSets(ex.sets).map(g => `${g.n}x${g.repsText}${g.int ? ' @ ' + intName(g.int) : ''}`).join(', ')}`));
      });
    });
  });
  return out.join('\n');
}

const flatSessions = p => {
  const out = [];
  p.blocks.forEach((b, bi) => b.weeks.forEach((w, wi) => w.days.forEach((d, di) => out.push({ b: bi, w: wi, d: di }))));
  return out;
};
const skey = (b, w, d) => b + '.' + w + '.' + d;
function doneKeys(p) {
  const set = new Set();
  S.logs.forEach(l => { if (l.programId === p.id && (l.cycle || 1) === (p.cycle || 1)) set.add(skey(l.b, l.w, l.d)); });
  return set;
}
function nextSession(p) {
  const done = doneKeys(p);
  return flatSessions(p).find(s => !done.has(skey(s.b, s.w, s.d))) || null;
}
const getProgram = id => S.programs.find(p => p.id === id) || null;
function activeProgram() {
  let p = getProgram(S.activeProgramId);
  if (!p && S.programs.length) { p = S.programs[0]; S.activeProgramId = p.id; }
  return p;
}
function missingFor(p) {
  const miss = new Map();
  p.blocks.forEach(b => b.weeks.forEach(w => w.days.forEach(d => d.exercises.forEach(ex => {
    if (!getLift(ex.name) && ex.sets.some(s => s.int && s.int.t !== 'abs')) miss.set(keyOf(ex.name), ex.name);
  }))));
  return [...miss.values()];
}
function missingLifts(p) {
  const miss = new Map();
  (p ? [p] : S.programs).forEach(pr => missingFor(pr).forEach(n => miss.set(keyOf(n), n)));
  return [...miss.values()];
}

/* ---------------------------------------------------------------------
   4. Workout session
   --------------------------------------------------------------------- */
function createSession(p, b, w, d) {
  const day = p.blocks[b].weeks[w].days[d];
  return {
    id: uid(), programId: p.id, cycle: p.cycle || 1, b, w, d,
    startedAt: null, changes: [], reg: {}, coached: {},
    exercises: day.exercises.map(ex => ({
      id: uid(), name: ex.name,
      sets: ex.sets.map(s => ({
        id: uid(), targetReps: s.reps, repsText: s.repsText, int: s.int ? Object.assign({}, s.int) : null,
        wIn: '', rIn: '', done: false, targetWeight: null, weight: null, reps: null, e1rm: null, status: null, change: null
      }))
    }))
  };
}
const sessionHasLogged = s => !!s && s.exercises.some(e => e.sets.some(x => x.done));
function sessionValid(s) {
  const p = s && getProgram(s.programId);
  return !!(p && p.blocks[s.b] && p.blocks[s.b].weeks[s.w] && p.blocks[s.b].weeks[s.w].days[s.d]);
}
function ensureSession() {
  const p = activeProgram();
  if (!p) return null;
  if (S.session && !sessionValid(S.session)) S.session = null;
  if (!S.session) {
    const n = nextSession(p);
    if (n) { S.session = createSession(p, n.b, n.w, n.d); save(); }
  }
  return S.session;
}
const liveTarget = (ex, set) => targetFor(ex.name, set.int);

function logSet(ex, set) {
  const s = S.session;
  const lift = getLift(ex.name);
  const tw = liveTarget(ex, set);
  let w = num(set.wIn), r = num(set.rIn);
  if (w == null) w = tw;
  if (w == null && !set.int) w = 0;            // accessory / bodyweight set with no prescribed load
  if (r == null) r = set.targetReps;
  if (w == null) { toast('Enter the weight you used first', 'warn'); return false; }
  w = Math.max(0, w); r = Math.max(0, Math.round(r));
  if (!s.startedAt) s.startedAt = Date.now();

  const before = lift ? lift.e1rm : null;
  const res = classify({ weight: w, reps: r, targetWeight: tw, targetReps: set.targetReps, e1rmBefore: before });
  set.done = true; set.weight = w; set.reps = r; set.targetWeight = tw;
  set.e1rm = res.e ? r1(res.e) : null; set.status = res.status; set.change = null;
  set.wIn = fmt(w); set.rIn = String(r);
  const u = S.settings.units;
  const key = keyOf(ex.name);

  if (res.status === 'exceeded') {
    const prev = lift.e1rm, next = r1(res.e);
    if (next > prev * 1.2 && !confirm(`${ex.name}: ${fmt(w)}${u} × ${r} suggests an e1RM of ${fmt(next)}${u} (currently ${fmt(prev)}${u}).\n\nUpdate your e1RM? Cancel if that was a typo.`)) {
      set.status = 'logged';
    } else {
      setE1rm(lift, next, `Set: ${fmt(w)}×${r}`);
      set.change = { kind: 'bump', prev, next };
      s.changes.push({ key, name: ex.name, prev, next, kind: 'bump', setId: set.id });
      toast(`${ex.name} e1RM ${fmt(prev)} → ${fmt(next)}${u} — future targets updated`, 'pr', 3600);
    }
  } else if (res.status === 'fail') {
    if (lift) {
      const reg = s.reg[key] || (s.reg[key] = { drop: 0 });
      if (res.drop > reg.drop) {
        const factor = (1 - res.drop / 100) / (1 - reg.drop / 100);
        const prev = lift.e1rm, next = r1(prev * factor);
        setE1rm(lift, next, `Missed reps (−${res.drop}%)`);
        set.change = { kind: 'drop', prev, next, prevDrop: reg.drop, drop: res.drop };
        reg.drop = res.drop;
        s.changes.push({ key, name: ex.name, prev, next, kind: 'drop', setId: set.id });
        toast(`${ex.name}: ${r}/${set.targetReps} reps. e1RM trimmed ${res.drop}% to ${fmt(next)}${u} — remaining sets are lighter.`, 'err', 4200);
      } else toast(`${ex.name}: ${r}/${set.targetReps} reps — e1RM already backed off this session.`, 'err', 3200);
    } else toast(`${ex.name}: ${r}/${set.targetReps} reps.`, 'err', 3200);
    maybeAutoCoach(ex, set, res);
  } else if (res.status === 'minor') {
    toast(`So close — ${r}/${set.targetReps}. No change to your max; weight is held steady.`, 'warn', 3200);
  }
  try { navigator.vibrate && navigator.vibrate(12); } catch (e) { /* ignore */ }
  return true;
}

function unlogSet(ex, set) {
  const s = S.session;
  const ch = set.change;
  if (ch) {
    const lift = getLift(ex.name);
    if (lift && Math.abs(lift.e1rm - ch.next) < 0.001) {       // only undo if nothing changed it since
      revertE1rm(lift, ch.prev, ch.next);
      if (ch.kind === 'drop') { const reg = s.reg[keyOf(ex.name)]; if (reg) reg.drop = ch.prevDrop; }
    }
    s.changes = s.changes.filter(c => c.setId !== set.id);
  }
  set.done = false; set.change = null; set.status = null; set.e1rm = null; set.weight = null; set.reps = null; set.targetWeight = null;
}

function outcomeOf(ex) {
  const done = ex.sets.filter(s => s.done);
  if (!done.length) return { outcome: 'skipped', done };
  const has = st => done.some(s => s.status === st);
  const exceeded = has('exceeded');
  const outcome = has('fail') ? 'fail' : has('minor') ? 'minor' : exceeded ? 'exceeded' : has('hit') ? 'hit' : has('adjusted') ? 'adjusted' : 'logged';
  return { outcome, exceeded, done };
}

function finishWorkout() {
  const s = S.session;
  if (!s) return;
  const total = s.exercises.reduce((n, e) => n + e.sets.length, 0);
  const done = s.exercises.reduce((n, e) => n + e.sets.filter(x => x.done).length, 0);
  if (!done) { toast('Log at least one set first', 'warn'); return; }
  if (done < total && !confirm(`${plural(total - done, 'set')} not logged — they will be skipped. Finish workout?`)) return;
  const p = getProgram(s.programId), blk = p.blocks[s.b], wk = blk.weeks[s.w], dy = wk.days[s.d];
  const exs = []; let volume = 0;
  s.exercises.forEach(ex => {
    const o = outcomeOf(ex);
    if (o.outcome === 'skipped') { exs.push({ name: ex.name, outcome: 'skipped', sets: [], skipped: ex.sets.length }); return; }
    const sets = o.done.map(x => {
      volume += (x.weight || 0) * (x.reps || 0);
      return { targetWeight: x.targetWeight, targetReps: x.targetReps, repsText: x.repsText, int: x.int, weight: x.weight, reps: x.reps, e1rm: x.e1rm, status: x.status };
    });
    const lift = getLift(ex.name);
    if (lift) {
      lift.hold = null;                                           // last hold has now been used
      if (o.outcome === 'minor' && !o.exceeded) {                 // minor miss → hold the weight for next time
        const hw = Math.max(...o.done.filter(x => x.status === 'minor').map(x => x.weight));
        if (hw > 0) lift.hold = { weight: hw, from: Date.now(), reason: 'Minor miss' };
      }
    }
    exs.push({ name: ex.name, outcome: o.outcome, exceeded: !!o.exceeded, sets, skipped: ex.sets.length - o.done.length });
  });
  const chMap = new Map();
  s.changes.forEach(c => { const e = chMap.get(c.key); if (e) e.to = c.next; else chMap.set(c.key, { name: c.name, from: c.prev, to: c.next }); });
  const changes = [...chMap.values()].filter(c => Math.abs(c.from - c.to) > 0.001);
  const log = {
    id: uid(), t: Date.now(), startedAt: s.startedAt, durationMin: s.startedAt ? Math.max(1, Math.round((Date.now() - s.startedAt) / 60000)) : null,
    programId: p.id, programName: p.name, cycle: s.cycle || 1, b: s.b, w: s.w, d: s.d,
    blockName: blk.name, weekLabel: wk.label, deload: !!wk.deload, dayName: dy.name,
    volume: Math.round(volume), exercises: exs, changes, units: S.settings.units
  };
  S.logs.unshift(log);
  S.session = null;
  save(true);
  render();
  window.scrollTo(0, 0);
  showSummary(log);
}

   5. Gemini coach
   --------------------------------------------------------------------- */
const COACH_SYSTEM = `You are Coach Alex — an empathetic, motivating, evidence-based strength coach inside the AutoCoach Lift app.

Voice: warm, direct, human. Plain language, never robotic or preachy. At most one or two emoji.
Substance: ground everything in the data you are given (target vs actual reps and weights, e1RM, block/week, deload weeks, recent sessions). Use sound strength-training principles: autoregulation, fatigue management, RIR/RPE, progressive overload, rest periods, sleep, nutrition, technique cues, smart deloads.
Rules:
- Keep replies under about 170 words unless asked for more. Short paragraphs, at most 3 bullets.
- Never invent numbers that are not in the data.
- Never shame the lifter. A missed set is information, not failure.
- You are not a doctor. If the lifter mentions sharp pain, numbness, or injury (not ordinary muscular effort), tell them to stop and see a qualified professional.
- If asked about something unrelated to training, answer briefly and steer back.
- Reply in the language the lifter writes in (English by default).
- Plain text with light markdown (bold, bullet lists) only.`;

const CONVERT_SYSTEM = `You convert workout programs into AutoCoach's plain-text format. Output ONLY the converted program text — no commentary, no code fences.

Format:
BLOCK 1: Name            (one per training block / mesocycle)
WEEK 1-3                 (weeks with identical workouts may share a range; "WEEK 4 DELOAD" marks a deload week)
DAY: Name
Exercise Name SETSxREPS @ INTENSITY     (one exercise per line)

INTENSITY is a percentage of 1RM (75%), a label (Heavy, Medium, Light) or omitted for accessories/bodyweight work.
Several set groups on one line are comma separated: Squat 1x3 @ 85%, 3x5 @ 75%
If the % rises by a fixed step each week across a WEEK range, append +step: Squat 4x6 @ 70%+2.5
Rep ranges: 8-10. AMRAP / "5+" for as-many-as-possible.
Expand supersets and circuits into separate exercise lines. Keep the original exercise names. Do not invent exercises.`;

let coachBusy = false;

async function callGemini(userText, system, opts = {}) {
  const key = S.settings.apiKey;
  if (!key) throw new Error('NO_KEY');
  const model = (S.settings.model || 'gemini-2.5-flash').trim();
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  const body = {
    systemInstruction: { parts: [{ text: system }] },
    contents: [{ role: 'user', parts: [{ text: userText }] }],
    generationConfig: { temperature: opts.temperature ?? 0.8, maxOutputTokens: opts.maxTokens ?? 900 }
  };
  if (/2\.5-flash/i.test(model) && !/pro/i.test(model)) body.generationConfig.thinkingConfig = { thinkingBudget: 0 };
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), opts.timeout ?? 40000);
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify(body), signal: ctl.signal
    });
    let data = null;
    try { data = await res.json(); } catch (e) { /* non-JSON error body */ }
    if (!res.ok) throw new Error((data && data.error && data.error.message) || `HTTP ${res.status}`);
    const cand = data && data.candidates && data.candidates[0];
    const text = ((cand && cand.content && cand.content.parts) || []).map(p => p.text || '').join('').trim();
    if (!text) throw new Error(data && data.promptFeedback && data.promptFeedback.blockReason ? 'Blocked: ' + data.promptFeedback.blockReason : 'Empty response from Gemini');
    return text;
  } finally { clearTimeout(timer); }
}
function friendlyErr(e) {
  const m = String((e && e.message) || e);
  if (e && e.name === 'AbortError') return 'the request timed out';
  if (/API key not valid|API_KEY_INVALID|API key expired/i.test(m)) return 'the API key was not accepted';
  if (/quota|RESOURCE_EXHAUSTED|429/i.test(m)) return 'rate limit reached — try again in a minute';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'no connection';
  if (/not found|404/i.test(m)) return 'model not found — check the model name in Settings';
  return m.slice(0, 160);
}

const STATUS = { hit: 'Hit', exceeded: 'Up ↑', minor: 'Close', fail: 'Missed', adjusted: 'Adjusted', logged: 'Logged' };
const STATUS_LONG = { hit: 'target met', exceeded: 'beat target, e1RM raised', minor: 'minor miss', fail: 'SIGNIFICANT MISS', adjusted: 'lifter chose a lighter weight', logged: 'logged' };

function logLines(l, detailed) {
  const u = l.units || S.settings.units;
  const L = [`${fmtDate(l.t)} — ${l.dayName} (${l.blockName}, ${l.weekLabel}${l.deload ? ', deload' : ''})`];
  l.exercises.forEach(ex => {
    if (ex.outcome === 'skipped') { L.push(`  ${ex.name}: skipped`); return; }
    const sets = ex.sets.map(s => `${fmt(s.weight)}${u}×${s.reps}${s.targetWeight != null ? ` (target ${fmt(s.targetWeight)}×${s.targetReps}${detailed ? ', ' + STATUS_LONG[s.status] : ''})` : ''}`);
    L.push(`  ${ex.name}: ${sets.join('; ')}`);
  });
  (l.changes || []).forEach(c => L.push(`  e1RM change: ${c.name} ${fmt(c.from)} → ${fmt(c.to)}${u}`));
  return L;
}
function workoutContext(opts = {}) {
  const u = S.settings.units, L = [];
  L.push(`Units: ${u}`);
  const s = S.session;
  if (opts.log) {
    L.push('FINISHED WORKOUT:'); L.push(...logLines(opts.log, true));
  } else if (s && sessionValid(s)) {
    const p = getProgram(s.programId), blk = p.blocks[s.b], wk = blk.weeks[s.w], dy = wk.days[s.d];
    L.push(`CURRENT WORKOUT — Program: ${p.name} | Block ${s.b + 1}/${p.blocks.length}: ${blk.name} | ${wk.label} (week ${s.w + 1} of ${blk.weeks.length} in block)${wk.deload ? ' — DELOAD WEEK' : ''}${wk.note ? ' — ' + wk.note : ''} | Session: ${dy.name}`);
    s.exercises.forEach(ex => {
      const l = getLift(ex.name);
      L.push(`${ex.name}${l ? ` (current e1RM ${fmt(l.e1rm)}${u}, baseline ${fmt(l.baseline)}${u})` : ' (no 1RM on file)'}`);
      ex.sets.forEach((st, i) => {
        const tw = st.done ? st.targetWeight : liveTarget(ex, st);
        const tgt = `${tw != null ? fmt(tw) + u : 'free load'} × ${st.repsText}`;
        L.push(st.done
          ? `  Set ${i + 1}: target ${tgt} → actual ${fmt(st.weight)}${u} × ${st.reps} (e1RM ${fmt(st.e1rm)}) [${STATUS_LONG[st.status]}]`
          : `  Set ${i + 1}: target ${tgt} → not done yet`);
      });
    });
    s.changes.forEach(c => L.push(`Auto-regulation today: ${c.name} e1RM ${fmt(c.prev)} → ${fmt(c.next)}${u} (${c.kind === 'drop' ? 'reduced after missed reps' : 'raised after beating target'})`));
  } else L.push('No workout is currently in progress.');
  const recent = S.logs.filter(l => !opts.log || l.id !== opts.log.id).slice(0, 3);
  if (recent.length) { L.push('', 'RECENT SESSIONS:'); recent.forEach(l => L.push(...logLines(l, false))); }
  return L.join('\n');
}
function transcript() {
  const msgs = S.coach.filter(m => m.role !== 'sys').slice(-8);
  if (!msgs.length) return '(no earlier messages)';
  return msgs.map(m => `${m.role === 'user' ? 'Lifter' : 'Coach Alex'}: ${m.text.slice(0, 600)}`).join('\n');
}
function coachPrompt(kind, o = {}) {
  const tasks = {
    fail: `The lifter just logged an underperformed set: ${o.detail}. Reply now, under 150 words: (1) one sincere, empathetic sentence; (2) the most likely reasons given the data; (3) two or three concrete adjustments for the rest of today and the next session (load, rest, cues, volume); (4) a motivating close.`,
    manual: 'The lifter tapped "Get AI Coach Feedback / Advice". Review the current workout and recent history. Give honest feedback on how it is going and the most useful advice for the rest of today and the next session.',
    summary: 'The lifter just finished the workout shown above. Give a short debrief: what went well, what to watch, and one concrete focus for the next session.',
    chat: `The lifter says: "${o.text}"\nAnswer helpfully using the data above where relevant.`
  };
  return `[DATA]\n${workoutContext(o)}\n\n[CONVERSATION SO FAR]\n${transcript()}\n\n[TASK]\n${tasks[kind]}`;
}
function localCoach(kind, o = {}) {
  const u = S.settings.units;
  if (kind === 'fail') {
    return `That set didn't go to plan — and that's okay. One tough set is information, not a verdict on your training. ${o.detail}.\n\n- Take 3–5 minutes before the next set and keep the bar speed crisp\n- Stay 1–2 reps shy of failure on the rest of today's sets\n- Check the basics: sleep, food and stress over the last few days\n\nYour working e1RM has been trimmed automatically so the remaining targets are realistic. Add a Gemini API key in Settings for personalised coaching.`;
  }
  if (kind === 'summary') return `Nice work getting it done. Compare today with last time, note anything that felt off, and keep the next session simple: hit the prescribed numbers and let the app handle progression. Add a Gemini API key in Settings for a personalised debrief.`;
  if (kind === 'chat') return `I can give you much better answers with the Gemini API key connected — open **Settings** and paste it in. Meanwhile: sleep 7+ hours, eat enough protein, and prioritise clean reps at the prescribed weights (${u}).`;
  return `Here's the general picture without the AI connected: stick to the prescribed weights, stop sets 1–2 reps short of failure unless the program says otherwise, and use deload weeks properly. Add your Gemini API key in **Settings** and I'll review your actual numbers.`;
}

function addCoach(role, text, meta) {
  S.coach.push(Object.assign({ id: uid(), role, text, t: Date.now() }, meta || {}));
  if (S.coach.length > 80) S.coach.splice(0, S.coach.length - 80);
  save();
}
async function requestCoach(kind, o = {}) {
  if (coachBusy) { toast('Coach Alex is still typing…'); return; }
  if (!S.settings.apiKey) {
    addCoach('coach', localCoach(kind, o), { local: true });
    refreshCoachUI();
    if (kind !== 'fail') toast('Add your Gemini API key in Settings for personalised coaching', 'warn', 3600);
    return;
  }
  coachBusy = true; refreshCoachUI();
  try {
    const text = await callGemini(coachPrompt(kind, o), COACH_SYSTEM);
    addCoach('coach', text);
  } catch (e) {
    console.warn('Gemini error', e);
    addCoach('coach', localCoach(kind, o), { local: true });
    addCoach('sys', `Couldn't reach Gemini: ${friendlyErr(e)}. Showing offline tips instead.`);
  } finally { coachBusy = false; refreshCoachUI(); }
}
function maybeAutoCoach(ex, set, res) {
  if (!S.settings.autoCoach) return;
  const s = S.session, key = keyOf(ex.name);
  if (s.coached[key]) return;
  s.coached[key] = true;
  const u = S.settings.units;
  const detail = `${ex.name}: ${fmt(set.weight)}${u} × ${set.reps} vs target ${fmt(set.targetWeight)}${u} × ${set.targetReps} (${res.short} rep${res.short === 1 ? '' : 's'} short)`;
  requestCoach('fail', { detail });
}

/* lightweight, XSS-safe markdown (escape first, then format) */
function md(src) {
  const lines = esc(src).split('\n');
  let out = '', list = null;
  const inl = t => t
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/(^|[\s(])_([^_\s][^_]*)_(?=[\s).,!?:;]|$)/g, '$1<em>$2</em>');
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  lines.forEach(ln => {
    let m;
    if ((m = /^\s*[-*•]\s+(.*)$/.exec(ln))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inl(m[1])}</li>`; }
    else if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(ln))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${inl(m[1])}</li>`; }
    else if (!ln.trim()) close();
    else { close(); const h = /^#{1,4}\s+(.*)$/.exec(ln); out += h ? `<p><strong>${inl(h[1])}</strong></p>` : `<p>${inl(ln)}</p>`; }
  });
  close();
  return out;
}

function setRowHTML(ex, ei, s, si) {

/* ---- Programs ---- */

  let weeks = 0; p.blocks.forEach(b => { weeks += b.weeks.length; });

}

/* ---- Lifts ---- */
function spark(vals) {
  if (vals.length < 2) return '';
  const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * 200).toFixed(1)},${(36 - ((v - min) / span) * 32).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function viewLifts() {
  const u = S.settings.units;
  const lifts = Object.entries(S.lifts).sort((a, b) => a[1].name.localeCompare(b[1].name));
  const miss = missingLifts();
  let h = `<div class="section-h" style="margin-top:4px"><h2>Your lifts</h2><button class="btn sm pri" data-action="new-lift">${icon('plus', 15)} Add lift</button></div>
    <p class="muted small" style="margin:-4px 2px 12px">Baseline = what you entered. <b>e1RM</b> is the live number all targets use — it rises when you beat targets and eases back after big misses.</p>`;
  if (miss.length) {
    h += `<section class="card" style="border-color:rgba(251,191,36,.35)"><b>Needs a 1RM</b><div class="muted small">Used in your programs but not set yet.</div>
      ${miss.map(n => `<div class="miss-row"><span class="grow" style="min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(n)}</span><input class="txt" inputmode="decimal" placeholder="${u}" aria-label="1RM for ${esc(n)}"><button class="btn sm pri" data-action="save-missing" data-name="${esc(n)}">Save</button></div>`).join('')}</section>`;
  }
  if (!lifts.length && !miss.length) {
    h += `<section class="card hero"><p class="muted">Add your baseline 1RMs (e.g. Squat 140, Bench Press 100, Deadlift 180). Not sure? Use a recent heavy set: weight × (1 + reps ÷ 30).</p><div class="stack" style="margin-top:14px"><button class="btn pri block" data-action="new-lift">Add a lift</button></div></section>`;
  }
  lifts.forEach(([k, l]) => {
    const d = l.e1rm - l.baseline;
    const vals = l.history.map(x => x.v);
    const t = lbl => fmt(roundInc(l.e1rm * S.settings.labels[lbl] / 100));
    h += `<section class="card">
      <div class="row between gap"><div style="min-width:0"><b style="font-size:17px">${esc(l.name)}</b>${l.hold ? `<div class="muted xs">Holding ≤ ${fmt(l.hold.weight)}${u} next time</div>` : ''}</div>
        <button class="btn sm" data-action="edit-lift" data-key="${esc(k)}">Edit</button></div>
      <div class="row between" style="margin-top:10px;align-items:flex-end"><div class="big">${fmt(l.e1rm)}<small>${u} e1RM</small></div>
        <span class="delta ${d > 0.04 ? 'up' : d < -0.04 ? 'down' : ''}">${d > 0.04 ? '▲' : d < -0.04 ? '▼' : '='} ${fmt(Math.abs(d))}${u} vs baseline</span></div>
      ${spark(vals)}
      <div class="kv"><div><span>Heavy ${fmt(S.settings.labels.heavy)}%</span><b>${t('heavy')}${u}</b></div><div><span>Medium ${fmt(S.settings.labels.medium)}%</span><b>${t('medium')}${u}</b></div><div><span>Light ${fmt(S.settings.labels.light)}%</span><b>${t('light')}${u}</b></div></div>
    </section>`;
  });
  return h;
}

      <div style="margin-top:12px"><button class="btn sm danger" data-action="del-log" data-id="${l.id}">Delete workout</button></div></details>`;
  });

function outcomeChip(o) {
  const map = { hit: ['acc', 'Target met'], exceeded: ['pr', 'New e1RM'], minor: ['warn', 'Minor miss · hold'], fail: ['bad', 'Missed · e1RM eased'], adjusted: ['', 'Adjusted'], logged: ['', 'Logged'], skipped: ['', 'Skipped'] };
  const [c, t] = map[o] || ['', o];
  return `<span class="chip ${c}">${t}</span>`;
}

/* ---------------------------------------------------------------------

let modalCtx = null;
function openModal({ title, body, footer, onMount, onClose, actions }) {
  closeModal(true);
  const root = $('#modal-root');
  root.innerHTML = `<div class="wrapm"><div class="backdrop" data-action="close-modal"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="sheet-h"><h2>${esc(title)}</h2><button class="icon-btn" data-action="close-modal" aria-label="Close">${icon('x', 20)}</button></div>
      <div class="sheet-b">${body}</div>${footer ? `<div class="sheet-f">${footer}</div>` : ''}</div></div>`;
  root.style.pointerEvents = 'auto';
  document.body.classList.add('noscroll');
  requestAnimationFrame(() => { const w = root.firstElementChild; if (w) w.classList.add('show'); });
  modalCtx = { onClose, actions: actions || {} };
  if (onMount) onMount(root);
}
function closeModal(silent) {
  const root = $('#modal-root');
  root.innerHTML = ''; root.style.pointerEvents = 'none';
  document.body.classList.remove('noscroll');
  const c = modalCtx; modalCtx = null;
  if (!silent && c && c.onClose) c.onClose();
}
function toast(msg, kind = 'info', ms = 2800) {
  const root = $('#toast-root');
  while (root.children.length >= 3) root.firstChild.remove();
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = msg; el.setAttribute('role', 'status');
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 260); }, ms);
}

    footer: `<button class="btn ghost" data-action="close-modal">Cancel</button><button class="btn pri grow" data-action="m:save">Save settings</button>`,
    actions: {
      togglekey() { const i = $('#sKey'), b = $('#sKeyBtn'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show'; },
      save() {
        const H = num($('#sH').value), M = num($('#sM').value), L = num($('#sL').value);
        if ([H, M, L].some(v => v == null || v < 20 || v > 110)) { toast('Intensity labels must be between 20 and 110%', 'err'); return; }
        S.settings.apiKey = $('#sKey').value.trim();
        S.settings.model = $('#sModel').value.trim() || 'gemini-2.5-flash';
        S.settings.autoCoach = $('#sAuto').checked;
        S.settings.units = $('#sUnits').value;
        S.settings.rounding = Number($('#sRound').value);
        S.settings.labels = { heavy: H, medium: M, light: L };
        save(true); closeModal(true); render(true); toast('Settings saved', 'ok');
      },
      async testkey(el) {
        const prev = { key: S.settings.apiKey, model: S.settings.model };
        S.settings.apiKey = $('#sKey').value.trim(); S.settings.model = $('#sModel').value.trim() || 'gemini-2.5-flash';
        el.disabled = true; el.textContent = 'Testing…';
        try { await callGemini('Reply with the single word: OK', 'You are a connectivity test. Reply with one word.', { maxTokens: 16, temperature: 0 }); toast('Gemini connection works ✓', 'ok'); }
        catch (e) { toast(e.message === 'NO_KEY' ? 'Paste your API key first' : 'Test failed: ' + friendlyErr(e), 'err', 4500); }
        finally { S.settings.apiKey = prev.key; S.settings.model = prev.model; el.disabled = false; el.textContent = 'Test API key'; }
      },
      export() {
        const copy = clone(S); copy.settings.apiKey = ''; copy.session = null;
        const blob = new Blob([JSON.stringify(copy, null, 1)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `autocoach-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        toast('Backup downloaded', 'ok');
      },
      import() { $('#sFile').click(); },
      install() { if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; } },
      reset() {
        if (!confirm('Erase ALL data on this device (lifts, programs, logs, chat, API key)? This cannot be undone.')) return;
        try { localStorage.removeItem(LS_KEY); } catch (e) { /* ignore */ }
        S = defaults(); closeModal(true); render(); window.scrollTo(0, 0); toast('All data erased');
      }
    },
    onMount(root) {
      $('#sFile', root).addEventListener('change', e => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          try {
            const o = JSON.parse(rd.result);
            if (!o || typeof o !== 'object' || !Array.isArray(o.programs) || !o.settings || typeof o.lifts !== 'object') throw new Error('not an AutoCoach backup');
            if (!confirm('Replace everything on this device with this backup?')) return;
            const key = S.settings.apiKey;
            localStorage.setItem(LS_KEY, JSON.stringify(o));
            S = loadState(); S.settings.apiKey = key; S.session = null;
            save(true); closeModal(true); render(); toast('Backup restored', 'ok');
          } catch (err) { toast('Import failed: ' + err.message, 'err', 4000); }
        };
        rd.readAsText(f);
      });
    }
  });
}

/* ---- Lift editor ---- */
function liftModal(key, presetName) {
  const l = key ? S.lifts[key] : null;
  const isNew = !l, u = S.settings.units;
  openModal({
    title: isNew ? 'Add lift' : 'Edit ' + l.name,
    body: `
      <div class="field"><label for="lName">Exercise name</label><input id="lName" class="txt" value="${esc(isNew ? (presetName || '') : l.name)}" ${isNew ? '' : 'readonly'} placeholder="e.g. Squat" autocomplete="off"></div>
      <div class="field"><label for="lBase">Baseline 1RM (${esc(u)})</label><input id="lBase" class="txt" inputmode="decimal" value="${isNew ? '' : fmt(l.baseline)}" placeholder="e.g. 140"></div>
      ${isNew ? '' : `<div class="field"><label for="lE1">Current e1RM (${esc(u)}) <button class="link" data-action="m:tobase">reset to baseline</button></label><input id="lE1" class="txt" inputmode="decimal" value="${fmt(l.e1rm)}"><div class="hint">Auto-adjusted from your logged sets. Targets = e1RM × prescribed %.</div></div>`}`,
    footer: `${isNew ? '' : '<button class="btn danger" data-action="m:del">Delete</button>'}<button class="btn ghost" data-action="close-modal">Cancel</button><button class="btn pri grow" data-action="m:save">Save</button>`,
    actions: {
      tobase() { $('#lE1').value = $('#lBase').value; },
      save() {
        const name = $('#lName').value.trim(), base = num($('#lBase').value);
        if (!name) { toast('Give the exercise a name', 'warn'); return; }
        if (!(base > 0)) { toast('Enter a baseline 1RM greater than 0', 'warn'); return; }
        const k = isNew ? keyOf(name) : key;
        if (isNew) {
          if (S.lifts[k]) { const ex = S.lifts[k]; ex.baseline = base; setE1rm(ex, base, 'Baseline set'); }
          else S.lifts[k] = newLift(name, base);
        } else {
          const e1 = num($('#lE1').value);
          if (!(e1 > 0)) { toast('Enter a valid e1RM', 'warn'); return; }
          l.baseline = base;
          if (Math.abs(e1 - l.e1rm) > 0.001) { setE1rm(l, r1(e1), 'Manual edit'); l.hold = null; }
        }
        save(true); closeModal(true); render(true); toast('Lift saved', 'ok');
      },
      del() {
        if (!confirm(`Delete ${l.name} and its 1RM history? Programs keep the exercise but lose its targets.`)) return;
        delete S.lifts[key]; save(true); closeModal(true); render(true);
      }
    },
    onMount() { setTimeout(() => { const i = $(isNew ? (presetName ? '#lBase' : '#lName') : '#lBase'); if (i) i.focus(); }, 280); }
  });
}

/* ---- Program editor ---- */
function previewHTML(r) {
  if (!r.stats.sessions && !r.errors.length) return '<div class="muted">Write or paste a program above — a live preview appears here.</div>';
  let h = '';
  if (r.errors.length) {
    h += `<div class="err">${r.errors.slice(0, 6).map(e => `<div>${e.line ? 'Line ' + e.line + ': ' : ''}${esc(e.msg)}</div>`).join('')}${r.errors.length > 6 ? `<div>…and ${r.errors.length - 6} more</div>` : ''}</div>`;
  } else {
    h += `<div class="okc">✓ ${plural(r.stats.blocks, 'block')} · ${plural(r.stats.weeks, 'week')} · ${plural(r.stats.sessions, 'session')} · ${plural(r.stats.exercises, 'exercise')}</div>`;
  }
  if (r.warnings.length) h += `<div class="wn">${r.warnings.slice(0, 4).map(w => `<div>${w.line ? 'Line ' + w.line + ': ' : ''}${esc(w.msg)}</div>`).join('')}${r.warnings.length > 4 ? `<div>…and ${r.warnings.length - 4} more notes</div>` : ''}</div>`;
  if (!r.errors.length) { const m = missingFor(r.program); if (m.length) h += `<div class="muted small" style="margin-top:6px">Needs a 1RM (add in Lifts): ${esc(m.join(', '))}</div>`; }
  return h;
}

WEEK 1-3                  ← weeks sharing the same workouts

        <p>Several set groups per line: <code>Squat 1x3 @ 85%, 3x5 @ 75%</code>. Lines starting with <code>//</code> are comments. You can also paste JSON.</p>
      </div>`,
    footer: `<button class="btn ghost" data-action="close-modal">Cancel</button><button class="btn pri grow" data-action="m:save">Save program</button>`,
    actions: {
      help() { const h = $('#pgHelp'); h.hidden = !h.hidden; },
      json() {
        const ta = $('#pgText'), btn = $('#pgJsonBtn');
        const asJson = ta.value.trim().startsWith('{');
        const r = parseInput(ta.value, $('#pgName').value);
        if (r.errors.length) { toast('Fix the problems first, then switch format', 'warn'); return; }
        if (asJson) { ta.value = serializeProgram(r.program); btn.textContent = 'View as JSON'; }
        else { ta.value = JSON.stringify({ name: r.program.name, blocks: r.program.blocks }, null, 1); btn.textContent = 'View as text'; }
        ta.dispatchEvent(new Event('input'));
      },
      async ai(el) {
        const ta = $('#pgText'), raw = ta.value.trim();
        if (!raw) { toast('Paste your program text first', 'warn'); return; }
        if (!S.settings.apiKey) { toast('Add your Gemini API key in Settings first', 'warn'); return; }
        const label = el.innerHTML; el.disabled = true; el.textContent = 'Converting…';
        try {
          let out = await callGemini(raw, CONVERT_SYSTEM, { maxTokens: 8192, temperature: 0.2, timeout: 60000 });
          out = out.replace(/^```[a-z]*\s*\n?/i, '').replace(/\n?```\s*$/, '').trim();
          ta.value = out; ta.dispatchEvent(new Event('input'));
          toast('Converted — review it, then save', 'ok', 3600);
        } catch (e) { toast('AI conversion failed: ' + friendlyErr(e), 'err', 4500); }
        finally { el.disabled = false; el.innerHTML = label; }
      },
      save() {
        const r = parseInput($('#pgText').value, $('#pgName').value);
        if (r.errors.length || !r.stats.sessions) { toast('Fix the highlighted problems first', 'err'); return; }
        let p;
        if (ex) {
          ex.name = r.program.name; ex.blocks = r.program.blocks; p = ex;
          if (S.session && S.session.programId === ex.id && !sessionHasLogged(S.session)) S.session = null;
        } else {
          p = { id: uid(), name: r.program.name, cycle: 1, created: Date.now(), blocks: r.program.blocks };
          S.programs.push(p);
          if (!S.activeProgramId || !getProgram(S.activeProgramId)) S.activeProgramId = p.id;
        }
        save(true); closeModal(true); render();
        const m = missingFor(p);
        toast(m.length ? `Saved. Add a 1RM for: ${m.join(', ')}` : 'Program saved', m.length ? 'warn' : 'ok', m.length ? 4800 : 2800);
      }
    },
    onMount(root) {
      const ta = $('#pgText', root), nm = $('#pgName', root), pv = $('#pgPreview', root);
      let t;
      const upd = () => {
        pv.innerHTML = previewHTML(parseInput(ta.value, nm.value));
        $('#pgJsonBtn', root).textContent = ta.value.trim().startsWith('{') ? 'View as text' : 'View as JSON';
      };
      ta.addEventListener('input', () => { clearTimeout(t); t = setTimeout(upd, 220); });
      nm.addEventListener('input', () => { clearTimeout(t); t = setTimeout(upd, 220); });
      $('#pgTpl', root).addEventListener('change', e => {
        const tpl = TEMPLATES[e.target.value]; if (!tpl) return;
        if (ta.value.trim() && !confirm('Replace the current text with this template?')) { e.target.value = ''; return; }
        if (!nm.value.trim()) nm.value = tpl.name;
        ta.value = tpl.text; e.target.value = ''; upd();
      });
      upd();
    }
  });
}

/* ---- Session picker ---- */
function pickSessionModal() {
  const p = (S.session && getProgram(S.session.programId)) || activeProgram();
  if (!p) return;
  const done = doneKeys(p);
  const cur = S.session && S.session.programId === p.id ? S.session : (nextSession(p) || { b: 0, w: 0, d: 0 });
  openModal({
    title: 'Choose session',
    body: `<div class="muted small" style="margin-bottom:12px">${esc(p.name)} — pick any block, week and day. Finished sessions are marked ✓.</div>
      <div class="field"><label for="psB">Block</label><select id="psB" class="txt"></select></div>
      <div class="field"><label for="psW">Week</label><select id="psW" class="txt"></select></div>
      <div class="field"><label for="psD">Day</label><select id="psD" class="txt"></select></div>`,
    footer: `<button class="btn ghost" data-action="close-modal">Cancel</button><button class="btn pri grow" data-action="m:load">Load session</button>`,
    actions: {
      load() {
        const b = +$('#psB').value, w = +$('#psW').value, d = +$('#psD').value;
        closeModal(true);
        startSession(p, b, w, d);
      }
    },
    onMount() {
      const sb = $('#psB'), sw = $('#psW'), sd = $('#psD');
      const fillB = () => { sb.innerHTML = p.blocks.map((b, i) => `<option value="${i}">${esc(b.name)}</option>`).join(''); };
      const fillW = b => { sw.innerHTML = p.blocks[b].weeks.map((w, i) => `<option value="${i}">${esc(w.label)}${w.deload ? ' (deload)' : ''}${w.days.every((_, di) => done.has(skey(b, i, di))) ? ' ✓' : ''}</option>`).join(''); };
      const fillD = (b, w) => { sd.innerHTML = p.blocks[b].weeks[w].days.map((d, i) => `<option value="${i}">${esc(d.name)}${done.has(skey(b, w, i)) ? ' ✓' : ''}</option>`).join(''); };
      fillB(); sb.value = cur.b; fillW(+sb.value); sw.value = cur.w; fillD(+sb.value, +sw.value); sd.value = cur.d;
      sb.addEventListener('change', () => { fillW(+sb.value); fillD(+sb.value, 0); });
      sw.addEventListener('change', () => fillD(+sb.value, +sw.value));
    }
  });
}
function startSession(p, b, w, d) {
  if (S.session && sessionHasLogged(S.session) && !confirm('You have sets logged in the current workout. Discard them and switch session?')) return false;
  S.activeProgramId = p.id;
  S.session = createSession(p, b, w, d);
  S.tab = 'train'; save(true); render(); window.scrollTo(0, 0);
  return true;
}

    title: 'Workout complete 🎉',

      <div style="margin-top:14px">${log.exercises.map(ex => `<div class="row between gap" style="padding:8px 0;border-bottom:1px solid var(--line)"><span style="min-width:0">${esc(ex.name)}</span>${outcomeChip(ex.outcome)}</div>`).join('')}</div>
      ${(log.changes || []).length ? `<div style="margin-top:14px"><div class="eyebrow" style="margin-bottom:6px">Auto-regulation</div>${log.changes.map(c => `<div class="small" style="margin:3px 0"><b>${esc(c.name)}</b> e1RM ${fmt(c.from)} → <b style="color:${c.to > c.from ? 'var(--ok)' : 'var(--bad)'}">${fmt(c.to)}${u}</b> · future targets updated</div>`).join('')}</div>` : ''}

    footer: `<button class="btn" data-action="m:coach">${icon('spark', 15)} Debrief with Coach</button><button class="btn pri grow" data-action="close-modal">Done</button>`,
    actions: { coach() { closeModal(true); setTab('coach'); requestCoach('summary', { log }); } }
  });
}
