function toggleSetAt(ei, si) {
  const s = S.session; if (!s) return;
  const ex = s.exercises[ei], set = ex && ex.sets[si]; if (!set) return;
  if (set.done) unlogSet(ex, set); else if (!logSet(ex, set)) return;
  save(); render(true);
}
function loadSample() {
  const t = TEMPLATES.block12;
  const r = parseInput(t.text, t.name);
  const p = { id: uid(), name: t.name, cycle: 1, created: Date.now(), blocks: r.program.blocks };
  S.programs.push(p); S.activeProgramId = p.id; S.session = null;
  const ex = { 'squat': ['Squat', 140], 'bench press': ['Bench Press', 100], 'deadlift': ['Deadlift', 180], 'overhead press': ['Overhead Press', 60] };
  let added = [];
  Object.entries(ex).forEach(([k, [n, v]]) => { if (!S.lifts[k]) { S.lifts[k] = newLift(n, v); added.push(n); } });
  S.tab = 'train'; save(true); render(); window.scrollTo(0, 0);
  toast(added.length ? 'Sample loaded with example 1RMs — edit them in Lifts' : 'Sample program loaded', 'ok', 3800);
}

const A = {
  'tab': el => setTab(el.dataset.tab),
  'open-settings': () => settingsModal(),
  'close-modal': () => closeModal(),
  'go-lifts': () => setTab('lifts'),
  'load-sample': () => loadSample(),
  'new-program': () => programModal(null),
  'edit-program': el => programModal(el.dataset.id),
  'dup-program': el => {
    const p = getProgram(el.dataset.id); if (!p) return;
    const c = clone(p); c.id = uid(); c.name = p.name + ' (copy)'; c.cycle = 1;
    S.programs.push(c); save(true); render(true); toast('Program duplicated', 'ok');
  },
  'del-program': el => {
    const p = getProgram(el.dataset.id); if (!p) return;
    if (!confirm(`Delete "${p.name}"? Workout history is kept.`)) return;
    S.programs = S.programs.filter(x => x.id !== p.id);
    if (S.session && S.session.programId === p.id) S.session = null;
    if (S.activeProgramId === p.id) S.activeProgramId = S.programs[0] ? S.programs[0].id : null;
    save(true); render(true);
  },
  'activate-program': el => {
    if (S.session && sessionHasLogged(S.session) && !confirm('You have sets logged in the current workout. Discard them and switch program?')) return;
    S.activeProgramId = el.dataset.id; S.session = null; save(true); render(true); toast('Program activated', 'ok');
  },
  'open-session': el => {
    const p = activeProgram(); if (!p) return;
    startSession(p, +el.dataset.b, +el.dataset.w, +el.dataset.d);
  },
  'restart-program': () => { const p = activeProgram(); if (!p) return; p.cycle = (p.cycle || 1) + 1; S.session = null; save(true); render(); window.scrollTo(0, 0); toast(`Cycle ${p.cycle} started`, 'ok'); },
  'pick-session': () => pickSessionModal(),
  'toggle-set': el => toggleSetAt(+el.dataset.ei, +el.dataset.si),
  'add-set': el => {
    const ex = S.session && S.session.exercises[+el.dataset.ei]; if (!ex) return;
    const last = ex.sets[ex.sets.length - 1];
    ex.sets.push({ id: uid(), targetReps: last.targetReps, repsText: last.repsText, int: last.int ? Object.assign({}, last.int) : null, wIn: '', rIn: '', done: false, targetWeight: null, weight: null, reps: null, e1rm: null, status: null, change: null });
    save(); render(true);
  },
  'del-set': el => {
    const ex = S.session && S.session.exercises[+el.dataset.ei]; if (!ex || ex.sets.length < 2) return;
    if (ex.sets[ex.sets.length - 1].done) { toast('Un-check the set first', 'warn'); return; }
    ex.sets.pop(); save(); render(true);
  },
  'finish': () => finishWorkout(),
  'discard': () => {
    if (!S.session) return;
    if (sessionHasLogged(S.session) && !confirm('Clear everything logged in this workout? Any e1RM changes from it are kept unless you un-check the sets.')) return;
    S.session = null; save(true); render(true);
  },
  'add-lift': el => liftModal(null, el.dataset.name),
  'new-lift': () => liftModal(null),
  'edit-lift': el => liftModal(el.dataset.key),
  'save-missing': el => {
    const inp = el.closest('.miss-row').querySelector('input');
    const v = num(inp.value);
    if (!(v > 0)) { toast('Enter a 1RM greater than 0', 'warn'); return; }
    S.lifts[keyOf(el.dataset.name)] = newLift(el.dataset.name, v);
    save(true); render(true); toast(`${el.dataset.name} saved`, 'ok');
  },
  'coach-ask': () => requestCoach('manual'),
  'chat-chip': el => {
    if (coachBusy) { toast('Coach Alex is still typing…'); return; }
    addCoach('user', el.dataset.text); refreshCoachUI(); requestCoach('chat', { text: el.dataset.text });
  },
  'clear-chat': () => { if (confirm('Clear the coach chat?')) { S.coach = []; save(); refreshCoachUI(); render(true); } },
  'del-log': el => {
    if (!confirm('Delete this workout from history? (e1RM changes it caused are not undone.) The session will count as not done.')) return;
    S.logs = S.logs.filter(l => l.id !== el.dataset.id); save(true); render(true);
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a.startsWith('m:')) {
    const f = modalCtx && modalCtx.actions && modalCtx.actions[a.slice(2)];
    if (f) { e.preventDefault(); f(el); }
    return;
  }
  const f = A[a];
  if (f) { e.preventDefault(); f(el, e); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('in')) {
    const row = t.closest('.setrow'); if (!row || !S.session) return;
    const ex = S.session.exercises[+row.dataset.ei], s = ex && ex.sets[+row.dataset.si]; if (!s) return;
    if (t.dataset.f === 'w') s.wIn = t.value; else s.rIn = t.value;
    save();
  } else if (t.id === 'chatIn') { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!(t.classList && t.classList.contains('in'))) return;
  const row = t.closest('.setrow'); if (!row || !S.session) return;
  const ei = +row.dataset.ei, si = +row.dataset.si;
  const ex = S.session.exercises[ei], s = ex && ex.sets[si];
  if (s && s.done) {            // editing a logged set re-evaluates it (undo + redo)
    setTimeout(() => { unlogSet(ex, s); logSet(ex, s); save(); renderKeepFocus(); }, 0);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalCtx) { closeModal(); return; }
  const t = e.target;
  if (t.classList && t.classList.contains('in') && e.key === 'Enter') {
    e.preventDefault();
    const row = t.closest('.setrow'); if (!row) return;
    if (t.dataset.f === 'w') { const r = $('.in[data-f="r"]', row); if (r) r.focus(); }
    else {
      const ex = S.session && S.session.exercises[+row.dataset.ei], s = ex && ex.sets[+row.dataset.si];
      if (s && !s.done) toggleSetAt(+row.dataset.ei, +row.dataset.si); else t.blur();
    }
  }
  if (t.id === 'chatIn' && e.key === 'Enter' && !e.shiftKey && !(window.matchMedia && matchMedia('(pointer:coarse)').matches)) { e.preventDefault(); sendChat(); }
});
document.addEventListener('submit', e => { if (e.target.id === 'chatForm') { e.preventDefault(); sendChat(); } });

/* ---------------------------------------------------------------------
   9. PWA bits (icons, manifest, service worker) & boot
   --------------------------------------------------------------------- */
let deferredInstall = null;
function makeIcon(size) {
  try {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'); if (!g) return null;
    g.fillStyle = '#0b0d12'; g.fillRect(0, 0, size, size);
    const gr = g.createLinearGradient(0, 0, size, size); gr.addColorStop(0, '#2dd4bf'); gr.addColorStop(1, '#38bdf8'); g.fillStyle = gr;
    const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fill(); };
    const s = size;
    rr(s * .26, s * .465, s * .48, s * .07, s * .035);
    rr(s * .2, s * .30, s * .085, s * .40, s * .03); rr(s * .715, s * .30, s * .085, s * .40, s * .03);
    rr(s * .11, s * .38, s * .07, s * .24, s * .025); rr(s * .82, s * .38, s * .07, s * .24, s * .025);
    return c.toDataURL('image/png');
  } catch (e) { return null; }
}
function setupPWA() {
  try {
    const web = /^https?:$/.test(location.protocol);
    const i180 = makeIcon(180);
    if (i180) { const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = i180; document.head.appendChild(l); }
    if (web) {
      const i192 = makeIcon(192), i512 = makeIcon(512);
      if (i192 && i512) {
        const m = {
          name: 'AutoCoach Lift', short_name: 'AutoCoach', description: 'Auto-regulating workout tracker with an AI strength coach',
          start_url: location.href.split('#')[0], display: 'standalone', orientation: 'portrait',
          background_color: '#0b0d12', theme_color: '#0b0d12',
          icons: [{ src: i192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' }, { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }]
        };
        const l = document.createElement('link'); l.rel = 'manifest';
        l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
        document.head.appendChild(l);
      }
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => { /* sw.js not deployed: app still works, just without the offline cache */ });
    }
  } catch (e) { /* non-critical */ }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
}

// small hook so the logic can be exercised from tests / the console
window.__autocoach = { epley, classify, parseProgramText, parseInput, serializeProgram, targetFor, state: () => S, TEMPLATES };

setupPWA();
render();
})();
</script>
