function createSession(p, b, w, d) {
  const wk = p.blocks[b].weeks[w], day = wk.days[d];
  const ses = {
    id: uid(), programId: p.id, cycle: p.cycle || 1, b, w, d,
    startedAt: null, changes: [], reg: {}, coached: {},
    exercises: day.exercises.map(sessionEx)
  };
  if (wk.deload && S.settings.deloadAuto !== false) {          // deload week: cut the working sets in half (never below 1)
    ses.halved = true;
    ses.exercises.forEach(e => { e.setsPlanned = e.sets.length; e.sets = e.sets.slice(0, Math.max(1, Math.ceil(e.sets.length / 2))); });
  }
  return ses;
}
const sessionHasLogged = s => !!s && s.exercises.some(e => e.sets.some(x => x.done));
function sessionValid(s) {
  const p = s && getProgram(s.programId);
  return !!(p && p.blocks[s.b] && p.blocks[s.b].weeks[s.w] && p.blocks[s.b].weeks[s.w].days[s.d]);
}
function ensureSession() {
  const p = activeProgram();
  if (!p) return null;
  if (S.session && !sessionValid(S.session)) S.session = null;
  if (!S.session) {
    const n = nextSession(p);
    if (n) { S.session = createSession(p, n.b, n.w, n.d); save(); }
  }
  return S.session;
}
/* ---- Low-energy mode: lighten today's working weights, leave the program and 1RMs alone ---- */
const lowPct = () => { const s = S.session; return s && (s.lowE === 10 || s.lowE === 15) ? s.lowE : 0; };
/** One working weight, lightened by the low-energy percentage and snapped to the plate increment (never heavier than before). */
function lowW(w) {
  const p = lowPct();
  if (!p || !(w > 0)) return w;
  return Math.min(w, roundInc(w * (1 - p / 100)));
}
const sugOf = set => set && set.sugW > 0 ? lowW(set.sugW) : null;
const liveTarget = (ex, set) => { const t = targetFor(ex.name, set.int, setCtx(set)); return t == null ? null : lowW(t); };
function lowEHTML() {
  const p = lowPct();
  if (!p) return `<button type="button" class="lowe-btn" data-action="lowe" data-p="10" aria-label="Turn on low-energy mode: lighten today's weights by 10 percent"><span class="lowe-ic" aria-hidden="true">🌧️</span><span class="lowe-tx"><b>Bad day? Low-energy mode</b><small>One tap: today's weights −10%. Your program and 1RMs stay untouched.</small></span></button>`;
  return `<div class="lowe on"><div class="lowe-h"><span class="lowe-ic" aria-hidden="true">🌧️</span><span class="lowe-tx"><b>Low-energy mode · weights −${p}%</b><small>Today only. Program, 1RMs and progression are untouched.</small></span></div>
    <div class="lseg" role="group" aria-label="Low-energy level">${[10, 15, 0].map(v => `<button type="button" data-action="lowe" data-p="${v}" aria-pressed="${v === p}">${v ? '−' + v + '%' : 'Off'}</button>`).join('')}</div></div>`;
}
function setLowE(p) {
  const s = S.session; if (!s) return;
  const logged = sessionHasLogged(s);
  s.lowE = p === 10 || p === 15 ? p : 0;
  save(true); render(true);
  toast(s.lowE
    ? `Low-energy mode on: today's weights −${s.lowE}%. Your program and 1RMs are untouched.${logged ? ' Sets already logged keep their numbers.' : ''}`
    : 'Low-energy mode off: normal targets are back.', 'ok', 3600);
}


function logSet(ex, set) {
  const s = S.session;
  const lift = getLift(ex.name);
  const tw = liveTarget(ex, set);
  let w = num(set.wIn), r = num(set.rIn);
  if (w == null) w = tw;
  if (w == null && sugOf(set) > 0) w = sugOf(set);
  if (w == null && !set.int) w = 0;            // accessory / bodyweight set with no prescribed load
  if (r == null) r = set.targetReps;
  if (w == null) { toast('Enter the weight you used first', 'warn'); return false; }
  w = Math.max(0, w); r = Math.max(0, Math.round(r));
  if (!s.startedAt) s.startedAt = Date.now();

  const low = lowPct();                       // low-energy sets never change a 1RM, a hold or the progression
  const before = lift ? lift.e1rm : null;
  const res = classify({ weight: w, reps: r, targetWeight: tw, targetReps: set.targetReps, e1rmBefore: before });
  if (low && res.status === 'exceeded') res.status = 'hit';
  set.done = true; set.weight = w; set.reps = r; set.targetWeight = tw; set.low = low;
  set.e1rm = res.e ? r1(res.e) : null; set.status = res.status; set.change = null;
  set.wIn = fmt(w); set.rIn = String(r);
  const u = S.settings.units;
  const key = keyOf(ex.name);

  if (res.status === 'exceeded') {
    const prev = lift.e1rm, next = r1(res.e);
    if (next > prev * 1.2 && !confirm(`${ex.name}: ${fmt(w)}${u} × ${r} suggests an e1RM of ${fmt(next)}${u} (currently ${fmt(prev)}${u}).\n\nUpdate your e1RM? Cancel if that was a typo.`)) {
      set.status = 'logged';
    } else {
      setE1rm(lift, next, `Set: ${fmt(w)}×${r}`);
      set.change = { kind: 'bump', prev, next };
      s.changes.push({ key, name: ex.name, prev, next, kind: 'bump', setId: set.id });
      celebrate(ex.name, prev, next);
      maybePRCoach(ex, set, prev, next);
    }
  } else if (res.status === 'fail') {
    if (low) toast(`${ex.name}: ${r}/${set.targetReps} reps. Totally fine on a low-energy day, your numbers stay as they are.`, 'warn', 3200);
    else if (lift) {
      const reg = s.reg[key] || (s.reg[key] = { drop: 0 });
      if (res.drop > reg.drop) {
        const factor = (1 - res.drop / 100) / (1 - reg.drop / 100);
        const prev = lift.e1rm, next = r1(prev * factor);
        setE1rm(lift, next, `Missed reps (−${res.drop}%)`);
        set.change = { kind: 'drop', prev, next, prevDrop: reg.drop, drop: res.drop };
        reg.drop = res.drop;
        s.changes.push({ key, name: ex.name, prev, next, kind: 'drop', setId: set.id });
        toast(`${ex.name}: ${r}/${set.targetReps} reps. e1RM trimmed ${res.drop}% to ${fmt(next)}${u} — remaining sets are lighter.`, 'err', 4200);
      } else toast(`${ex.name}: ${r}/${set.targetReps} reps — e1RM already backed off this session.`, 'err', 3200);
    } else toast(`${ex.name}: ${r}/${set.targetReps} reps.`, 'err', 3200);
    if (!low) maybeAutoCoach(ex, set, res);
  } else if (res.status === 'minor') {
    toast(low ? `So close — ${r}/${set.targetReps}. Fine on a low-energy day.` : `So close — ${r}/${set.targetReps}. No change to your max; weight is held steady.`, 'warn', 3200);
  }
  try { navigator.vibrate && navigator.vibrate(12); } catch (e) { /* ignore */ }
  return true;
}

function unlogSet(ex, set) {
  const s = S.session;
  const ch = set.change;
  if (ch) {
    const lift = getLift(ex.name);
    if (lift && Math.abs(lift.e1rm - ch.next) < 0.001) {       // only undo if nothing changed it since
      revertE1rm(lift, ch.prev, ch.next);
      if (ch.kind === 'drop') { const reg = s.reg[keyOf(ex.name)]; if (reg) reg.drop = ch.prevDrop; }
    }
    s.changes = s.changes.filter(c => c.setId !== set.id);
  }
  set.done = false; set.change = null; set.status = null; set.e1rm = null; set.weight = null; set.reps = null; set.targetWeight = null;
}

function outcomeOf(ex) {
  const done = ex.sets.filter(s => s.done);
  if (!done.length) return { outcome: 'skipped', done };
  const has = st => done.some(s => s.status === st);
  const exceeded = has('exceeded');
  const outcome = has('fail') ? 'fail' : has('minor') ? 'minor' : exceeded ? 'exceeded' : has('hit') ? 'hit' : has('adjusted') ? 'adjusted' : 'logged';
  return { outcome, exceeded, done };
}

function finishWorkout() {
  const s = S.session;
  if (!s) return;
  const total = s.exercises.reduce((n, e) => n + e.sets.length, 0);
  const done = s.exercises.reduce((n, e) => n + e.sets.filter(x => x.done).length, 0);
  if (!done) { toast('Log at least one set first', 'warn'); return; }
  if (done < total && !confirm(`${plural(total - done, 'set')} not logged — they will be skipped. Finish workout?`)) return;
  const p = getProgram(s.programId), blk = p.blocks[s.b], wk = blk.weeks[s.w], dy = wk.days[s.d];
  const exs = [], progress = []; let volume = 0;
  s.exercises.forEach(ex => {
    const o = outcomeOf(ex);
    if (o.outcome === 'skipped') { exs.push({ name: ex.name, outcome: 'skipped', sets: [], skipped: ex.sets.length }); return; }
    const lowEx = o.done.some(x => x.low);
    const pn = lowEx ? null : progressEx(ex, o); if (pn) progress.push(pn);
    const sets = o.done.map(x => {
      volume += (x.weight || 0) * (x.reps || 0);
      return { targetWeight: x.targetWeight, targetReps: x.targetReps, repsText: x.repsText, int: x.int, weight: x.weight, reps: x.reps, e1rm: x.e1rm, status: x.status, eff: x.eff == null ? null : x.eff };
    });
    const lift = getLift(ex.name);
    if (lift && !lowEx) {
      lift.hold = null;                                           // last hold has now been used
      if (o.outcome === 'minor' && !o.exceeded) {                 // minor miss → hold the weight for next time
        const hw = Math.max(...o.done.filter(x => x.status === 'minor').map(x => x.weight));
        if (hw > 0) lift.hold = { weight: hw, from: Date.now(), reason: 'Minor miss' };
      }
    }
    const sg = ssOf(s, s.exercises.indexOf(ex));
    exs.push({ name: ex.name, outcome: lowEx && (o.outcome === 'fail' || o.outcome === 'minor') ? 'lowmiss' : o.outcome, exceeded: !!o.exceeded, sets, skipped: ex.sets.length - o.done.length, swappedFrom: ex.swappedFrom || null, ss: sg ? sg.letter + (sg.idx.indexOf(s.exercises.indexOf(ex)) + 1) : null });
  });
  easyCredit(s, wk);
  const chMap = new Map();
  s.changes.forEach(c => { const e = chMap.get(c.key); if (e) { e.to = c.next; if (c.kind !== 'easy') delete e.kind; } else chMap.set(c.key, Object.assign({ name: c.name, from: c.prev, to: c.next }, c.kind === 'easy' ? { kind: 'easy' } : {})); });
  const changes = [...chMap.values()].filter(c => Math.abs(c.from - c.to) > 0.001);
  const log = {
    id: uid(), t: Date.now(), startedAt: s.startedAt, durationMin: s.startedAt ? Math.max(1, Math.round((Date.now() - s.startedAt) / 60000)) : null,
    programId: p.id, programName: p.name, cycle: s.cycle || 1, b: s.b, w: s.w, d: s.d,
    blockName: blk.name, weekLabel: wk.label, deload: !!wk.deload, dayName: dy.name,
    lowE: Math.max(0, ...s.exercises.flatMap(e => e.sets.filter(x => x.done).map(x => x.low || 0))),
    volume: Math.round(volume), exercises: exs, changes, progress, units: S.settings.units, effMode: S.settings.effort
  };
  S.logs.unshift(log);
  S.session = null;
  save(true);
  render();
  window.scrollTo(0, 0);
  showSummary(log);
}

WEEK 1-3                 (weeks with identical workouts may share a range; "WEEK 4 DELOAD" marks a deload week)
DAY: Name
Exercise Name SETSxREPS @ INTENSITY     (one exercise per line)

INTENSITY is a percentage of 1RM (75%), a label (Heavy = 80-92%+, Medium = 70-79%, Light = 50-65%, Deload = 50-60%) or omitted for accessories/bodyweight work.
Several set groups on one line are comma separated: Squat 1x3 @ 85%, 3x5 @ 75%
If the % rises by a fixed step each week across a WEEK range, append +step: Squat 4x6 @ 70%+2.5
Rep ranges: 8-10. AMRAP / "5+" for as-many-as-possible.
Expand supersets and circuits into separate exercise lines. Keep the original exercise names. Do not invent exercises.`;

async function callGemini(userText, system, opts = {}) {
  const key = S.settings.apiKey;
  if (!key) throw new Error('NO_KEY');
  const model = (S.settings.model || 'gemini-2.5-flash').trim();
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  const body = {
    systemInstruction: { parts: [{ text: system }] },
    contents: [{ role: 'user', parts: [{ text: userText }] }],
    generationConfig: { temperature: opts.temperature ?? 0.8, maxOutputTokens: opts.maxTokens ?? 900 }
  };
  if (/2\.5-flash/i.test(model) && !/pro/i.test(model)) body.generationConfig.thinkingConfig = { thinkingBudget: 0 };
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), opts.timeout ?? 40000);
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify(body), signal: ctl.signal
    });
    let data = null;
    try { data = await res.json(); } catch (e) { /* non-JSON error body */ }
    if (!res.ok) throw new Error((data && data.error && data.error.message) || `HTTP ${res.status}`);
    const cand = data && data.candidates && data.candidates[0];
    const text = ((cand && cand.content && cand.content.parts) || []).map(p => p.text || '').join('').trim();
    if (!text) throw new Error(data && data.promptFeedback && data.promptFeedback.blockReason ? 'Blocked: ' + data.promptFeedback.blockReason : 'Empty response from Gemini');
    return text;
  } finally { clearTimeout(timer); }
}
function friendlyErr(e) {
  const m = String((e && e.message) || e);
  if (e && e.name === 'AbortError') return 'the request timed out';
  if (/API key not valid|API_KEY_INVALID|API key expired/i.test(m)) return 'the API key was not accepted';
  if (/quota|RESOURCE_EXHAUSTED|429/i.test(m)) return 'rate limit reached — try again in a minute';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'no connection';
  if (/not found|404/i.test(m)) return 'model not found — check the model name in Settings';
  return m.slice(0, 160);
}

const STATUS = { hit: 'Hit', exceeded: 'Up ↑', minor: 'Close', fail: 'Missed', adjusted: 'Adjusted', logged: 'Logged' };
const STATUS_LONG = { hit: 'target met', exceeded: 'beat target, e1RM raised', minor: 'minor miss', fail: 'SIGNIFICANT MISS', adjusted: 'lifter chose a lighter weight', logged: 'logged' };

function logLines(l, detailed) {
  const u = l.units || S.settings.units;
  const L = [`${fmtDate(l.t)} — ${l.dayName} (${l.blockName}, ${l.weekLabel}${l.deload ? ', deload' : ''})`];
  if (l.lowE) L.push(`  LOW-ENERGY DAY: weights were deliberately lightened ${l.lowE}% — not a performance drop; e1RM and progression were not changed`);
  l.exercises.forEach(ex => {
    if (ex.outcome === 'skipped') { L.push(`  ${ex.name}: skipped`); return; }
    const sets = ex.sets.map(s => `${fmt(s.weight)}${u}×${s.reps}${effTag(s.eff, l.effMode)}${s.targetWeight != null ? ` (target ${fmt(s.targetWeight)}×${s.targetReps}${detailed ? ', ' + STATUS_LONG[s.status] : ''})` : ''}`);
    L.push(`  ${ex.ss ? '[superset ' + ex.ss + '] ' : ''}${ex.name}${ex.swappedFrom ? ' (swapped in for ' + ex.swappedFrom + ')' : ''}: ${sets.join('; ')}`);
  });
  (l.changes || []).forEach(c => L.push(`  e1RM change: ${c.name} ${fmt(c.from)} → ${fmt(c.to)}${u}${c.kind === 'easy' ? ' (felt easy)' : ''}`));
  (l.progress || []).forEach(p => L.push(`  progression: ${p.name} — ${p.text}`));
  return L;
}
function workoutContext(opts = {}) {
  const u = S.settings.units, L = [];
  L.push(`Units: ${u}`);
  L.push(`Intensity tiers (% of 1RM): ${TIER_KEYS.map(k => LABELS[k] + ' ' + tierRangeText(k)).join(', ')}. The exact % for each set is already applied in the targets below.`);
  const s = S.session;
  if (opts.log) {
    L.push('FINISHED WORKOUT:'); L.push(...logLines(opts.log, true));
  } else if (s && sessionValid(s)) {
    const p = getProgram(s.programId), blk = p.blocks[s.b], wk = blk.weeks[s.w], dy = wk.days[s.d];
    L.push(`CURRENT WORKOUT — Program: ${p.name} | Block ${s.b + 1}/${p.blocks.length}: ${blk.name} | ${wk.label} (week ${s.w + 1} of ${blk.weeks.length} in block)${wk.deload ? ' — DELOAD WEEK' + (s.halved ? ' (Deload intensity range, working sets halved)' : '') : ''}${wk.note ? ' — ' + wk.note : ''} | Session: ${dy.name}`);
    if (lowPct()) L.push(`LOW-ENERGY DAY: the athlete chose to lighten today's working weights by ${lowPct()}% (targets below already include this). Treat it as smart autoregulation, not a setback; e1RM and the program are unchanged.`);
    s.exercises.forEach(ex => {
      const l = getLift(ex.name);
      const sg = ssOf(s, s.exercises.indexOf(ex));
      L.push(`${sg ? `[superset ${sg.letter}${sg.idx.indexOf(s.exercises.indexOf(ex)) + 1}] ` : ''}${ex.name}${ex.swappedFrom ? ` [swapped in for ${ex.swappedFrom}]` : ''}${l ? ` (current e1RM ${fmt(l.e1rm)}${u}, baseline ${fmt(l.baseline)}${u})` : ' (no 1RM on file)'}`);
      ex.sets.forEach((st, i) => {
        const tw = st.done ? st.targetWeight : liveTarget(ex, st);
        const tgt = `${tw != null ? fmt(tw) + u : 'free load'} × ${st.repsText}${st.int && st.int.t === 'label' ? ' [' + intFull(st.int, setCtx(st)) + ']' : ''}`;
        L.push(st.done
          ? `  Set ${i + 1}: target ${tgt} → actual ${fmt(st.weight)}${u} × ${st.reps} (e1RM ${fmt(st.e1rm)})${effOn() ? effTag(st.eff) : ''} [${STATUS_LONG[st.status]}]`
          : `  Set ${i + 1}: target ${tgt} → not done yet`);
      });
    });
    s.changes.forEach(c => L.push(`Auto-regulation today: ${c.name} e1RM ${fmt(c.prev)} → ${fmt(c.next)}${u} (${c.kind === 'drop' ? 'reduced after missed reps' : 'raised after beating target'})`));
  } else L.push('No workout is currently in progress.');
  const recent = S.logs.filter(l => !opts.log || l.id !== opts.log.id).slice(0, 3);
  if (recent.length) { L.push('', 'RECENT SESSIONS:'); recent.forEach(l => L.push(...logLines(l, false))); }

}

function coachPrompt(kind, o = {}) {

async function requestCoach(kind, o = {}) {

/* lightweight, XSS-safe markdown (escape first, then format) */
function md(src) {
  const lines = esc(src).split('\n');
  let out = '', list = null;
  const inl = t => t
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/(^|[\s(])_([^_\s][^_]*)_(?=[\s).,!?:;]|$)/g, '$1<em>$2</em>');
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  lines.forEach(ln => {
    let m;
    if ((m = /^\s*[-*•]\s+(.*)$/.exec(ln))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inl(m[1])}</li>`; }
    else if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(ln))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${inl(m[1])}</li>`; }
    else if (!ln.trim()) close();
    else { close(); const h = /^#{1,4}\s+(.*)$/.exec(ln); out += h ? `<p><strong>${inl(h[1])}</strong></p>` : `<p>${inl(ln)}</p>`; }
  });
  close();
  return out;
}

let audioCtx = null;
function ensureAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}
/** Coach Ducky's synthesised "quack": two sawtooth bursts with a falling pitch. */
function quack() {
  const ctx = ensureAudio(); if (!ctx || !S.settings.sound) return;
  const t0 = ctx.currentTime;
  [0, 0.26].forEach(d => {
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 1500;
    o.frequency.setValueAtTime(560, t0 + d);
    o.frequency.exponentialRampToValueAtTime(230, t0 + d + 0.17);
    g.gain.setValueAtTime(0.0001, t0 + d);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.2);
    o.connect(f); f.connect(g); g.connect(ctx.destination);
    o.start(t0 + d); o.stop(t0 + d + 0.22);
  });
}
function fanfare() {
  const ctx = ensureAudio(); if (!ctx || !S.settings.sound) return;
  const t0 = ctx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((fr, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = fr;
    g.gain.setValueAtTime(0.0001, t0 + i * 0.11);
    g.gain.exponentialRampToValueAtTime(0.28, t0 + i * 0.11 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.11 + 0.3);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0 + i * 0.11); o.stop(t0 + i * 0.11 + 0.32);
  });
}
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let c = $('#confetti');
  if (!c) { c = document.createElement('canvas'); c.id = 'confetti'; document.body.appendChild(c); }
  const dpr = window.devicePixelRatio || 1;
  c.width = Math.floor(innerWidth * dpr); c.height = Math.floor(innerHeight * dpr);
  const g = c.getContext('2d'); if (!g) { c.remove(); return; }
  const cols = ['#C8FF00', '#A8F000', '#FFD83D', '#FFFFFF', '#DCEBB1', '#FF8A1F'];
  const P = Array.from({ length: 110 }, () => ({
    x: Math.random() * c.width, y: -Math.random() * c.height * 0.35,
    vx: (Math.random() - 0.5) * 4.5 * dpr, vy: (2 + Math.random() * 4.5) * dpr,
    s: (5 + Math.random() * 8) * dpr, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35,
    col: cols[Math.floor(Math.random() * cols.length)], round: Math.random() < 0.35
  }));
  const t0 = performance.now();
  (function frame(t) {

/* ---- progressive overload: bodyweight (reps → level-up) & free-load (double progression) ---- */
const BW_RE = /pull-?up|chin-?up|push-?up|press-?up|\bdips?\b|muscle-?up|pistol|inverted row|ring row|australian|burpee|sit-?up|crunch|leg raise|knee raise|l-?sit|handstand|air squat|bodyweight|nordic|back extension|hyperextension|dragon|mountain climber|jump/i;
const isWeighted = n => /weighted|\+\s?\d+\s?(kg|lb)|with (belt|plate|vest)/i.test(n);
/** pct = target comes from e1RM · abs = fixed weight · bw = bodyweight · free = you pick the load */
function progKind(name, sets) {
  if (sets.some(s => s.int && s.int.t !== 'abs')) return 'pct';
  if (sets.some(s => s.int && s.int.t === 'abs')) return 'abs';
  return BW_RE.test(name || '') && !isWeighted(name) ? 'bw' : 'free';
}
const needs1RM = ex => ex.sets.some(s => s.int && s.int.t !== 'abs');
const VARIATIONS = [
  ['Incline Push-ups', 'Push-ups', 'Decline Push-ups', 'Archer Push-ups', 'Weighted Push-ups'],
  ['Assisted Pull-ups', 'Pull-ups', 'Weighted Pull-ups'],
  ['Assisted Chin-ups', 'Chin-ups', 'Weighted Chin-ups'],
  ['Bench Dips', 'Dips', 'Weighted Dips'],
  ['Air Squat', 'Split Squat', 'Bulgarian Split Squat', 'Pistol Squat'],
  ['Inverted Row', 'Feet-Elevated Inverted Row', 'Pull-ups'],
  ['Knee Raises', 'Leg Raises', 'Hanging Leg Raises', 'Toes-to-Bar']
];
function nextVariation(name) {
  const k = keyOf(name);
  for (const ch of VARIATIONS) { const i = ch.findIndex(x => keyOf(x) === k); if (i >= 0 && i < ch.length - 1) return ch[i + 1]; }
  if (/pull-?up/i.test(name) && !isWeighted(name)) return 'Weighted Pull-ups';
  if (/chin-?up/i.test(name) && !isWeighted(name)) return 'Weighted Chin-ups';
  if (/push-?up/i.test(name) && !isWeighted(name)) return 'Weighted Push-ups';
  if (/\bdips?\b/i.test(name) && !isWeighted(name)) return 'Weighted Dips';
  return null;
}
function nextLoad(w) {
  const inc = Number(S.settings.rounding) > 0 ? Number(S.settings.rounding) : 2.5;
  return r2(w + Math.max(inc, roundInc(w * 0.025)));
}
/** Called while building a session: apply last session's progression to the sets. */
function applyProg(out, name) {
  if (S.settings.autoLoad === false) return out;
  const kind = progKind(name, out.sets);
  if (kind !== 'bw' && kind !== 'free') return out;
  const pr = S.prog[keyOf(name)];
  out.sets.forEach(st => {
    if (/amrap|max/i.test(st.repsText)) return;
    const rng = /^(\d+)-(\d+)/.exec(st.repsText), lo = rng ? +rng[1] : st.targetReps;
    const hi = rng ? +rng[2] : (kind === 'bw' ? lo + 4 : lo);
    st.prg = { lo, hi };
    const off = pr ? clamp(Math.round(pr.off || 0), 0, hi - lo) : 0;
    if (off > 0) { st.targetReps = lo + off; st.repsText = String(lo + off); }
    if (kind === 'free' && pr && pr.w > 0) st.sugW = pr.w;
  });

}
/** Called when a workout is finished: decide next session's reps/load for bodyweight & free-load work. */
function progressEx(ex, o) {
  if (S.settings.autoLoad === false) return null;
  const kind = progKind(ex.name, ex.sets);
  if (kind !== 'bw' && kind !== 'free') return null;
  const gated = ex.sets.filter(st => st.prg);
  if (!gated.length) return null;
  const done = o.done, key = keyOf(ex.name), u = S.settings.units;
  const pr = S.prog[key] || (S.prog[key] = { off: 0, w: null, miss: 0, up: null });
  const W = Math.max(0, ...done.map(x => x.weight || 0));
  if (done.length < ex.sets.length) return { name: ex.name, text: 'not every set was logged — targets stay the same', kind: 'hold' };
  const lo = Math.min(...gated.map(x => x.prg.lo)), hi = Math.max(...gated.map(x => x.prg.hi));
  const curT = Math.min(...gated.map(x => x.targetReps)), worst = Math.min(...done.map(x => x.reps));
  const allHit = done.every(x => x.reps >= x.targetReps);
  let text, tone = 'hold';
  if (allHit) {
    pr.miss = 0; pr.up = null;
    if (curT < hi) {
      pr.off = Math.min(hi - lo, Math.max(0, curT - lo) + 1); text = `every set hit → ${lo + pr.off} reps per set next time`; tone = 'up';
      if (kind === 'free' && W > 0) pr.w = W;
    } else if (kind === 'free' && W > 0) {
      pr.w = nextLoad(W); pr.off = 0; text = `hit ${curT} reps on every set → ${fmt(pr.w)}${u} next time`; tone = 'up';
    } else if (kind === 'bw') {
      const nv = nextVariation(ex.name); pr.up = nv ? { to: nv, t: Date.now() } : null; pr.off = hi - lo; tone = 'up';
      text = nv ? `${hi} reps on every set — ready to level up to ${nv}` : `${hi} reps on every set — slow the tempo, add pauses or a harder variation`;
    } else text = `hit ${curT} reps on every set — keep it up`;
  } else if (worst < lo - 1) {
    pr.miss = (pr.miss || 0) + 1;
    if (pr.miss >= 2) {
      pr.miss = 0; pr.off = Math.max(0, (pr.off || 0) - 1); tone = 'down';
      if (kind === 'free' && W > 0) pr.w = Math.max(0, roundInc(W * 0.95));
      text = kind === 'free' && W > 0 ? `two tough sessions → easing back to ${fmt(pr.w)}${u}` : 'two tough sessions → one rep fewer per set next time';
    } else { text = 'a little short — same targets next time'; if (kind === 'free' && W > 0) pr.w = W; }
  } else { text = 'close — same targets next time'; if (kind === 'free' && W > 0) pr.w = W; }
  pr.note = text; pr.t = Date.now();

}
/** Felt-easy credit: every set hit with low effort logged → nudge the e1RM up 2.5% (never counted as a PR). */
function easyCredit(s, wk) {
  if (S.settings.autoLoad === false || !effOn() || (wk && wk.deload) || lowPct()) return;
  const mode = S.settings.effort;
  s.exercises.forEach(ex => {
    const lift = getLift(ex.name), key = keyOf(ex.name);
    if (!lift || lift.hold || !needs1RM(ex) || s.changes.some(c => c.key === key) || ex.sets.some(x => x.low)) return;
    if (!ex.sets.every(x => x.done && (x.status === 'hit' || x.status === 'exceeded'))) return;
    const vals = ex.sets.map(x => x.eff).filter(v => v != null);
    if (vals.length < Math.ceil(ex.sets.length / 2)) return;
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    if (!(mode === 'rir' ? avg >= 3 : avg <= 7)) return;
    const prev = lift.e1rm, next = r1(prev * 1.025);
    if (!(next > prev)) return;
    setE1rm(lift, next, `Felt easy (${effLabel(mode)} ${fmt(r1(avg))})`);
    s.changes.push({ key, name: ex.name, prev, next, kind: 'easy' });
  });
}
function progHintHTML(ex, ei) {

  if (kind !== 'bw' && kind !== 'free') return '';

}

const fmtShort = t => new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
function lineChart(hist, id) {
  let pts = hist.map(h => ({ t: h.t, v: h.v }));
  if (pts.length < 2) return '<div class="chart-empty">Your e1RM trend appears after a few sets 🦆</div>';
  if (pts.length > 60) { const step = Math.ceil(pts.length / 60); pts = pts.filter((_, i) => i % step === 0 || i === pts.length - 1); }
  const W = 320, H = 136, pl = 36, pr = 10, pt = 12, pb = 24;
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  const pad = Math.max((hi - lo) * 0.18, 1), min = lo - pad, max = hi + pad;
  const x = i => pl + i * (W - pl - pr) / (pts.length - 1);
  const y = v => pt + (1 - (v - min) / (max - min)) * (H - pt - pb);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const area = `${d} L${x(pts.length - 1).toFixed(1)} ${H - pb} L${pl} ${H - pb} Z`;
  const ticks = [lo, (lo + hi) / 2, hi].filter((v, i, a) => a.findIndex(q => Math.abs(q - v) < 0.01) === i);
  const many = pts.length > 40;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="e1RM trend from ${fmt(pts[0].v)} to ${fmt(pts[pts.length - 1].v)}">
    <defs><linearGradient id="cg${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc);stop-opacity:.32"/><stop offset="1" style="stop-color:var(--acc);stop-opacity:0"/></linearGradient></defs>
    ${ticks.map(v => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="lbl" x="${pl - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${fmt(r1(v))}</text>`).join('')}
    <path d="${area}" fill="url(#cg${id})"/><path class="ln" d="${d}"/>
    ${pts.map((p, i) => {
      const last = i === pts.length - 1, up = i > 0 && p.v > pts[i - 1].v + 0.001;
      if (many && !last && !up) return '';
      return `<circle class="dot${up ? ' pr' : ''}${last ? ' last' : ''}" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${last ? 4.8 : 3.2}"/>`;
    }).join('')}
    <text class="lbl" x="${pl}" y="${H - 6}">${fmtShort(pts[0].t)}</text><text class="lbl" x="${W - pr}" y="${H - 6}" text-anchor="end">${fmtShort(pts[pts.length - 1].t)}</text></svg>`;
}

function weekStartTs(ts) {
  const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime();
}
function statsNow() {
  const now = Date.now(), ws = weekStartTs(now);
  const addWeek = (a, n) => { const d = new Date(a); d.setDate(d.getDate() + 7 * n); return d.getTime(); };
  const has = a => { const b = addWeek(a, 1); return S.logs.some(l => l.t >= a && l.t < b); };
  let streak = 0, cur = ws;
  if (!has(cur)) cur = addWeek(cur, -1);
  while (has(cur) && streak < 520) { streak++; cur = addWeek(cur, -1); }
  const d7 = now - 7 * 864e5, d30 = now - 30 * 864e5;
  let prs30 = 0;
  S.logs.forEach(l => { if (l.t >= d30) (l.changes || []).forEach(c => { if (c.to > c.from + 0.001 && c.kind !== 'easy') prs30++; }); });
  return {
    weekCount: S.logs.filter(l => l.t >= ws).length, streak,
    vol7: S.logs.filter(l => l.t >= d7).reduce((n, l) => n + (l.volume || 0), 0), prs30
  };
}
function recentPRs(n) {
  const out = [];
  S.logs.forEach(l => (l.changes || []).forEach(c => { if (c.to > c.from + 0.001 && c.kind !== 'easy') out.push({ name: c.name, from: c.from, to: c.to, t: l.t }); }));
  return out.slice(0, n);
}

/* ---- Backup: export / import everything as one JSON file ---- */
function exportJSON() {
  const copy = clone(S); copy.settings.apiKey = ''; copy.session = null; copy.timer = null;
  const blob = new Blob([JSON.stringify(copy, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `autocoach-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  S.lastBackup = Date.now(); save(true);
  if (S.tab === 'history') render(true);
  toast(`Backup downloaded: ${Object.keys(S.lifts).length} lifts, ${plural(S.logs.length, 'workout')}${S.runLogs.length ? ', ' + plural(S.runLogs.length, 'run') : ''}`, 'ok', 3200);
}
function importJSON(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onerror = () => toast('Could not read that file', 'err', 3500);
  fr.onload = () => importJSONText(String(fr.result));
  fr.readAsText(file);
}
function importJSONText(text) {
  let o;
  try { o = JSON.parse(text); } catch (e) { toast('Import failed: that is not a JSON file', 'err', 4000); return false; }
  if (!o || typeof o !== 'object' || Array.isArray(o) || !Array.isArray(o.programs) || !o.settings || typeof o.settings !== 'object' || !o.lifts || typeof o.lifts !== 'object' || Array.isArray(o.lifts)) {
    toast('Import failed: not an AutoCoach backup', 'err', 4000); return false;
  }
  let dropped = 0;
  Object.keys(o.lifts).forEach(k => { const l = o.lifts[k]; if (!l || typeof l !== 'object' || !(Number(l.e1rm) > 0)) { delete o.lifts[k]; dropped++; } });
  const keep = (k, ok) => { if (!Array.isArray(o[k])) return; const n = o[k].length; o[k] = o[k].filter(x => x && typeof x === 'object' && ok(x)); dropped += n - o[k].length; };
  keep('programs', p => Array.isArray(p.blocks));
  keep('logs', l => Number.isFinite(Number(l.t)) && Array.isArray(l.exercises));
  keep('runLogs', r => Number.isFinite(Number(r.t)));
  const counts = `${Object.keys(o.lifts).length} lifts · ${plural((o.logs || []).length, 'workout')} · ${plural((o.runLogs || []).length, 'run')} · ${plural(o.programs.length, 'program')}`;
  if (!confirm(`Replace everything on this device with this backup?\n\n${counts}${dropped ? `\n(${plural(dropped, 'damaged item')} will be skipped)` : ''}\n\nThis cannot be undone. Export first if you are unsure.`)) return false;
  let prev = null; try { prev = localStorage.getItem(LS_KEY); } catch (e) { /* ignore */ }
  const key = S.settings.apiKey;
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(o));
    S = loadState(); S.settings.apiKey = key; S.session = null; S.timer = null; stopTick(); renderTimer();
    save(true); closeModal(true); render(); window.scrollTo(0, 0);
    toast(`Backup restored: ${counts}`, 'ok', 3800);
    return true;
  } catch (err) {
    try { if (prev != null) localStorage.setItem(LS_KEY, prev); } catch (e2) { /* ignore */ }
    S = loadState(); render();
    toast('Import failed: ' + err.message, 'err', 4000);
    return false;
  }
}
let bkInput = null;

  if (!bkInput) {
    bkInput = document.createElement('input'); bkInput.type = 'file'; bkInput.accept = 'application/json,.json'; bkInput.hidden = true;
    bkInput.setAttribute('aria-hidden', 'true'); bkInput.tabIndex = -1;
    bkInput.addEventListener('change', () => { const f = bkInput.files && bkInput.files[0]; bkInput.value = ''; importJSON(f); });

}

/* ---- supersets ---- */
function ssGroups(s) {
  const map = new Map();
  s.exercises.forEach((ex, i) => { if (ex.ss) { if (!map.has(ex.ss)) map.set(ex.ss, []); map.get(ex.ss).push(i); } });
  const out = []; let n = 0;
  map.forEach((idx, id) => { if (idx.length > 1) out.push({ id, idx, letter: String.fromCharCode(65 + n++) }); });
  return out;
}
const ssOf = (s, ei) => ssGroups(s).find(g => g.idx.includes(ei)) || null;
/** Paired rest: b = seconds between A→B, a = seconds after the round. Explicit values always win, even when the rest timer is Off. */
function ssCfg(s, g, set) {
  const mem = g.idx.map(i => s.exercises[i]);
  const r = (mem.find(e => e.rest) || {}).rest || {};
  const off = S.settings.restMode === 'off';
  return { b: r.b != null ? r.b : (off ? 0 : S.settings.ssBetween), a: r.a != null ? r.a : (set ? restFor(set) : 0) };
}
/** What rest should start after logging set `si` of exercise `ei`? */
function restPlan(s, ei, si) {
  const ex = s.exercises[ei], set = ex.sets[si], g = ssOf(s, ei);
  if (g) {
    const c = ssCfg(s, g, set);
    const nxt = g.idx.find(i => i !== ei && s.exercises[i].sets[si] && !s.exercises[i].sets[si].done);
    if (nxt != null) return { sec: c.b, label: `Superset ${g.letter} · next: ${s.exercises[nxt].name}`, between: true };
    return { sec: c.a, label: `Superset ${g.letter} · round ${si + 1} done`, between: false };
  }
  return { sec: ex.rest && ex.rest.a != null ? ex.rest.a : restFor(set), label: `${ex.name} · set ${si + 1}` };
}

        if (scope !== 'today') scopeDays(scope).forEach(d => {
          const a = exByName(d, nameA), b = exByName(d, nameB); if (!a || !b) return;
          const used = new Set(d.exercises.map(e => e.ss).filter(Boolean)); let id = a.ss && a.ss === b.ss ? a.ss : null;
          if (!id) { let n = 1; while (used.has('P' + n)) n++; id = 'P' + n; }
          a.ss = id; b.ss = id; a.rest = rest ? Object.assign({}, rest) : null; b.rest = null;
          d.exercises.splice(d.exercises.indexOf(b), 1); d.exercises.splice(d.exercises.indexOf(a) + 1, 0, b);
        });
        save(true); closeModal(true); render(true);
        toast(g ? 'Superset rest updated' : `Paired ${nameA} + ${nameB}`, 'ok');
      },

        if (scope !== 'today') scopeDays(scope).forEach(d => names.forEach(n => { const e = exByName(d, n); if (e) { delete e.ss; delete e.rest; } }));
        save(true); closeModal(true); render(true); toast('Superset split', 'ok');

}

/* ---- one-tap logging: big − / + steppers beside the weight and reps inputs ---- */
const stepInc = () => { const v = Number(S.settings.rounding); return v > 0 ? v : 2.5; };
/** Next plate-friendly weight above (d>0) or below (d<0) `cur`; always a multiple of the rounding increment. */
function stepW(cur, d) {
  const inc = stepInc(), q = cur / inc;
  const n = d > 0 ? Math.floor(q + 1e-9) + 1 : Math.ceil(q - 1e-9) - 1;
  return Math.max(0, r2(n * inc));
}
const adjTimers = {};
function adjustSet(el) {
  const row = el.closest('.setrow'); if (!row || !S.session) return;
  const ei = +row.dataset.ei, si = +row.dataset.si;
  const ex = S.session.exercises[ei], set = ex && ex.sets[si]; if (!set) return;
  const f = el.dataset.f === 'r' ? 'r' : 'w', d = +el.dataset.d > 0 ? 1 : -1;
  const inp = $(`.in[data-f="${f}"]`, row); if (!inp) return;
  let cur = num(inp.value);
  if (f === 'w') {
    const empty = cur == null;
    if (empty) { const t = set.done ? set.targetWeight : liveTarget(ex, set); cur = t != null ? t : (sugOf(set) || 0); }
    const next = stepW(cur, d);
    if (empty && next === 0 && cur === 0) return;                 // nothing to lower on an unloaded set
    inp.value = fmt(next); set.wIn = inp.value;
  } else {
    if (cur == null) cur = set.targetReps || 0;
    const next = Math.max(0, Math.round(cur) + d);
    inp.value = String(next); set.rIn = inp.value;
  }
  try { navigator.vibrate && navigator.vibrate(8); } catch (e) { /* unsupported (iOS) */ }
  if (set.done) {                                                  // a logged set is re-evaluated once the taps settle
    const key = ei + ':' + si;
    clearTimeout(adjTimers[key]);
    adjTimers[key] = setTimeout(() => {
      delete adjTimers[key];
      const ss = S.session, e2 = ss && ss.exercises[ei], s2 = e2 && e2.sets[si];
      if (!s2 || !s2.done) return;
      unlogSet(e2, s2); logSet(e2, s2); save(true); render(true);
    }, 500);
  } else save();
}
function stepperHTML(f, label, si, s, ph, val, cls, step) {
  const lo = f === 'w' ? `Lower weight by ${fmt(step)} ${S.settings.units}` : 'One rep fewer', hi = f === 'w' ? `Raise weight by ${fmt(step)} ${S.settings.units}` : 'One rep more';
  return `<div class="stp ${cls}">
      <button type="button" class="sb" data-action="adj" data-f="${f}" data-d="-1" aria-label="${lo}, set ${si + 1}">−</button>
      <div class="stf"><input class="in" data-f="${f}" inputmode="${f === 'w' ? 'decimal' : 'numeric'}" enterkeyhint="${f === 'w' ? 'next' : 'done'}" autocomplete="off" placeholder="${esc(ph)}" value="${esc(val)}" aria-label="${f === 'w' ? 'Weight' : 'Reps'}, set ${si + 1}"><span class="cap">${esc(label)}</span></div>
      <button type="button" class="sb" data-action="adj" data-f="${f}" data-d="1" aria-label="${hi}, set ${si + 1}">+</button>
    </div>`;
}
function setRowHTML(ex, ei, s, si) {
  const tw = s.done ? s.targetWeight : liveTarget(ex, s);

  const sub = s.done

    : (s.int ? esc(intFull(s.int, setCtx(s))) : (s.prg && s.targetReps > s.prg.lo ? `+${s.targetReps - s.prg.lo} progression` : sug != null ? 'progression' : 'free'));
  const eff = effOn() ? `<select class="in${s.eff == null ? ' empty' : ''}" data-f="e" aria-label="${effLabel(em)}, set ${si + 1}">${effOptions(em, s.eff)}</select>` : '';

}

let modalCtx = null;

  root.style.pointerEvents = 'auto';
  document.body.classList.add('noscroll');
  requestAnimationFrame(() => { const w = root.firstElementChild; if (w) w.classList.add('show'); });

  document.body.classList.remove('noscroll');

function toast(msg, kind = 'info', ms = 2800, html = false) {
  const root = $('#toast-root');
  while (root.children.length >= 3) root.firstChild.remove();
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.setAttribute('role', 'status');
  if (html) el.innerHTML = msg; else el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 260); }, ms);
}

/* ---- running: duration-based progressive plan + adaptive engine ---- */
const RUN_GOALS = {
  base: { label: 'Aerobic base', cap: 240, blurb: 'Mostly easy Zone 2. A steady tempo joins from week 5.' },
  '5k': { label: '5K fitness', cap: 210, blurb: 'Easy volume plus tempo / interval work from week 5.' },
  '10k': { label: '10K fitness', cap: 270, blurb: 'Bigger long run, tempo and interval work from week 5.' }
};
const RUN_TYPES = { easy: 'Easy', long: 'Long', tempo: 'Tempo', intervals: 'Intervals', recovery: 'Recovery', other: 'Other' };
const RUN_ZONE = { easy: 'Z2', long: 'Z2', recovery: 'Z1–2', tempo: 'Z3–4', intervals: 'Z4–5', other: 'Z2' };
const ymd = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const addDaysD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const KM_PER_MI = 1.609344;

/* ---- heart-rate zones ---- */
function runMaxHR() { const p = S.profile; return p.maxHR || (p.age ? Math.round(208 - 0.7 * p.age) : null); } // Tanaka: 208 − 0.7 × age
function hrZones() {
  const max = runMaxHR(); if (!max) return null;
  const rest = S.profile.restHR, kar = !!(rest && rest < max - 20);
  const defs = kar ? [[1, .50, .60], [2, .60, .70], [3, .70, .80], [4, .80, .90], [5, .90, 1]] : [[1, .50, .65], [2, .65, .75], [3, .75, .82], [4, .82, .89], [5, .89, 1]];
  const at = p => Math.round(kar ? rest + p * (max - rest) : p * max);
  const zones = defs.map(([z, a, b]) => ({ z, lo: at(a), hi: at(b) }));
  for (let i = 1; i < zones.length; i++) zones[i].lo = zones[i - 1].hi + 1;   // no shared boundary beats
  return { max, estimated: !S.profile.maxHR, method: kar ? 'Karvonen (heart-rate reserve)' : '% of max heart rate', zones };
}
const TALK = { 'Z1–2': 'very easy — chatting is effortless (RPE 2–3/10)', Z2: 'conversational — full sentences, nose-breathing possible (RPE 3–4/10)', 'Z3–4': 'comfortably hard — short phrases only (RPE 6–7/10)', 'Z4–5': 'hard — a few words at a time (RPE 8/10)' };
/** "130–145 BPM" for a zone label such as Z2 or Z3–4; falls back to the talk test when no max HR is known. */
function zoneTarget(zone) {
  const hz = hrZones(); if (!hz) return null;
  const m = /Z(\d)(?:[–-](\d))?/.exec(zone); if (!m) return null;
  const a = hz.zones[+m[1] - 1], b = hz.zones[+(m[2] || m[1]) - 1];
  return { lo: a.lo, hi: b.hi, text: `${a.lo}–${b.hi} BPM` };
}
const zoneAdvice = zone => { const t = zoneTarget(zone); return t ? `${t.text} · ${TALK[zone] || ''}`.replace(/ · $/, '') : (TALK[zone] || 'by feel'); };

/* ---- plan generation ---- */
function runSessions(n, V, days, goal, deload, qOK) {
  days = clamp(days, 2, 6);
  const share = days === 2 ? 0.5 : days === 3 ? 0.4 : 0.35;      // long run ≈ 35–40 % of the week (50 % with only two runs)
  let long = Math.round(V * share);
  const rest = V - long, k = days - 1, base = Math.floor(rest / k);
  const easy = Array.from({ length: k }, (_, i) => base + (i < rest - base * k ? 1 : 0));
  if (long < easy[0]) { const t = long; long = easy[0]; easy[0] = t; }
  const list = easy.map(m => ({ type: deload ? 'recovery' : 'easy', mins: m }));
  list.push({ type: 'long', mins: long });
  if (qOK && !deload && n >= 5 && days >= 3) {                      // one quality session per week, from week 5
    let qi = -1, best = 0; list.forEach((s, i) => { if (s.type === 'easy' && s.mins > best) { best = s.mins; qi = i; } });
    if (qi >= 0 && best >= 30) list[qi].type = goal === 'base' || n % 2 ? 'tempo' : 'intervals';
    if (qi >= 0 && list[qi].type === 'intervals' && best < 35) list[qi].type = 'tempo';
  }
  return list.map((s, i) => finishSession(n, i, s.type, s.mins));
}
function finishSession(n, i, type, mins) {
  const o = { id: `w${n}s${i}`, type, mins, zone: RUN_ZONE[type], done: false, logId: null };
  if (type === 'tempo') {
    const work = clamp(mins - 20, 10, 25), wu = Math.round((mins - work) / 2), cd = mins - work - wu;
    o.desc = `${wu} min easy warm-up · ${work} min steady, comfortably hard (Z3–4, RPE 6–7) · ${cd} min easy cool-down`;
  } else if (type === 'intervals') {
    const reps = clamp(Math.floor((mins - 18) / 5), 3, 6), cd = mins - 10 - (reps * 3 + (reps - 1) * 2);
    o.desc = `10 min easy warm-up · ${reps} × 3 min hard (Z4–5, RPE 8) with 2 min easy jog between · ${cd} min easy cool-down`;
  } else if (type === 'long') o.desc = 'Long easy run: same relaxed Z2 effort, just more time on your feet. Walk breaks are fine.';
  else if (type === 'recovery') o.desc = 'Deload week: keep it very easy and short — absorb the training.';
  else o.desc = 'Easy aerobic run in Zone 2: you should be able to speak in full sentences.';
  return o;
}
function genWeeks(plan, from, to, B0, qOK) {
  const out = []; let last = B0;
  for (let n = from; n <= to; n++) {
    const deload = n % 4 === 0;                                      // every 4th week: ~75 % deload
    let V = deload ? Math.round(last * 0.75) : n === from ? Math.round(B0) : Math.min(plan.cap, Math.round(last * 1.08)); // +8 %/week (10 % rule)
    V = Math.max(V, plan.days * 20);
    const sessions = runSessions(n, V, plan.days, plan.goal, deload, qOK !== false);
    const mins = sessions.reduce((a, s) => a + s.mins, 0);
    out.push({ n, mins, deload, sessions });
    if (!deload) last = mins;
  }
  return out;
}
function buildRunPlan(o) {
  const days = clamp(Math.round(o.days || 3), 2, 6), goal = RUN_GOALS[o.goal] ? o.goal : 'base';
  const cap = RUN_GOALS[goal].cap, weeks = clamp(Math.round(o.weeks || 12), 4, 24);
  const base = clamp(Math.round(o.baseMins || days * 25), days * 25, cap);
  const plan = { id: uid(), goal, days, cap, weeks: [], start: ymd(mondayOf(o.start ? parseYmd(o.start) : new Date())), partial: !o.start && ((new Date().getDay() + 6) % 7) >= 3, baseMins: base, createdAt: Date.now(), adapt: [] };
  plan.weeks = genWeeks(plan, 1, weeks, base);
  return plan;
}
/** Which plan week (1-based) a date falls in: 0 = not started yet, > weeks.length = finished. */
function runWeekNow(plan, d) {
  const w = Math.round((mondayOf(d || new Date()) - parseYmd(plan.start)) / (7 * 864e5)) + 1;
  return w < 1 ? 0 : w;
}
const weekRange = (plan, n) => [ymd(addDaysD(parseYmd(plan.start), 7 * (n - 1))), ymd(addDaysD(parseYmd(plan.start), 7 * n - 1))];
function runWeekStats(plan, n) {
  const w = plan.weeks[n - 1]; if (!w) return null;
  const [a, b] = weekRange(plan, n), logs = S.runLogs.filter(l => l.date >= a && l.date <= b);
  const done = logs.reduce((s, l) => s + l.mins, 0), rp = logs.filter(l => l.rpe != null);
  return { n, planned: w.mins, done, pct: w.mins ? done / w.mins : 0, rpe: rp.length ? rp.reduce((s, l) => s + l.rpe, 0) / rp.length : null, pain: logs.some(l => l.pain), count: logs.length, deload: w.deload };
}
/** Decide how to treat the coming weeks after reviewing one finished week. */
function runDecision(cur, prev) {
  if (cur.count === 0 && (!prev || prev.count === 0)) return { action: 'restart', f: 0.6, why: 'No runs for two weeks, so we restart gently at about 60% of your last volume.' };
  if (cur.pain) return { action: 'reduce', f: 0.9, why: 'You flagged pain or niggles. Volume drops about 10% and hard sessions pause. See a clinician if it persists.' };
  if (cur.pct < 0.5) return { action: 'reduce', f: 0.75, why: `Only ${Math.round(cur.pct * 100)}% of the week got done, so the next weeks come down about 25%.` };
  if (cur.pct < 0.7 || (cur.rpe != null && cur.rpe >= 8.5)) return { action: 'reduce', f: 0.9, why: cur.rpe >= 8.5 ? `Runs felt very hard (avg RPE ${cur.rpe.toFixed(1)}), so volume drops about 10%.` : `${Math.round(cur.pct * 100)}% of the week done, so volume drops about 10%.` };
  if (!cur.deload && (cur.pct < 0.9 || (cur.rpe != null && cur.rpe > 6.5))) return { action: 'hold', f: 1, why: cur.pct < 0.9 ? `${Math.round(cur.pct * 100)}% of the week done, so we hold the same volume.` : `Effort ran high (avg RPE ${cur.rpe.toFixed(1)}), so we hold the same volume.` };
  return { action: 'progress', f: 1.08, why: `Week completed at ${Math.round(cur.pct * 100)}%${cur.rpe != null ? ` and avg RPE ${cur.rpe.toFixed(1)}` : ''}. On to the next step.` };
}
/** Review the latest finished week and rewrite the upcoming weeks if needed. Returns the decision when something new was decided. */
function runAdapt() {
  const plan = S.run.plan; if (!plan || !S.settings.autoLoad) return null;
  const cur = runWeekNow(plan), total = plan.weeks.length;
  if (cur < 2 || cur > total + 1) return null;
  const k = Math.min(cur - 1, total);                              // the week just finished
  if (plan.adapt.some(a => a.week === k)) return null;
  const st = runWeekStats(plan, k), prev = k > 1 ? runWeekStats(plan, k - 1) : null;
  if (!st) return null;
  const dec = (k === 1 && plan.partial) ? { action: 'progress', why: 'Week 1 was a part-week, so no changes — the plan carries on.' } : runDecision(st, prev), entry = { week: k, action: dec.action, why: dec.why, pct: Math.round(st.pct * 100), rpe: st.rpe != null ? Math.round(st.rpe * 10) / 10 : null, t: Date.now() };
  plan.adapt.push(entry);
  if (cur > total) { save(); return entry; }
  const hasLogs = (runWeekStats(plan, cur) || {}).count > 0, from = hasLogs ? cur + 1 : cur;
  if (dec.action !== 'progress' && from <= total) {
    const lastBuild = (() => { for (let n = k; n >= 1; n--) if (!plan.weeks[n - 1].deload) return plan.weeks[n - 1].mins; return plan.baseMins; })();
    const ref = dec.action === 'restart' ? Math.max(lastBuild, plan.baseMins) : st.deload ? lastBuild : st.planned;
    const B0 = clamp(Math.round(ref * dec.f), plan.days * 20, plan.cap);
    const qOK = dec.action === 'hold' ? st.pct >= 0.8 : false;
    const fresh = genWeeks(plan, from, total, B0, true);
    if (!qOK && fresh[0]) fresh[0].sessions = fresh[0].sessions.map((s, i) => (s.type === 'tempo' || s.type === 'intervals') ? finishSession(fresh[0].n, i, 'easy', s.mins) : s);
    plan.weeks.splice(from - 1, total - from + 1, ...fresh);

}

/** Running + schedule facts for Coach Ducky's prompt. */
function runContextLines() {
  const L = [], plan = S.run.plan;
  if (plan) {
    const cur = clamp(runWeekNow(plan), 1, plan.weeks.length), w = plan.weeks[cur - 1], st = runWeekStats(plan, cur), a = plan.adapt[plan.adapt.length - 1];
    L.push('', `RUNNING PLAN — ${RUN_GOALS[plan.goal].label}, week ${cur}/${plan.weeks.length}${w.deload ? ' (deload week)' : ''}: ${w.mins} min planned, ${st.done} done. Sessions: ${w.sessions.map(s => `${s.type} ${s.mins} min${s.done ? ' (done)' : ''}`).join(', ')}`);
    if (a) L.push(`Last weekly check-in: week ${a.week} → ${a.action}. ${a.why}`);
  }
  const hz = hrZones();
  if (hz) L.push(`Heart-rate zones (${hz.method}, max ${hz.max} bpm${hz.estimated ? ', estimated' : ''}): Zone 2 = ${hz.zones[1].lo}-${hz.zones[1].hi} bpm`);
  if (S.runLogs.length) L.push('RECENT RUNS: ' + S.runLogs.slice(0, 3).map(l => `${l.date} ${l.type} ${l.mins} min${l.dist ? ' ' + fmtDist(l.dist) : ''}${l.avgHR ? ' avgHR ' + l.avgHR : ''}${l.rpe != null ? ' RPE ' + l.rpe : ''}${l.pain ? ' (pain flagged)' : ''}`).join('; '));
  const today = blocksOn(ymd(new Date()));
  if (today.length) L.push("TODAY'S SCHEDULE: " + today.map(b => `${t12(b.start)} ${b.title} (${b.dur} min)`).join('; '));
  return L;
}

    h += `<div class="err">${r.errors.slice(0, 6).map(e => `<div>${e.line ? 'Line ' + e.line + ': ' : ''}${esc(e.msg)}</div>`).join('')}${r.errors.length > 6 ? `<div>…and ${r.errors.length - 6} more</div>` : ''}</div>`;

function toggleSetAt(ei, si) {
  const s = S.session; if (!s) return;
  const ex = s.exercises[ei], set = ex && ex.sets[si]; if (!set) return;
  if (set.done) unlogSet(ex, set);
  else {
    if (!logSet(ex, set)) return;
    const plan = restPlan(s, ei, si);
    const allDone = s.exercises.every(e => e.sets.every(x => x.done));
    if (plan.sec > 0 && !allDone) startTimer(plan.sec, plan.label);
  }
  save(); render(true);
}
function loadSample(key) {
  const t = TEMPLATES[typeof key === 'string' && TEMPLATES[key] ? key : 'block12'];
  const r = parseInput(t.text, t.name);
  const p = { id: uid(), name: t.name, cycle: 1, created: Date.now(), blocks: r.program.blocks };
  S.programs.push(p); S.activeProgramId = p.id; S.session = null;
  const ex = { 'squat': ['Squat', 140], 'bench press': ['Bench Press', 100], 'deadlift': ['Deadlift', 180], 'overhead press': ['Overhead Press', 60] };
  let added = [];
  Object.entries(ex).forEach(([k, [n, v]]) => { if (!S.lifts[k]) { S.lifts[k] = newLift(n, v); added.push(n); } });
  S.tab = 'train'; save(true); render(); window.scrollTo(0, 0);
  toast(added.length ? 'Sample loaded with example 1RMs — edit them in Lifts' : 'Sample program loaded', 'ok', 3800);
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('in')) {
    const row = t.closest('.setrow'); if (!row || !S.session) return;
    const ex = S.session.exercises[+row.dataset.ei], s = ex && ex.sets[+row.dataset.si]; if (!s) return;
    const f = t.dataset.f;
    if (f === 'w') s.wIn = t.value;
    else if (f === 'e') { s.eff = t.value === '' ? null : Number(t.value); t.classList.toggle('empty', t.value === ''); }
    else s.rIn = t.value;

});
document.addEventListener('change', e => {
  const t = e.target;
  if (!(t.classList && t.classList.contains('in'))) return;
  if (t.dataset.f === 'e') { save(); return; }           // effort never re-evaluates a logged set
  const row = t.closest('.setrow'); if (!row || !S.session) return;
  const ei = +row.dataset.ei, si = +row.dataset.si;
  const ex = S.session.exercises[ei], s = ex && ex.sets[si];
  if (s && s.done) {            // editing a logged set re-evaluates it (undo + redo)
    setTimeout(() => { unlogSet(ex, s); logSet(ex, s); save(); renderKeepFocus(); }, 0);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalCtx) { closeModal(); return; }
  const t = e.target;
  if (t.classList && t.classList.contains('in') && e.key === 'Enter') {
    e.preventDefault();
    const row = t.closest('.setrow'); if (!row) return;
