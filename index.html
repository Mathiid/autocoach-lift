      ${weights.length > 1 ? `<div class="seg" style="margin-top:10px;justify-content:center">${weights.map(w => `<button class="pchip" data-action="m:pw" data-w="${w}">${fmt(w)}</button>`).join('')}</div>` : ''}

/* ---- warm-ups ---- */
function warmupLadder(w, reps) {
  const bar = Number(S.settings.bar) || 20;
  if (!(w > bar * 1.25)) return [];
  const steps = [{ p: 0, r: 10 }, { p: 50, r: 5 }, { p: 75, r: 3 }];
  const out = []; let prev = 0;
  steps.forEach(st => {
    const x = st.p === 0 ? bar : roundInc(w * st.p / 100);
    if (x <= prev || x >= w) return;
    out.push({ w: r2(x), r: st.r, label: st.p === 0 ? 'Bar' : st.p + '%' });
    prev = x;
  });
  return out;
}
const showWu = ex => ex.wuShow !== undefined ? ex.wuShow : !!S.settings.warmups;
function firstWorkWeight(ex) {
  for (const s of ex.sets) { const w = s.done ? s.targetWeight : liveTarget(ex, s); if (w != null) return w; }
  return null;
}
function warmupHTML(ex, ei) {
  if (!showWu(ex)) return '';
  const w = firstWorkWeight(ex);
  if (w == null) return '';
  const ladder = warmupLadder(w, ex.sets[0].targetReps);
  if (!ladder.length) return '';
  ex.wu = ex.wu || {};
  return `<div class="wu"><span class="wu-t" role="img" aria-label="Warm-up sets">${icon('flame', 16)}</span>${ladder.map((l, i) => `<button class="wchip ${ex.wu[i] ? 'done' : ''}" data-action="wu-toggle" data-ei="${ei}" data-i="${i}" aria-pressed="${!!ex.wu[i]}"><small>${l.label}</small>${fmt(l.w)} × ${l.r}</button>`).join('')}</div>`;
}

function suggestAlts(ex) {

  const add = (n, from) => { const k = keyOf(n); if (!n || seen.has(k)) return; seen.add(k); out.push({ name: n, from }); };

  if (ex.swappedFrom) add(ex.swappedFrom, 'original');
  ALT_MAP.forEach(([re, list]) => { if (re.test(ex.name)) list.forEach(n => add(n, 'common')); });
  Object.values(S.lifts).forEach(l => { if (ALT_MAP.some(([re]) => re.test(ex.name) && re.test(l.name))) add(l.name, 'lifts'); });
  return out.slice(0, 12);
}

      },
      swap() {
        const name = $('#swName').value.trim().replace(/\s+/g, ' ');

        if (keyOf(name) === keyOf(ex.name)) { toast("That's already the current exercise", 'warn'); return; }
        const base = num($('#swBase').value);
        if (!getLift(name) && base != null) {
          if (!(base > 0)) { toast('Enter a 1RM greater than 0', 'warn'); return; }
          S.lifts[keyOf(name)] = newLift(name, base);
        }

        if (ex.swappedFrom && keyOf(name) === keyOf(ex.swappedFrom)) ex.swappedFrom = null; else ex.swappedFrom = ex.swappedFrom || from;
        ex.name = name; ex.wu = {};

      });
    }
  });
}

/* ---- charts & stats ---- */
const fmtShort = t => new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
function lineChart(hist, id) {
  let pts = hist.map(h => ({ t: h.t, v: h.v }));
  if (pts.length < 2) return '<div class="chart-empty">Your e1RM trend appears after a few sets 🦆</div>';
  if (pts.length > 60) { const step = Math.ceil(pts.length / 60); pts = pts.filter((_, i) => i % step === 0 || i === pts.length - 1); }
  const W = 320, H = 136, pl = 36, pr = 10, pt = 12, pb = 24;
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  const pad = Math.max((hi - lo) * 0.18, 1), min = lo - pad, max = hi + pad;
  const x = i => pl + i * (W - pl - pr) / (pts.length - 1);
  const y = v => pt + (1 - (v - min) / (max - min)) * (H - pt - pb);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const area = `${d} L${x(pts.length - 1).toFixed(1)} ${H - pb} L${pl} ${H - pb} Z`;
  const ticks = [lo, (lo + hi) / 2, hi].filter((v, i, a) => a.findIndex(q => Math.abs(q - v) < 0.01) === i);
  const many = pts.length > 40;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="e1RM trend from ${fmt(pts[0].v)} to ${fmt(pts[pts.length - 1].v)}">
    <defs><linearGradient id="cg${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc);stop-opacity:.32"/><stop offset="1" style="stop-color:var(--acc);stop-opacity:0"/></linearGradient></defs>
    ${ticks.map(v => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="lbl" x="${pl - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${fmt(r1(v))}</text>`).join('')}
    <path d="${area}" fill="url(#cg${id})"/><path class="ln" d="${d}"/>
    ${pts.map((p, i) => {
      const last = i === pts.length - 1, up = i > 0 && p.v > pts[i - 1].v + 0.001;
      if (many && !last && !up) return '';
      return `<circle class="dot${up ? ' pr' : ''}${last ? ' last' : ''}" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${last ? 4.8 : 3.2}"/>`;
    }).join('')}
    <text class="lbl" x="${pl}" y="${H - 6}">${fmtShort(pts[0].t)}</text><text class="lbl" x="${W - pr}" y="${H - 6}" text-anchor="end">${fmtShort(pts[pts.length - 1].t)}</text></svg>`;
}
function liftHistoryModal(key) {
  const l = S.lifts[key]; if (!l) return;
  const u = S.settings.units;
  const rows = l.history.map((h, i) => ({ h, d: i ? h.v - l.history[i - 1].v : 0 })).reverse();
  openModal({
    title: l.name + ' · e1RM log',
    body: `${lineChart(l.history, 'm')}<div style="margin-top:12px">${rows.map(({ h, d }) => `<div class="hist-row"><span><b>${fmt(h.v)} ${esc(u)}</b> <span class="muted small">${esc(h.why || '')}</span></span><span class="muted small">${d ? `<b style="color:${d > 0 ? 'var(--ok)' : 'var(--bad)'}">${d > 0 ? '+' : ''}${fmt(r1(d))}</b> · ` : ''}${fmtShort(h.t)}</span></div>`).join('')}</div>`,
    footer: `<button class="btn pri grow" data-action="close-modal">Close</button>`
  });
}
function weekStartTs(ts) {
  const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime();
}
function statsNow() {
  const now = Date.now(), ws = weekStartTs(now);
  const addWeek = (a, n) => { const d = new Date(a); d.setDate(d.getDate() + 7 * n); return d.getTime(); };
  const has = a => { const b = addWeek(a, 1); return S.logs.some(l => l.t >= a && l.t < b); };
  let streak = 0, cur = ws;
  if (!has(cur)) cur = addWeek(cur, -1);
  while (has(cur) && streak < 520) { streak++; cur = addWeek(cur, -1); }
  const d7 = now - 7 * 864e5, d30 = now - 30 * 864e5;
  let prs30 = 0;
  S.logs.forEach(l => { if (l.t >= d30) (l.changes || []).forEach(c => { if (c.to > c.from + 0.001) prs30++; }); });
  return {
    weekCount: S.logs.filter(l => l.t >= ws).length, streak,
    vol7: S.logs.filter(l => l.t >= d7).reduce((n, l) => n + (l.volume || 0), 0), prs30
  };
}
function recentPRs(n) {
  const out = [];
  S.logs.forEach(l => (l.changes || []).forEach(c => { if (c.to > c.from + 0.001) out.push({ name: c.name, from: c.from, to: c.to, t: l.t }); }));
  return out.slice(0, n);
}

/* ---- Programs ---- */
function progStats(p) {
  const flat = flatSessions(p), done = doneKeys(p);
  let weeks = 0; p.blocks.forEach(b => { weeks += b.weeks.length; });
  return { blocks: p.blocks.length, weeks, sessions: flat.length, done: flat.filter(x => done.has(skey(x.b, x.w, x.d))).length };
}
function viewPrograms() {
  let h = `<div class="section-h" style="margin-top:4px"><h2>Programs</h2><button class="btn sm pri" data-action="new-program">${icon('plus', 15)} New</button></div>`;
  if (!S.programs.length) {
    return h + `<section class="card hero"><p class="muted">No programs yet. Paste or write one in a simple text format (or JSON) — blocks, weeks, sets × reps and intensity.</p>
      <div class="stack" style="margin-top:14px"><button class="btn pri block" data-action="new-program">Create a program</button><button class="btn block" data-action="load-sample">Load the sample program</button></div></section>`;
  }
  const act = activeProgram();
  S.programs.forEach(p => {
    const st = progStats(p), isAct = p.id === act.id;
    h += `<section class="card" ${isAct ? 'style="border-color:rgba(200,255,0,.5)"' : ''}>
      <div class="row between gap"><div style="min-width:0"><b style="font-size:16px">${esc(p.name)}</b>
        <div class="muted small">${plural(st.blocks, 'block')} · ${plural(st.weeks, 'week')} · ${plural(st.sessions, 'session')}</div></div>
        ${isAct ? '<span class="chip acc">Active</span>' : `<button class="btn sm" data-action="activate-program" data-id="${p.id}">Activate</button>`}</div>
      <div class="prog"><i style="width:${st.sessions ? Math.round(st.done / st.sessions * 100) : 0}%"></i></div>
      <div class="muted xs" style="margin-top:6px">${st.done}/${st.sessions} sessions done${(p.cycle || 1) > 1 ? ` · cycle ${p.cycle}` : ''}</div>
      <div class="row gap wrap" style="margin-top:12px">
        <button class="btn sm" data-action="edit-program" data-id="${p.id}">Edit</button>
        <button class="btn sm ghost" data-action="dup-program" data-id="${p.id}">Duplicate</button>
        <button class="btn sm danger" data-action="del-program" data-id="${p.id}">Delete</button>
      </div></section>`;
  });
  // outline of active program
  const done = doneKeys(act), nxt = nextSession(act);
  h += `<div class="section-h"><h2>${esc(act.name)}</h2><span class="muted small">tap a session to open it</span></div>`;
  act.blocks.forEach((b, bi) => {
    const hasNext = nxt && nxt.b === bi;
    h += `<details class="blk" ${hasNext || act.blocks.length === 1 ? 'open' : ''}><summary><span>${esc(b.name)}</span><span class="muted small">${plural(b.weeks.length, 'week')}</span></summary><div class="wk">`;
    b.weeks.forEach((w, wi) => {
      h += `<div class="wk-h"><span>${esc(w.label)}${w.note ? ' · ' + esc(w.note) : ''}</span>${w.deload ? '<span class="chip warn">Deload</span>' : ''}</div><div class="days">`;
      w.days.forEach((d, di) => {
        const isDone = done.has(skey(bi, wi, di)), isNext = nxt && nxt.b === bi && nxt.w === wi && nxt.d === di;
        h += `<button class="daychip ${isDone ? 'done' : ''} ${isNext ? 'next' : ''}" data-action="open-session" data-b="${bi}" data-w="${wi}" data-d="${di}">${isDone ? icon('check', 13) : ''}${esc(d.name)}</button>`;
      });
      h += '</div>';
    });
    h += '</div></details>';
  });
  return h;
}

function outcomeChip(o) {

let modalCtx = null;
function openModal({ title, body, footer, onMount, onClose, actions }) {
  closeModal(true);
  const root = $('#modal-root');
  root.innerHTML = `<div class="wrapm"><div class="backdrop" data-action="close-modal"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="sheet-h"><h2>${esc(title)}</h2><button class="icon-btn" data-action="close-modal" aria-label="Close">${icon('x', 20)}</button></div>
      <div class="sheet-b">${body}</div>${footer ? `<div class="sheet-f">${footer}</div>` : ''}</div></div>`;
  root.style.pointerEvents = 'auto';
  document.body.classList.add('noscroll');
  requestAnimationFrame(() => { const w = root.firstElementChild; if (w) w.classList.add('show'); });
  modalCtx = { onClose, actions: actions || {} };
  if (onMount) onMount(root);
}
function closeModal(silent) {
  const root = $('#modal-root');
  root.innerHTML = ''; root.style.pointerEvents = 'none';
  document.body.classList.remove('noscroll');
  const c = modalCtx; modalCtx = null;
  if (!silent && c && c.onClose) c.onClose();
}
function toast(msg, kind = 'info', ms = 2800, html = false) {
  const root = $('#toast-root');
  while (root.children.length >= 3) root.firstChild.remove();
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.setAttribute('role', 'status');
  if (html) el.innerHTML = msg; else el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 260); }, ms);
}

      }
    },
    onMount(root) {
      $('#sFile', root).addEventListener('change', e => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          try {
            const o = JSON.parse(rd.result);
            if (!o || typeof o !== 'object' || !Array.isArray(o.programs) || !o.settings || typeof o.lifts !== 'object') throw new Error('not an AutoCoach backup');

      });
    }
  });
}

        const k = isNew ? keyOf(name) : key;
        if (isNew) {
          if (S.lifts[k]) { const ex = S.lifts[k]; ex.baseline = base; setE1rm(ex, base, 'Baseline set'); }
          else S.lifts[k] = newLift(name, base);
        } else {
          const e1 = num($('#lE1').value);
          if (!(e1 > 0)) { toast('Enter a valid e1RM', 'warn'); return; }

    },
    onMount() { setTimeout(() => { const i = $(isNew ? (presetName ? '#lBase' : '#lName') : '#lBase'); if (i) i.focus(); }, 280); }
  });
}

/* ---- Program editor ---- */
function previewHTML(r) {
  if (!r.stats.sessions && !r.errors.length) return '<div class="muted">Write or paste a program above — a live preview appears here.</div>';
  let h = '';
  if (r.errors.length) {
    h += `<div class="err">${r.errors.slice(0, 6).map(e => `<div>${e.line ? 'Line ' + e.line + ': ' : ''}${esc(e.msg)}</div>`).join('')}${r.errors.length > 6 ? `<div>…and ${r.errors.length - 6} more</div>` : ''}</div>`;
  } else {
    h += `<div class="okc">✓ ${plural(r.stats.blocks, 'block')} · ${plural(r.stats.weeks, 'week')} · ${plural(r.stats.sessions, 'session')} · ${plural(r.stats.exercises, 'exercise')}</div>`;
  }
  if (r.warnings.length) h += `<div class="wn">${r.warnings.slice(0, 4).map(w => `<div>${w.line ? 'Line ' + w.line + ': ' : ''}${esc(w.msg)}</div>`).join('')}${r.warnings.length > 4 ? `<div>…and ${r.warnings.length - 4} more notes</div>` : ''}</div>`;
  if (!r.errors.length) { const m = missingFor(r.program); if (m.length) h += `<div class="muted small" style="margin-top:6px">Needs a 1RM (add in Lifts): ${esc(m.join(', '))}</div>`; }
  return h;
}

        const ta = $('#pgText'), raw = ta.value.trim();

        try {
          let out = await callGemini(raw, CONVERT_SYSTEM, { maxTokens: 8192, temperature: 0.2, timeout: 60000 });

          ta.value = out; ta.dispatchEvent(new Event('input'));
          toast('Converted — review it, then save', 'ok', 3600);
        } catch (e) { toast('AI conversion failed: ' + friendlyErr(e), 'err', 4500); }
        finally { el.disabled = false; el.innerHTML = label; }

      save() {
        const r = parseInput($('#pgText').value, $('#pgName').value);
        if (r.errors.length || !r.stats.sessions) { toast('Fix the highlighted problems first', 'err'); return; }
        let p;
        if (ex) {
          ex.name = r.program.name; ex.blocks = r.program.blocks; p = ex;
          if (S.session && S.session.programId === ex.id && !sessionHasLogged(S.session)) S.session = null;
        } else {
          p = { id: uid(), name: r.program.name, cycle: 1, created: Date.now(), blocks: r.program.blocks };
          S.programs.push(p);
          if (!S.activeProgramId || !getProgram(S.activeProgramId)) S.activeProgramId = p.id;
        }
        save(true); closeModal(true); render();
        const m = missingFor(p);
        toast(m.length ? `Saved. Add a 1RM for: ${m.join(', ')}` : 'Program saved', m.length ? 'warn' : 'ok', m.length ? 4800 : 2800);
      }
    },
    onMount(root) {
      const ta = $('#pgText', root), nm = $('#pgName', root), pv = $('#pgPreview', root);
      let t;
      const upd = () => {
        pv.innerHTML = previewHTML(parseInput(ta.value, nm.value));
        $('#pgJsonBtn', root).textContent = ta.value.trim().startsWith('{') ? 'View as text' : 'View as JSON';
      };
      ta.addEventListener('input', () => { clearTimeout(t); t = setTimeout(upd, 220); });
      nm.addEventListener('input', () => { clearTimeout(t); t = setTimeout(upd, 220); });
      $('#pgTpl', root).addEventListener('change', e => {
        const tpl = TEMPLATES[e.target.value]; if (!tpl) return;
        if (ta.value.trim() && !confirm('Replace the current text with this template?')) { e.target.value = ''; return; }
        if (!nm.value.trim()) nm.value = tpl.name;
        ta.value = tpl.text; e.target.value = ''; upd();
      });
      upd();
    }
  });
}

function toggleSetAt(ei, si) {
  const s = S.session; if (!s) return;
  const ex = s.exercises[ei], set = ex && ex.sets[si]; if (!set) return;
  if (set.done) unlogSet(ex, set);
  else {
    if (!logSet(ex, set)) return;
    const rest = restFor(set);
    const allDone = s.exercises.every(e => e.sets.every(x => x.done));
    if (rest && !allDone) startTimer(rest, `${ex.name} · set ${si + 1}`);
  }
  save(); render(true);
}
function loadSample() {
  const t = TEMPLATES.block12;
  const r = parseInput(t.text, t.name);
  const p = { id: uid(), name: t.name, cycle: 1, created: Date.now(), blocks: r.program.blocks };
  S.programs.push(p); S.activeProgramId = p.id; S.session = null;
  const ex = { 'squat': ['Squat', 140], 'bench press': ['Bench Press', 100], 'deadlift': ['Deadlift', 180], 'overhead press': ['Overhead Press', 60] };
  let added = [];
  Object.entries(ex).forEach(([k, [n, v]]) => { if (!S.lifts[k]) { S.lifts[k] = newLift(n, v); added.push(n); } });
  S.tab = 'train'; save(true); render(); window.scrollTo(0, 0);
  toast(added.length ? 'Sample loaded with example 1RMs — edit them in Lifts' : 'Sample program loaded', 'ok', 3800);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a.startsWith('m:')) {
    const f = modalCtx && modalCtx.actions && modalCtx.actions[a.slice(2)];
    if (f) { e.preventDefault(); f(el); }
    return;
  }
  const f = A[a];
  if (f) { e.preventDefault(); f(el, e); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('in')) {
    const row = t.closest('.setrow'); if (!row || !S.session) return;
    const ex = S.session.exercises[+row.dataset.ei], s = ex && ex.sets[+row.dataset.si]; if (!s) return;
    const f = t.dataset.f;
    if (f === 'w') s.wIn = t.value;
    else if (f === 'e') { s.eff = t.value === '' ? null : Number(t.value); t.classList.toggle('empty', t.value === ''); }
    else s.rIn = t.value;
    save();
  } else if (t.id === 'chatIn') { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!(t.classList && t.classList.contains('in'))) return;
  if (t.dataset.f === 'e') { save(); return; }           // effort never re-evaluates a logged set
  const row = t.closest('.setrow'); if (!row || !S.session) return;
  const ei = +row.dataset.ei, si = +row.dataset.si;
  const ex = S.session.exercises[ei], s = ex && ex.sets[si];
  if (s && s.done) {            // editing a logged set re-evaluates it (undo + redo)
    setTimeout(() => { unlogSet(ex, s); logSet(ex, s); save(); renderKeepFocus(); }, 0);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalCtx) { closeModal(); return; }
  const t = e.target;
  if (t.classList && t.classList.contains('in') && e.key === 'Enter') {
    e.preventDefault();
    const row = t.closest('.setrow'); if (!row) return;
    if (t.dataset.f === 'w') { const r = $('.in[data-f="r"]', row); if (r) r.focus(); }
    else if (t.dataset.f === 'e') { t.blur(); }
    else {
      const ex = S.session && S.session.exercises[+row.dataset.ei], s = ex && ex.sets[+row.dataset.si];
      if (s && !s.done) toggleSetAt(+row.dataset.ei, +row.dataset.si); else t.blur();
    }
  }
  if (t.id === 'chatIn' && e.key === 'Enter' && !e.shiftKey && !(window.matchMedia && matchMedia('(pointer:coarse)').matches)) { e.preventDefault(); sendChat(); }
});
document.addEventListener('submit', e => { if (e.target.id === 'chatForm') { e.preventDefault(); sendChat(); } });

/* ---------------------------------------------------------------------
   9. PWA bits (icons, manifest, service worker) & boot
   --------------------------------------------------------------------- */
let deferredInstall = null;
function makeIcon(size) {
  try {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'); if (!g) return null;
    const s = size / 100;
    g.fillStyle = '#121212'; g.fillRect(0, 0, size, size);
    g.translate(size * 0.075, size * 0.075); g.scale(0.85, 0.85);     // keep the duck inside the maskable safe zone
    const ell = (x, y, rx, ry, col, a0 = 0, a1 = Math.PI * 2) => { g.fillStyle = col; g.beginPath(); g.ellipse(x * s, y * s, rx * s, ry * s, 0, a0, a1); g.fill(); };
    ell(60, 74, 27, 18, '#FFD83D');                       // body
    ell(88, 62, 8, 4.5, '#F2B300');                       // tail
    ell(46, 46, 25, 25, '#FFD83D');                       // head
    ell(46, 42, 26, 21, '#C8FF00', Math.PI, Math.PI * 2); // cap
    g.fillStyle = '#C8FF00'; g.beginPath(); g.moveTo(66 * s, 36 * s); g.lineTo(86 * s, 28 * s); g.lineTo(82 * s, 45 * s); g.closePath(); g.fill();   // headband tails
    ell(60, 78, 15, 8, '#F7C51B');                        // wing
    ell(22, 52, 14, 7.5, '#FF8A1F');                      // beak
    ell(52, 48, 3.8, 3.8, '#161616');                     // eye
    ell(53.2, 46.8, 1.3, 1.3, '#FFFFFF');
    ell(40, 60, 4.4, 4.4, 'rgba(255,140,120,.55)');       // cheek
    return c.toDataURL('image/png');
  } catch (e) { return null; }
}
function setupPWA() {
  try {
    const web = /^https?:$/.test(location.protocol);
    const i180 = makeIcon(180);
    if (i180) { const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = i180; document.head.appendChild(l); }
    if (web) {
      const i192 = makeIcon(192), i512 = makeIcon(512);
      if (i192 && i512) {
        const m = {
          name: 'AutoCoach Lift', short_name: 'AutoCoach', description: 'Auto-regulating workout tracker with Coach Quack, an AI duck strength trainer',
          start_url: location.href.split('#')[0], display: 'standalone', orientation: 'portrait',
          background_color: '#000000', theme_color: '#000000',
          icons: [{ src: i192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' }, { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }]
        };
        const l = document.createElement('link'); l.rel = 'manifest';
        l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
        document.head.appendChild(l);
      }
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => { /* sw.js not deployed: app still works, just without the offline cache */ });
    }
  } catch (e) { /* non-critical */ }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
}

  plateCalc, warmupLadder, restFor, startTimer, stopTimer, finishTimer, suggestAlts, lineChart, statsNow, duck, makeIcon, celebrate, fmtClock,

};
