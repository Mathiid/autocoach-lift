<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="AutoCoach Lift — auto-regulating workout tracker with Coach Ducky, your AI rubber-duck trainer.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AutoCoach">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='%23121212'/%3E%3Cpath%20d='M12%2040C11%2050%2017%2057%2033%2057C47%2057%2055%2050%2054%2040C54%2036%2056%2032%2058%2028C53%2031%2049%2032%2045%2032C40%2033%2036%2035%2032%2035C26%2036%2018%2036%2012%2040Z'%20fill='%23FFD83D'%20stroke='%23E2A900'%20stroke-width='1.6'/%3E%3Ccircle%20cx='27'%20cy='24'%20r='13'%20fill='%23FFD83D'%20stroke='%23E2A900'%20stroke-width='1.6'/%3E%3Cpath%20d='M15%2019Q27%208%2039%2019L38.5%2023.5Q27%2014%2015.5%2023.5Z'%20fill='%23E53935'/%3E%3Cpath%20d='M16%2024C9%2022%204%2025%205%2028C6%2031%2012%2032%2017%2029Z'%20fill='%23FF8A1F'/%3E%3Ccircle%20cx='22'%20cy='20.5'%20r='2'%20fill='%231b1b1b'/%3E%3C/svg%3E">
<title>AutoCoach Lift</title>
<style>
:root{
  --bg:#121212; --bg0:#000000; --card:#1E1E1E; --card2:#2A2A2A; --line:#333333; --line2:#404040;
  --txt:#FFFFFF; --mut:#A8A8A8; --dim:#707070;
  --acc:#C8FF00; --acc2:#A8F000; --on-acc:#0B1200;
  --pg:#DCEBB1; --py:#F4EDB4;                 /* muted pastel green / yellow highlight cards */
  --ok:#C8FF00; --pr:#FFD83D; --warn:#FF9F43; --bad:#FF5C7A; --info:#7CC6FF;
  --r:20px; --r-sm:14px; --r-lg:24px; --nav:82px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button,input,select,textarea{font-family:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:24px;letter-spacing:-.025em;line-height:1.15;font-weight:850}
h2{font-size:19px;letter-spacing:-.015em;font-weight:800}
h3{font-size:15px}
b,strong{font-weight:750}
small{font-size:.82em}
.ic{flex:none;display:block}
.center{text-align:center}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 16px 10px;background:rgba(0,0,0,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.02em;font-size:19px}
.brand b{color:var(--acc)}
.logo{width:36px;height:36px;border-radius:12px;background:var(--py);display:grid;place-items:center;overflow:hidden;border:2px solid var(--acc)}
.logo svg{width:30px;height:30px}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--mut);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;cursor:pointer}
.icon-btn:active{background:var(--card2)}
main{max-width:980px;margin:0 auto;padding:16px 14px calc(var(--nav) + var(--safe-b) + 36px)}
body.has-timer main{padding-bottom:calc(var(--nav) + var(--safe-b) + 124px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 14px calc(10px + var(--safe-b));pointer-events:none}
.tabbar .inner{pointer-events:auto;display:flex;max-width:520px;margin:0 auto;background:rgba(30,30,30,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line2);border-radius:30px;padding:6px;box-shadow:0 12px 34px rgba(0,0,0,.65)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px 4px;background:none;border:0;color:var(--mut);font-size:10.5px;font-weight:750;cursor:pointer;border-radius:24px;min-width:0}
.tab .ico{width:48px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s,color .2s}
.tab.on{color:var(--acc)}
.tab.on .ico{background:var(--acc);color:var(--on-acc)}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.hl{background:var(--pg);color:#111;border-color:transparent}
.card.hl-y{background:var(--py);color:#111;border-color:transparent}
.hl .muted,.hl-y .muted{color:rgba(0,0,0,.62)}
.hl .eyebrow,.hl-y .eyebrow{color:rgba(0,0,0,.55)}
.hl .chip,.hl-y .chip{background:rgba(0,0,0,.09);border-color:transparent;color:#1b1b1b}
.hl .chip.warn,.hl-y .chip.warn{background:#111;color:var(--warn)}
.hl .prog,.hl-y .prog{background:rgba(0,0,0,.13)}
.hl .prog i,.hl-y .prog i{background:#111}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap{gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--mut)}
.small{font-size:13px}
.xs{font-size:11.5px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;background:var(--card2);color:var(--mut);font-size:12px;font-weight:750;border:1px solid var(--line);white-space:nowrap;font-family:inherit}
.chip.acc{color:var(--acc);border-color:rgba(200,255,0,.35);background:rgba(200,255,0,.09)}
.chip.warn{color:var(--warn);border-color:rgba(255,159,67,.4);background:rgba(255,159,67,.1)}
.chip.bad{color:var(--bad);border-color:rgba(255,92,122,.4);background:rgba(255,92,122,.1)}
.chip.pr{color:var(--pr);border-color:rgba(255,216,61,.4);background:rgba(255,216,61,.1)}
button.chip{cursor:pointer}
.btn{appearance:none;border:1px solid var(--line2);background:var(--card2);color:#fff;border-radius:16px;padding:10px 18px;font-size:15px;font-weight:750;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc);box-shadow:0 8px 22px rgba(200,255,0,.16)}
.btn.dark{background:#0d0d0d;border-color:#0d0d0d;color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(255,92,122,.4);background:transparent}
.btn.sm{min-height:38px;padding:6px 14px;font-size:13px;border-radius:13px}
.btn.block{width:100%}
.link{appearance:none;background:none;border:0;color:var(--acc);font-size:13px;font-weight:750;cursor:pointer;padding:0}
.txt{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:#fff;padding:10px 14px;font-size:16px}
.txt:focus,.code:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
select.txt{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.code{width:100%;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:#fff;padding:12px 14px;font:16px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;min-height:240px;white-space:pre;overflow:auto}
.field{margin-bottom:14px}
.field>label,.lbl{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:750;color:var(--mut);margin-bottom:6px}
.hint{font-size:12.5px;color:var(--dim);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sec-t{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.sec-t:first-child{margin-top:0;border-top:0;padding-top:0}
/* toggle switch */
.switch{display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between;gap:14px;font-size:14px;margin:8px 0 14px;cursor:pointer}
.switch small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:32px;border-radius:999px;background:#3a3a3a;position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s,background .2s}
.switch input:checked{background:var(--acc)}
.switch input:checked::after{transform:translateX(20px);background:#0B1200}
.switch input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.prog{height:8px;border-radius:999px;background:var(--card2);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .25s}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
.hero{text-align:center;padding:26px 18px}
.hero h1{margin:12px 0 8px}
.hero-ic{width:64px;height:64px;border-radius:20px;margin:0 auto;background:rgba(200,255,0,.12);color:var(--acc);display:grid;place-items:center}
.steps{text-align:left;margin:16px auto;padding-left:22px;max-width:420px;color:var(--mut);display:grid;gap:6px}
.steps b{color:#fff}

/* ---------- Coach Ducky mascot ---------- */
.duck{display:block;flex:none;overflow:visible}
.hero-duck{flex:none;cursor:pointer;line-height:0;user-select:none;-webkit-user-select:none}
.hero-duck.c{display:flex;justify-content:center;margin-bottom:4px}
.wig{animation:wig .55s ease}
@keyframes wig{0%{transform:rotate(0)}20%{transform:rotate(-9deg) scale(1.05)}45%{transform:rotate(8deg) scale(1.05)}70%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
.bubble{position:relative;background:#fff;color:#111;border-radius:20px 20px 6px 20px;padding:11px 14px;font-weight:650;font-size:14px;line-height:1.35;flex:1;min-width:0}
.bubble b{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:#4a5a12;margin-bottom:3px}
.hero-q{display:flex;align-items:flex-end;gap:8px}
.av{width:38px;height:38px;border-radius:50%;background:var(--py);display:grid;place-items:center;flex:none;overflow:hidden;border:2px solid var(--acc)}
.av svg{width:34px;height:34px}
.av.lg{width:48px;height:48px}
.av.lg svg{width:42px;height:42px}

/* ---------- dashboard ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{border-radius:var(--r);padding:14px 16px;background:var(--card);border:1px solid var(--line);min-width:0}
.stat.g{background:var(--pg);color:#111;border-color:transparent}
.stat.y{background:var(--py);color:#111;border-color:transparent}
.stat .l{font-size:12px;font-weight:800;opacity:.72;display:flex;align-items:center;gap:6px}
.stat .n{font-size:32px;font-weight:850;letter-spacing:-.035em;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.stat .n small{font-size:13px;font-weight:750;letter-spacing:0;opacity:.7;margin-left:3px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tool{appearance:none;border:1px solid var(--line);background:var(--card);color:#fff;border-radius:var(--r);padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:800;cursor:pointer;min-width:0}
.tool:active{transform:scale(.97)}
.tool .tic{width:44px;height:44px;border-radius:15px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{appearance:none;text-align:left;border:0;background:var(--card2);color:#fff;border-radius:16px;padding:12px;cursor:pointer;min-width:0;display:block;width:100%}
.tile b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.tile .w{font-size:20px;font-weight:850;letter-spacing:-.02em;margin-top:8px;color:var(--acc);font-variant-numeric:tabular-nums}
.tile .w small{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:0}

/* ---------- workout ---------- */
.ex-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
.ex-grid .card{margin-bottom:0}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-n{font-size:18px;font-weight:850;letter-spacing:-.015em}
.xtools{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;margin-top:12px}
.tbtn{appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid var(--line2);background:var(--card2);color:#fff;border-radius:16px;padding:8px 4px 7px;font-size:11.5px;font-weight:750;cursor:pointer;min-height:56px;min-width:0;white-space:nowrap}
.tbtn:active{transform:scale(.96)}
.tbtn svg{color:var(--acc)}
.tbtn[aria-pressed="true"]{border-color:rgba(200,255,0,.5);background:rgba(200,255,0,.1);color:var(--acc)}
.wu{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.wu-t{display:inline-flex;align-items:center;color:var(--acc);margin-right:2px}
.wchip{appearance:none;border:1px dashed var(--line2);background:transparent;color:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:750;cursor:pointer;font-variant-numeric:tabular-nums}
.wchip small{color:var(--mut);font-weight:700;margin-right:3px}
.wchip.done{background:rgba(200,255,0,.13);border:1px solid rgba(200,255,0,.5);color:var(--acc)}
.wchip.done small{color:var(--acc);opacity:.7}
.sets{margin-top:12px}
.sethead{font-size:10.5px;color:var(--dim);font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:0 6px 5px}
.sethead span:nth-child(n+3){text-align:center}
.setrow{padding:6px;border-radius:16px;margin-bottom:6px;background:var(--bg);border:1px solid transparent;--sc:var(--ok)}
.setno{font-weight:850;color:var(--mut);text-align:center;font-variant-numeric:tabular-nums}
.tgt{min-width:0}
.t1{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1 .x{color:var(--dim);font-weight:650}
.t2{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in{width:100%;height:44px;border-radius:13px;border:1px solid var(--line2);background:var(--card2);color:#fff;font-size:16px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;padding:0 3px;min-width:0}
.in::placeholder{color:var(--dim);font-weight:650}
.in:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.chk{width:42px;height:44px;border-radius:13px;border:1px solid var(--line2);background:var(--card2);color:var(--dim);display:grid;place-items:center;cursor:pointer;padding:0}
.setrow.done{background:var(--card2);box-shadow:inset 3px 0 0 var(--sc)}
.setrow.done{background:color-mix(in srgb,var(--sc) 11%,#121212)}
.setrow.done .chk{background:var(--sc);border-color:var(--sc);color:#0b0b0b}
.setrow.done .t2 .sc{color:var(--sc);font-weight:800}
.st-hit,.st-logged{--sc:var(--ok)}
.st-exceeded{--sc:var(--pr)}
.st-minor{--sc:var(--warn)}
.st-fail{--sc:var(--bad)}
.st-adjusted{--sc:var(--info)}
.ex-f{display:flex;gap:8px;margin-top:8px}
.coach-card{border-color:rgba(200,255,0,.3);background:linear-gradient(180deg,rgba(200,255,0,.08),var(--card) 55%)}
.coach-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.md p{margin:0 0 8px}
.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 8px;padding-left:20px}
.md li{margin:3px 0}
.md code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:.92em}
.clamp{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.typing{display:inline-flex;gap:5px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

/* ---------- rest timer ---------- */
#timer-root{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--safe-b) + 6px);z-index:35;display:flex;justify-content:center;padding:0 14px;pointer-events:none}
.timer{pointer-events:auto;position:relative;overflow:hidden;width:100%;max-width:500px;background:#050505;border:1px solid var(--line2);border-radius:24px;padding:10px 12px 12px;box-shadow:0 14px 38px rgba(0,0,0,.7)}
.timer-row{display:flex;align-items:center;gap:8px}
.t-time{appearance:none;background:none;border:0;color:#fff;font-size:30px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.03em;min-width:84px;text-align:left;padding:0;cursor:pointer}
.t-info{flex:1;min-width:0;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-info b{display:block;color:#fff;font-size:13px}
.tb{appearance:none;border:1px solid var(--line2);background:var(--card2);color:#fff;border-radius:999px;min-width:44px;height:38px;padding:0 12px;font-size:13px;font-weight:800;cursor:pointer}
.tb.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.timer .presets{display:none;gap:8px;margin-top:10px}
.timer.open .presets{display:flex}
.timer .presets .tb{flex:1}
.timer .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--acc);transition:width .25s linear}
.timer.done{background:var(--acc);color:var(--on-acc);border-color:var(--acc);animation:pulse .7s ease 3}
.timer.done .t-time,.timer.done .t-info,.timer.done .t-info b{color:var(--on-acc)}
.timer.done .tb{background:#0d0d0d;color:#fff;border-color:#0d0d0d}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

/* ---------- plates ---------- */
.pc-top{display:flex;align-items:center;gap:10px}
.rb{appearance:none;width:52px;height:52px;border-radius:18px;border:1px solid var(--line2);background:var(--card2);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.rb:active{transform:scale(.95)}
.big-in{font-size:30px!important;font-weight:850;text-align:center;min-height:56px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.barbell{display:flex;align-items:center;height:132px;padding:0 10px;background:var(--bg);border:1px solid var(--line);border-radius:20px;margin:14px 0 10px;overflow-x:auto}
.bb-bar{flex:none;width:30px;height:12px;background:linear-gradient(#cfcfcf,#7d7d7d);border-radius:4px 0 0 4px}
.bb-collar{flex:none;width:9px;height:34px;background:linear-gradient(90deg,#8a8a8a,#bdbdbd);border-radius:3px}
.bplate{flex:none;width:19px;margin-left:3px;border-radius:6px;display:grid;place-items:center;color:#111;font-size:10px;font-weight:850;writing-mode:vertical-rl;transform:rotate(180deg);border:1px solid rgba(0,0,0,.25)}
.bb-end{flex:1;min-width:22px;height:16px;background:linear-gradient(#cfcfcf,#7d7d7d);border-radius:0 8px 8px 0;margin-left:3px}
.pc-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pc-item{background:var(--card2);border-radius:14px;padding:8px 14px;font-size:14px}
.pc-item b{color:var(--acc);font-size:17px}
.pc-warn{background:rgba(255,159,67,.12);border:1px solid rgba(255,159,67,.4);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:13px;margin-top:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.pchip{appearance:none;border:1px solid var(--line2);background:var(--card2);color:var(--mut);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:800;cursor:pointer;min-height:36px;font-variant-numeric:tabular-nums}
.pchip.on{background:rgba(200,255,0,.13);border-color:rgba(200,255,0,.55);color:var(--acc)}

/* ---------- lifts / charts / programs / history ---------- */
.big{font-size:32px;font-weight:850;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:14px;color:var(--mut);font-weight:750;margin-left:3px;letter-spacing:0}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv div{background:var(--bg);border-radius:14px;padding:9px 11px}
.kv span{display:block;font-size:11px;color:var(--mut);font-weight:750}
.kv b{font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block;margin-top:12px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--dim);font-size:9.5px;font-weight:700}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chart .dot{fill:var(--acc);stroke:var(--card);stroke-width:2}
.chart .dot.pr{fill:var(--pr)}
.chart .dot.last{stroke:#fff;stroke-width:1.5}
.chart-empty{margin-top:12px;border:1px dashed var(--line2);border-radius:16px;padding:16px;text-align:center;color:var(--mut);font-size:13px}
.delta{font-size:13px;font-weight:800}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.miss-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.miss-row .txt{width:110px}
.hist-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist-row:last-child{border-bottom:0}
details{margin:0}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.blk{border:1px solid var(--line);border-radius:18px;margin-top:10px;background:var(--card)}
.blk>summary{padding:14px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.blk .wk{padding:0 16px 14px}
.wk-h{font-size:12.5px;font-weight:750;color:var(--mut);margin:10px 0 6px;display:flex;gap:8px;align-items:center}
.days{display:flex;flex-wrap:wrap;gap:6px}
.daychip{appearance:none;border:1px solid var(--line2);background:var(--card2);color:#fff;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:750;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.daychip.done{color:var(--mut);border-color:rgba(200,255,0,.25)}
.daychip.done svg{color:var(--ok)}
.daychip.next{border-color:var(--acc);color:var(--on-acc);background:var(--acc)}
.log>summary{display:flex;justify-content:space-between;align-items:center;gap:10px}
.log-ex{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.log-ex+.log-ex{margin-top:10px}
.preview{margin-top:12px;font-size:13.5px}
.preview .err{color:var(--bad);display:grid;gap:3px}
.preview .okc{color:var(--ok);font-weight:800}
.preview .wn{color:var(--warn);margin-top:6px;display:grid;gap:3px}
.help{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;font-size:13px;color:var(--mut)}
.help code{background:var(--card2);padding:1px 6px;border-radius:6px;color:#fff;font-size:12.5px;white-space:pre-wrap}
.help pre{margin:8px 0 0;background:var(--card2);border-radius:10px;padding:10px;color:#fff;font-size:12.5px;overflow:auto}
.alts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.alt{appearance:none;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line2);background:var(--card2);color:#fff;border-radius:16px;padding:12px 14px;font-size:15px;font-weight:750;cursor:pointer}
.alt small{color:var(--mut);font-weight:700}
.alt.on{border-color:var(--acc);background:rgba(200,255,0,.1)}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:12px;padding:4px 0 8px;min-height:40vh}
.msg{display:flex;gap:9px;align-items:flex-end;max-width:94%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:11px 14px;min-width:0;overflow-wrap:anywhere}
.msg.user .bub{background:var(--acc);border-color:var(--acc);color:var(--on-acc);border-radius:20px 20px 6px 20px;font-weight:650}
.bub .who{font-size:11.5px;font-weight:800;color:var(--acc);margin-bottom:3px}
.bub .t{font-size:10.5px;color:var(--dim);margin-top:5px}
.msg.user .bub .t{color:rgba(11,18,0,.6)}
.msg.sys{align-self:center;max-width:100%}
.msg.sys .bub{background:transparent;border-style:dashed;color:var(--mut);font-size:13px;border-radius:14px}
.composer{position:sticky;bottom:calc(var(--nav) + var(--safe-b));background:linear-gradient(rgba(18,18,18,0),var(--bg) 24%);padding:12px 0 8px}
body.has-timer .composer{bottom:calc(var(--nav) + var(--safe-b) + 84px)}
.composer form{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:48px;max-height:120px;border-radius:18px;border:1px solid var(--line2);background:var(--card);color:#fff;padding:12px 15px;font-size:16px;resize:none;line-height:1.35}
.composer .btn{width:50px;padding:0;min-height:48px;border-radius:18px}
.suggest{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.suggest::-webkit-scrollbar{display:none}

/* ---------- modal, toast, confetti ---------- */
#modal-root{position:fixed;inset:0;z-index:50;pointer-events:none}
.wrapm{position:absolute;inset:0}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.72);opacity:0;transition:opacity .18s;pointer-events:auto}
.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,24px);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line2);border-radius:var(--r-lg) var(--r-lg) 0 0;opacity:0;transition:transform .2s,opacity .2s;pointer-events:auto;padding-bottom:var(--safe-b)}
.wrapm.show .backdrop{opacity:1}
.wrapm.show .sheet{opacity:1;transform:translate(-50%,0)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 10px 6px 20px}
.sheet-b{overflow:auto;padding:6px 20px 16px;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--line)}
@media(min-width:700px){
  .sheet{bottom:auto;top:50%;transform:translate(-50%,-46%);border-radius:var(--r-lg)}
  .wrapm.show .sheet{transform:translate(-50%,-50%)}
  .ex-grid{grid-template-columns:1fr 1fr}
  .code{font-size:14px}
}
#toast-root{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--safe-b) + 12px);z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
body.has-timer #toast-root{bottom:calc(var(--nav) + var(--safe-b) + 98px)}
.toast{max-width:500px;background:#2a2a2a;border:1px solid var(--line2);border-left:5px solid var(--info);color:#fff;padding:12px 16px;border-radius:18px;font-size:14px;font-weight:650;box-shadow:0 10px 30px rgba(0,0,0,.55);opacity:0;transform:translateY(10px);transition:.22s}
.toast.in{opacity:1;transform:none}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)} .toast.err{border-left-color:var(--bad)}
.toast.pr{border-left-color:var(--pr);background:linear-gradient(135deg,#3a3510,#2a2a2a);display:flex;align-items:center;gap:12px}
.toast .pr-duck{flex:none;line-height:0}
.toast small{color:var(--mut);font-weight:650}
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- v2 additions ---------- */
select.in{appearance:none;-webkit-appearance:none;font-size:14px;padding:0;text-align:center;text-align-last:center;cursor:pointer;background-image:none}
select.in.empty{color:var(--dim);font-weight:700}
.etag{color:var(--acc);font-weight:750;font-size:11px;margin-left:3px;white-space:nowrap}
.bubble::after{content:"";position:absolute;right:-7px;bottom:14px;border:8px solid transparent;border-left-color:#fff;border-right:0}
/* long unbroken names (exercises, lifts, programs) must never widen the page */
#view,.sheet-b,#toast-root,.timer,.bubble{overflow-wrap:anywhere}
.ex-grid>*,.stats>*,.tiles>*{min-width:0}
.btn{white-space:nowrap}

/* ---------- v3: Coach Ducky, form guide & cues ---------- */
.fgbtn{appearance:none;display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 10px 3px 4px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:12px;font-weight:750;cursor:pointer;max-width:100%}
.fgbtn:active{transform:scale(.97)}
.fgbtn:hover,.fgbtn:focus-visible{color:var(--acc);border-color:rgba(200,255,0,.4)}
.fgbtn .duck{width:20px;height:20px}
.cue{display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 12px 8px 8px;border-radius:16px;background:rgba(200,255,0,.06);border:1px dashed rgba(200,255,0,.3)}
.cue.heavy{background:rgba(255,216,61,.1);border:1px solid rgba(255,216,61,.5)}
.cue-d{flex:none;width:34px;height:34px;border-radius:50%;background:var(--py);display:grid;place-items:center;overflow:hidden;border:2px solid var(--acc)}
.cue-d svg{width:30px;height:30px}
.cue-b{min-width:0;flex:1}
.cue-b small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);margin-bottom:3px}
.cue.heavy .cue-b small{color:var(--pr)}
.cue-c{display:flex;flex-wrap:wrap;gap:6px}
.cue-c span{padding:3px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line2);font-size:12.5px;font-weight:750;color:#fff}
ul.fg{margin:0;padding-left:20px;display:grid;gap:5px;font-size:14px;color:#ddd}
ul.fg.bad li::marker{color:var(--bad)}
ul.fg li::marker{color:var(--acc)}
.fg-ans{margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px}
.fg-ans:empty{display:none}
a.btn{text-decoration:none}
.hero-duck.flex{animation:flex .6s ease}
@keyframes flex{0%{transform:scale(1)}25%{transform:scale(1.12,.94)}50%{transform:scale(.96,1.08)}75%{transform:scale(1.06)}100%{transform:scale(1)}}
.duck.head{overflow:hidden}

/* ---------- v3: supersets, swap scope ---------- */
.xtools{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));grid-auto-columns:unset}
.ssb{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;padding:0 6px;margin-right:7px;border-radius:7px;background:var(--acc);color:var(--on-acc);font-size:11px;font-weight:850;letter-spacing:.02em;vertical-align:2px}
.ss{border-color:rgba(200,255,0,.38);background:linear-gradient(180deg,rgba(200,255,0,.06),var(--card) 40%)}
.ss-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ss-h .chip svg{color:var(--acc)}
.ss-r-t{flex:1;min-width:0}
.ss-m{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.ss-r{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:12px 0 6px}
.ss-r i{flex:1;height:1px;background:var(--line)}
.ss-tag{font-size:12px;font-weight:800;color:#fff;margin:0 0 3px 4px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-tag .ssb{margin-right:6px}
.tbtn.mini{min-height:30px;padding:3px 10px;flex-direction:row;gap:6px;font-size:12px;border-radius:12px;margin-left:auto}
.ex-n .ssb{vertical-align:3px}

/* ---------- v3: progression ---------- */
.prog-hint{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.chip.kind{color:var(--mut)}
.timer .t-note{display:flex;align-items:center;gap:8px;margin-top:8px;padding:7px 10px;border-radius:12px;background:var(--card2,#161616);font-size:12.5px;color:var(--dim)}
.timer .t-note span{flex:1;min-width:0}
.timer .t-note .link{flex:none}
.timer .t-note .ic{flex:none;color:var(--acc)}
.sw-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.perm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);margin:-6px 0 12px}
.perm b{color:var(--txt,#fff)}
.dayrow{display:flex;gap:6px;flex-wrap:wrap}
.dsel{min-width:44px;min-height:40px;justify-content:center}
.dsel.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.runrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.runrow:first-child{border-top:0;padding-top:2px}
.rdot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px}
.rsess{margin-top:12px}
.rs{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.rs.done{opacity:.62}
.rs .fgbtn{margin-top:8px}
.zt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.zt div{background:var(--bg);border-radius:12px;padding:8px 4px;text-align:center}
.zt div.z2{outline:2px solid var(--acc);outline-offset:-2px}
.zt span{display:block;font-size:11px;color:var(--mut);font-weight:800}
.zt b{font-size:12.5px;font-variant-numeric:tabular-nums}
.rbars{display:flex;align-items:flex-end;gap:3px;height:110px;margin:14px 0 4px}
.rb{position:relative;flex:1;min-width:0;height:100%;display:flex;align-items:flex-end}
.rb .pl{position:absolute;left:0;right:0;bottom:16px;border:1.5px solid var(--line2);border-radius:5px 5px 2px 2px;box-sizing:border-box;max-height:calc(100% - 16px)}
.rb .dn{position:absolute;left:2px;right:2px;bottom:16px;background:var(--acc);border-radius:4px 4px 1px 1px;max-height:calc(100% - 16px)}
.rb.dl .pl{border-style:dashed;border-color:var(--warn)}
.rb.now .pl{border-color:var(--acc)}
.rb span{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:9.5px;color:var(--dim);font-weight:700}
.rb.now span{color:var(--acc)}
.adp{padding:8px 0;border-top:1px solid var(--line);margin-top:8px}
.adp .chip{margin-bottom:4px}
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.cal-lbl{margin:0 2px 10px;font-weight:700}
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:10px}
.cal-h{display:grid;grid-template-columns:36px repeat(var(--n),minmax(0,1fr));border-bottom:1px solid var(--line);background:var(--card)}
.dh{text-align:center;padding:7px 0 6px;position:relative;min-width:0}
.dh span{display:block;font-size:11px;color:var(--mut);font-weight:750;text-transform:uppercase;letter-spacing:.04em}
.dh b{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:50%;font-size:15px;font-variant-numeric:tabular-nums}
.dh em{display:block;font-style:normal;font-size:8.5px;font-weight:850;letter-spacing:.08em;color:var(--acc);line-height:1;margin-top:1px}
.dh.today span{color:var(--acc)}
.dh.today b{background:var(--acc);color:var(--on-acc)}
.cal-b{position:relative;display:grid;grid-template-columns:36px 1fr}
.gut{position:relative}
.gut span{position:absolute;right:5px;transform:translateY(-50%);font-size:10px;color:var(--dim);font-weight:700;white-space:nowrap}
.cols{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px)}
.col{position:relative;border-left:1px solid var(--line);min-width:0;cursor:pointer}
.col.today{background:rgba(200,255,0,.045)}
.bw{position:absolute;padding:0 1px;box-sizing:border-box;min-width:0}
.blk{appearance:none;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:0;width:100%;height:100%;text-align:left;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 20%,#0d0d0d);color:var(--txt);border-radius:7px;padding:3px 5px;font-family:inherit;cursor:pointer;overflow:hidden;box-sizing:border-box}
.blk b{font-size:11.5px;line-height:1.15;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk span{font-size:10px;color:var(--mut);font-weight:650;white-space:nowrap}
.blk.today{box-shadow:0 0 0 1.5px var(--c)}
.blk.done{opacity:.55}
.blk.live{animation:pulse 1.6s ease infinite;box-shadow:0 0 0 2px var(--c)}
.cal.week .blk{padding:2px 3px}
.cal.week .blk b{font-size:9.5px;white-space:normal;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cal.week .blk span{display:none}
.wkb{position:absolute;left:0;right:0;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px);border-top:1px dashed var(--line2);border-bottom:1px dashed var(--line2)}
.wkb span{position:absolute;top:3px;left:4px;font-size:9px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--bad);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.upn .eyebrow{color:inherit;opacity:.7}
.tip{background:var(--card2);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.tip b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);margin-bottom:3px}
.tip p{margin:0;font-size:13.5px;line-height:1.45;color:var(--txt)}
.trow{appearance:none;display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:14px;padding:11px 0;text-align:left;cursor:pointer;min-height:44px}
.trow:first-of-type{margin-top:8px}
.trow i{flex:none;width:4px;align-self:stretch;border-radius:3px}
.trow .tt{flex:none;width:64px;color:var(--mut);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700}
.trow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow small{flex:none;color:var(--mut);font-weight:700}
.trow.done b{text-decoration:line-through;opacity:.6}
.trow.live small{color:var(--acc)}
.trow.past{opacity:.6}
.tab .ico{width:100%;max-width:48px}
@media (max-width:340px){.tab{font-size:10px}.tabbar{padding-left:8px;padding-right:8px}}
.plan-seg{margin:2px 0 14px;flex-wrap:nowrap}
.plan-seg .pchip{flex:1;text-align:center;padding:7px 6px}
.hist-f{display:flex;gap:6px;margin:0 0 12px}
.cal.week .wkb span{display:none}
.blk.short{flex-direction:row;align-items:center;gap:6px;padding:0 6px}
.blk.short b{flex:0 1 auto;min-width:0}
.blk.short span{flex:none}
.cal.week .blk.short span{display:none}
/* ---- stage 10: one-tap steppers, low-energy mode, backup ---- */
.setrow{display:block;padding:8px}
.srow-top{display:grid;grid-template-columns:22px minmax(0,1fr) 48px;gap:6px;align-items:center}
.sets.eff .srow-top{grid-template-columns:22px minmax(0,1fr) 58px 48px}
.srow-top .chk{width:48px;height:46px}
.srow-top select.in{height:46px}
.steps{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px;margin-top:8px}
.stp{display:grid;gap:3px;align-items:stretch}
.stp.sw{grid-template-columns:36px minmax(0,1fr) 36px}
.stp.sr{grid-template-columns:32px minmax(0,1fr) 32px}
.stf{position:relative;min-width:0}
.stp .in{height:52px;padding:0 1px 13px;font-size:19px;border-radius:14px;line-height:1}
.cap{position:absolute;left:0;right:0;bottom:5px;line-height:1;text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);pointer-events:none;white-space:nowrap}
.sb{appearance:none;-webkit-appearance:none;height:52px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);color:#fff;font-size:25px;font-weight:700;line-height:1;cursor:pointer;padding:0 0 3px;touch-action:manipulation;display:grid;place-items:center;user-select:none;-webkit-user-select:none}
.sb:active{transform:scale(.93);background:var(--line2)}
.sb:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.setrow.done .sb,.setrow.done .stp .in{background:color-mix(in srgb,var(--sc) 8%,var(--card2))}
.lowt{display:inline-block;padding:0 6px;border-radius:999px;font-size:10px;font-weight:800;line-height:15px;color:var(--info);background:color-mix(in srgb,var(--info) 16%,transparent);vertical-align:1px}
.lowe-btn{appearance:none;display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:11px 14px;border-radius:16px;border:1px dashed var(--line2);background:transparent;color:#fff;text-align:left;cursor:pointer;min-height:56px}
.lowe-btn:active{transform:scale(.99)}
.lowe-ic{font-size:22px;line-height:1;flex:none}
.lowe-tx{display:flex;flex-direction:column;min-width:0}
.lowe-tx b{font-size:14px;font-weight:800}
.lowe-tx small{color:var(--mut);font-size:11.5px;line-height:1.35;margin-top:1px}
.lowe.on{margin-top:14px;padding:12px;border-radius:16px;border:1px solid color-mix(in srgb,var(--info) 55%,transparent);background:color-mix(in srgb,var(--info) 9%,transparent)}
.lowe-h{display:flex;align-items:center;gap:12px}
.lseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.lseg button{appearance:none;height:44px;border-radius:13px;border:1px solid var(--line2);background:var(--card2);color:#fff;font-size:14px;font-weight:800;cursor:pointer;touch-action:manipulation}
.lseg button[aria-pressed="true"]{background:var(--info);border-color:var(--info);color:#0b0b0b}
.ovw{margin-top:6px}
.ovr{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.ovr:first-child{border-top:0}
.ovr span:first-child{font-weight:750;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.card.bk{padding:12px 14px}
@media (max-width:360px){.steps{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:6px}.stp{gap:2px}.stp.sw{grid-template-columns:31px minmax(0,1fr) 31px}.stp.sr{grid-template-columns:29px minmax(0,1fr) 29px}.stp .in{font-size:18px}.sb{font-size:23px;border-radius:12px}.cap{letter-spacing:.04em}}
/* ---- stage 11: intensity tiers ---- */
.tier-row{background:var(--bg);border-radius:16px;padding:11px 12px;margin-bottom:8px}
.tier-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tier-h b{font-size:15px}
.tier-h .muted{text-align:right;min-width:0}
.tier-in{display:grid;grid-template-columns:minmax(0,1fr) 12px minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:8px;color:var(--mut);font-size:13px}

.tier-pv{margin-top:6px;line-height:1.45}
.kv.k4{grid-template-columns:repeat(2,1fr)}
.kv.k4 b{font-variant-numeric:tabular-nums}

<script>
/* =====================================================================
   AutoCoach Lift — single-file PWA
   Dynamic weight engine + auto-regulation + Coach Ducky (Gemini AI rubber-duck trainer).
   Everything is stored in localStorage (key: autocoach-lift:v1).
   ===================================================================== */
(() => {
'use strict';

/* ---------------------------------------------------------------------
   0. Helpers
   --------------------------------------------------------------------- */
const $  = (s, r = document) => r.querySelector(s);

const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

};
const r1 = n => Math.round(n * 10) / 10;
const r2 = n => Math.round(n * 100) / 100;
const fmt = n => (n === null || n === undefined || !Number.isFinite(n)) ? '—' : String(r2(n));

const fmtDate = t => new Date(t).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
const fmtTime = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

const IC = {
  dumbbell: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',

  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',

  home: '<path d="M3 11.5L12 4l9 7.5M5.5 10v10h13V10M10 20v-5.5h4V20"/>',
  minus: '<path d="M5 12h14"/>',
  flame: '<path d="M12 3c.6 3.6 5.4 5.6 5.4 10.4a5.4 5.4 0 0 1-10.8 0c0-2.2 1-3.6 2.2-4.8.3 1.5 1 2.3 2.1 2.6C10.3 8 10.6 5.4 12 3Z"/>',
  bolt: '<path d="M13 2.5L4.5 13.5H11L10 21.5l8.5-11H12Z"/>',
  trophy: '<path d="M8 4h8v5.2a4 4 0 0 1-8 0ZM8 6H4.5v1.2A3 3 0 0 0 8 10M16 6h3.5v1.2A3 3 0 0 1 16 10M12 13.2V17M8.5 20.5h7M10 17h4"/>',
  plates: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21"/>',
  timer: '<circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4.2l2.6 1.6M9.5 2.5h5M12 2.5v3.5"/>',
  calc: '<rect x="5" y="3" width="14" height="18" rx="2.6"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/>',
  chart: '<path d="M4 19V5M4 19h16M8 15l3.5-4.2 3 2.4L19 8"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  pin: '<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  run: '<circle cx="14.5" cy="4.5" r="2"/><path d="M8 21l3-6 3 1 1 5M11 15l-1-4 4-2 3 3 3 .5M10 11L7 13"/>',
  bell: '<path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2H4.5ZM10 21h4"/>',
  muscle: '<path d="M4 14c0-4 3-8 7-8 2 0 3 1 3 3l5-1c1 0 2 1 2 2 0 4-3 8-8 8-3 0-5-1-9-4Z"/>'
};
const icon = (n, s = 22) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n] || ''}</svg>`;

/* ---------------------------------------------------------------------
   1. State (persisted in localStorage)
   --------------------------------------------------------------------- */
/* ---- Intensity tiers: every label is a % RANGE of 1RM (defined early: loadState needs it) ---- */
const TIER_KEYS = ['heavy', 'medium', 'light', 'deload'];
const TIER_INFO = {
  heavy:  { name: 'Heavy',  lo: 80, hi: 92, reps: [1, 6],  use: 'Strength & peak power' },
  medium: { name: 'Medium', lo: 70, hi: 79, reps: [6, 10], use: 'Hypertrophy & base' },
  light:  { name: 'Light',  lo: 50, hi: 65, reps: null,    use: 'Speed, explosive work & technique' },
  deload: { name: 'Deload', lo: 50, hi: 60, reps: [3, 10], use: 'Recovery weeks' }
};
/** Saved tiers → validated tiers. A pre-range backup whose label % was customised keeps that exact % (lo = hi). */
function migrateTiers(so) {
  const out = {}, OLD = { heavy: 85, medium: 75, light: 65 };
  const saved = so && so.tiers && typeof so.tiers === 'object' ? so.tiers : null;
  TIER_KEYS.forEach(k => {
    const d = TIER_INFO[k], t = saved && saved[k];
    if (t && typeof t === 'object') {
      let lo = Number(t.lo), hi = Number(t.hi); const pos = Number(t.pos);
      if (!(lo >= 20 && lo <= 110)) lo = d.lo;
      if (!(hi >= 20 && hi <= 110)) hi = d.hi;
      if (hi < lo) { const x = lo; lo = hi; hi = x; }
      out[k] = { lo, hi, pos: Number.isFinite(pos) ? clamp(pos, 0, 100) : 50 };
    } else {
      const old = so && so.labels ? Number(so.labels[k]) : NaN;
      out[k] = old >= 20 && old <= 110 && OLD[k] != null && old !== OLD[k] ? { lo: old, hi: old, pos: 50 } : { lo: d.lo, hi: d.hi, pos: 50 };
    }
  });
  return out;
}

const LS_KEY = 'autocoach-lift:v1';
const defaults = () => ({
  v: 3,
  settings: {
    units: 'kg', rounding: 2.5, apiKey: '', model: 'gemini-2.5-flash', autoCoach: true,
    labels: { heavy: 85, medium: 75, light: 65 },   // legacy single-% labels (kept so old backups still load)
    tiers: { heavy: { lo: 80, hi: 92, pos: 50 }, medium: { lo: 70, hi: 79, pos: 50 }, light: { lo: 50, hi: 65, pos: 50 }, deload: { lo: 50, hi: 60, pos: 50 } },
    tierAuto: true,         // pick the % inside each range from reps + week in the block
    deloadAuto: true,       // deload weeks: Deload range + half the working sets
    effort: 'rpe',          // per-set effort: 'rpe' (1-10) | 'rir' (0-5) | 'off'
    restMode: 'smart',      // rest timer: 'smart' | '60' | '90' | '120' | '180' | 'off'
    sound: true, warmups: true, bar: 20, plates: [20, 10, 5, 2.5, 1.25],
    cues: true,             // show technique cues before the next set
    autoLoad: true,         // raise e1RM / loads automatically when sets feel easy or targets are hit
    notify: true,           // rest-timer system notifications (needs browser permission)
    keepAwake: true,        // hold the screen awake while a rest timer is running
    ssBetween: 20,          // default seconds between paired superset exercises
    bgAudio: false,         // silent keep-alive audio track so the beep can sound in the background (can pause other media)
    notifyAsked: false
  },
  cues: {},             // user-written technique cues per exercise key
  prog: {},             // progression memory per exercise key (free-load & bodyweight work)
  profile: { age: null, maxHR: null, restHR: null, workKind: 'work', workStart: '09:00', workEnd: '17:00', workDays: [1, 2, 3, 4, 5], wake: '06:30' },
  run: { plan: null, unit: 'km' },
  runLogs: [],          // finished runs, newest first
  sched: { blocks: [], view: '3d', day: 0 },
  lifts: {},            // keyOf(name) -> { name, baseline, e1rm, hold, history[] }
  programs: [],         // { id, name, cycle, blocks[] }
  activeProgramId: null,
  session: null,        // workout in progress (draft)
  logs: [],             // finished workouts, newest first
  coach: [],            // chat messages
  timer: null,          // running rest timer { end, total, label }
  tab: 'home'
});
let S = loadState();

function loadState() {
  const d = defaults();
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && typeof o === 'object') {
        Object.assign(d, o);
        const ds = defaults().settings;
        d.settings = Object.assign(ds, o.settings || {});
        d.settings.labels = Object.assign(defaults().settings.labels, (o.settings && o.settings.labels) || {});
        d.settings.tiers = migrateTiers(o.settings || {});
        d.settings.tierAuto = d.settings.tierAuto !== false; d.settings.deloadAuto = d.settings.deloadAuto !== false;
        if (!d.lifts || typeof d.lifts !== 'object') d.lifts = {};
        ['programs', 'logs', 'coach'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
        const st = d.settings, so = o.settings || {}, lbs = st.units === 'lb';
        if (!Array.isArray(so.plates) || !so.plates.length || so.plates.some(x => !(Number(x) > 0))) st.plates = lbs ? [45, 25, 10, 5, 2.5] : [20, 10, 5, 2.5, 1.25];
        st.plates = st.plates.map(Number);
        if (!(Number(so.bar) > 0)) st.bar = lbs ? 45 : 20;
        if (!['rpe', 'rir', 'off'].includes(st.effort)) st.effort = 'rpe';
        st.restMode = String(st.restMode);
        if (!['smart', 'off', '60', '90', '120', '180'].includes(st.restMode)) st.restMode = 'smart';
        st.sound = st.sound !== false; st.warmups = st.warmups !== false;
        if (!d.timer || typeof d.timer.end !== 'number' || d.timer.end <= Date.now()) d.timer = null;
        d.v = 3; d.lastBackup = Number(d.lastBackup) || 0;
        if (!['home', 'train', 'sched', 'programs', 'lifts', 'run', 'coach', 'history'].includes(d.tab)) d.tab = 'home';
        const dd = defaults();
        ['cues', 'prog'].forEach(k => { if (!d[k] || typeof d[k] !== 'object' || Array.isArray(d[k])) d[k] = {}; });
        d.profile = Object.assign(dd.profile, o.profile || {});
        if (!Array.isArray(d.profile.workDays)) d.profile.workDays = dd.profile.workDays;
        d.run = Object.assign(dd.run, o.run || {}); if (d.run.unit !== 'mi') d.run.unit = 'km';
        if (!Array.isArray(d.runLogs)) d.runLogs = [];
        d.sched = Object.assign(dd.sched, o.sched || {});
        if (!Array.isArray(d.sched.blocks)) d.sched.blocks = [];
        if (!['day', '3d', 'week'].includes(d.sched.view)) d.sched.view = '3d';
        ['cues', 'autoLoad', 'notify', 'keepAwake'].forEach(k => { st[k] = st[k] !== false; });
        st.ssBetween = clamp(Math.round(Number(st.ssBetween)) || 20, 0, 300);
        st.bgAudio = st.bgAudio === true; st.notifyAsked = st.notifyAsked === true;
      }
    }

}
let saveTimer = null;
function save(now) {
  if (now) return persist();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 120);
}
function persist() {
  clearTimeout(saveTimer);
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch (e) { toast('Storage is full or blocked — changes may not persist', 'err', 4000); }
}
window.addEventListener('pagehide', persist);
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });

/* ---------------------------------------------------------------------
   2. Weight engine
   --------------------------------------------------------------------- */
const EPS = 0.05;              // ignore float noise when comparing e1RMs
const MAX_E1RM_REPS = 12;      // Epley gets unreliable beyond ~12 reps: don't auto-raise e1RM from those
const LABELS = { heavy: 'Heavy', medium: 'Medium', light: 'Light', deload: 'Deload' };

/** Epley: weight * (1 + reps/30). A true single (1 rep) is the weight itself. */
function epley(w, r) {
  if (!(w > 0) || !(r > 0)) return 0;
  return r === 1 ? w : w * (1 + r / 30);
}
function roundInc(x) {
  const inc = Number(S.settings.rounding) > 0 ? Number(S.settings.rounding) : 2.5;
  return Math.round(x / inc) * inc;
}
const getLift = name => S.lifts[keyOf(name)] || null;
/* ---- Intensity tiers (engine): the label picks a range, reps + week-in-block + your slider pick the % inside it ---- */
function tierCfg(k) {
  const d = TIER_INFO[k], t = (S.settings.tiers && S.settings.tiers[k]) || {};
  let lo = Number(t.lo), hi = Number(t.hi); const pos = Number(t.pos);
  if (!(lo > 0)) lo = d.lo;
  if (!(hi > 0)) hi = d.hi;
  if (hi < lo) { const x = lo; lo = hi; hi = x; }
  return { lo, hi, pos: Number.isFinite(pos) ? clamp(pos, 0, 100) : 50 };
}
const tierRangeText = (k, c) => { c = c || tierCfg(k); return c.lo === c.hi ? `${fmt(c.lo)}%` : `${fmt(c.lo)}–${fmt(c.hi)}%${k === 'heavy' ? '+' : ''}`; };
/**
 * Pure maths. ctx = { reps, wf }  reps = target reps of the set, wf = 0..1 progress through the block's build weeks.
 * auto on : position = average of (fewer reps → higher) and (later week → higher), then nudged by the slider (50 = neutral).
 * auto off: position = slider (0 = lower bound … 100 = upper bound).
 * Light (speed work) ignores reps and week; Deload ignores the week. Result is rounded to the nearest 0.5 %.
 */
function calcTierPct(k, c, auto, ctx) {
  const d = TIER_INFO[k], x = ctx || {};
  let pos = c.pos / 100;
  if (auto) {
    const parts = [];
    if (d.reps && x.reps > 0) parts.push(clamp(1 - (x.reps - d.reps[0]) / (d.reps[1] - d.reps[0]), 0, 1));
    if (k !== 'light' && k !== 'deload' && x.wf != null) parts.push(x.wf);
    if (parts.length) pos = clamp(parts.reduce((a, b) => a + b, 0) / parts.length + (pos - 0.5), 0, 1);
  }
  return Math.round((c.lo + (c.hi - c.lo) * pos) * 2) / 2;
}
const tierPct = (k, ctx) => calcTierPct(k, tierCfg(k), S.settings.tierAuto !== false, ctx);
/** Which tier a labelled set really uses: in a deload week every label maps to Deload (unless switched off in Settings). */
const tierOf = (int, ctx) => ctx && ctx.dl && S.settings.deloadAuto !== false ? 'deload' : int.v;
/** Week context for a program position: dl = deload week; wf = progress through the block's non-deload weeks. */
function weekCtx(p, b, w) {
  const blk = p && p.blocks[b], wk = blk && blk.weeks[w];
  if (!wk) return {};
  if (wk.deload) return { wf: null, dl: true };
  const build = []; blk.weeks.forEach((x, i) => { if (!x.deload) build.push(i); });
  return { wf: build.length > 1 ? build.indexOf(w) / (build.length - 1) : 0.5, dl: false };
}
const sessionCtx = () => { const s = S.session, p = s && getProgram(s.programId); return p ? weekCtx(p, s.b, s.w) : {}; };
const setCtx = set => Object.assign({ reps: set && set.targetReps }, sessionCtx());

function intPct(int, ctx) {
  if (!int) return null;
  if (int.t === 'pct') return int.v;
  if (int.t === 'label' && TIER_INFO[int.v]) return tierPct(tierOf(int, ctx), ctx);
  return null;
}
/** Short name used in prescriptions and when serialising programs. */
function intName(int) {
  if (!int) return '';
  if (int.t === 'pct') return fmt(int.v) + '%';
  if (int.t === 'label') return LABELS[int.v];
  return fmt(int.v) + S.settings.units;
}
function intFull(int, ctx) {
  if (!int) return 'free';
  if (int.t === 'label' && TIER_INFO[int.v]) { const k = tierOf(int, ctx); return `${LABELS[k]} ${fmt(tierPct(k, ctx))}%`; }
  return intName(int);
}
/** Target weight = e1RM * prescribed %, rounded to the loading increment. */
function targetFor(name, int, ctx) {
  if (!int) return null;
  if (int.t === 'abs') return int.v;
  const pct = intPct(int, ctx);
  const l = getLift(name);
  if (pct == null || !l || !(l.e1rm > 0)) return null;
  let w = roundInc(l.e1rm * pct / 100);
  if (l.hold && l.hold.weight > 0) w = Math.min(w, l.hold.weight);   // "hold steady" after a minor miss
  return r2(w);
}

function setE1rm(lift, v, why) {
  lift.e1rm = v;
  lift.history.push({ t: Date.now(), v, why });
  if (lift.history.length > 200) lift.history.splice(0, lift.history.length - 200);
}
function revertE1rm(lift, prev, next) {
  lift.e1rm = prev;
  const h = lift.history;
  if (h.length && Math.abs(h[h.length - 1].v - next) < 0.001) h.pop();
  else h.push({ t: Date.now(), v: prev, why: 'Undo' });
}
function newLift(name, baseline) {
  return { name: name.trim(), baseline, e1rm: baseline, hold: null, history: [{ t: Date.now(), v: baseline, why: 'Baseline' }] };
}

/** Significant-miss back-off: 2.5% (close) up to 5% (way short). */
const dropFor = ratio => ratio >= 0.7 ? 2.5 : ratio >= 0.5 ? 3.75 : 5;
/**
 * Classify one logged set.
 *  exceeded : Epley e1RM beats the stored e1RM  -> raise it
 *  hit      : reps >= target
 *  minor    : short by <=1 rep or <15%          -> hold e1RM / hold weight next time
 *  fail     : significantly short               -> drop e1RM 2.5-5% + coach
 *  adjusted : lifter chose a lighter weight than prescribed (not judged)
 *  logged   : nothing to compare against (accessories / no 1RM)
 */
function classify(o) {
  const e = epley(o.weight, o.reps);
  const canRaise = o.e1rmBefore != null && o.reps >= 1 && o.reps <= MAX_E1RM_REPS && e > o.e1rmBefore + EPS;
  if (canRaise) return { status: 'exceeded', e };
  if (o.targetWeight == null || !(o.targetReps > 0)) return { status: 'logged', e };
  if (o.reps >= o.targetReps) return { status: 'hit', e };
  if (o.weight < o.targetWeight * 0.975) return { status: 'adjusted', e };
  const short = o.targetReps - o.reps;
  const ratio = o.reps / o.targetReps;
  if (short <= 1 || ratio >= 0.85) return { status: 'minor', e, short };
  return { status: 'fail', e, short, drop: dropFor(ratio) };
}

/* ---------------------------------------------------------------------
   3. Programs: text format <-> structure
   Program = { id, name, cycle, blocks:[{ name, weeks:[{ num,label,note,deload,
               days:[{ name, exercises:[{ name, sets:[{reps,repsText,int}] }] }] }] }] }
   int = null | {t:'pct',v:75} | {t:'label',v:'heavy'} | {t:'abs',v:100}
   --------------------------------------------------------------------- */
const RE_BLOCK = /^block\b\s*(\d+)?\s*[:\-–—]?\s*(.*)$/i;
const RE_WEEK  = /^weeks?\b\s*(\d+)(?:\s*(?:-|–|—|to)\s*(\d+))?\s*(?:[:\-–—]\s*)?(.*)$/i;
const RE_DAY   = /^day\b\s*(\d+)?\s*[:\-–—]?\s*(.*)$/i;
const RE_PROG  = /^(?:program|plan)\s*[:\-–—]\s*(.+)$/i;
const SET_RE   = /(\d+)\s*[x×]\s*(\d+(?:\s*[-–]\s*\d+)?\+?|amrap|max)/i;
const PCT_RE   = /^(\d+(?:\.\d+)?)\s*%(?:\s*\(?\s*([+-]\s*\d+(?:\.\d+)?)\s*%?(?:\s*\/\s*(?:wk|week))?\s*\)?)?/i;
const LABEL_RE = /^(heavy|medium|med|light|deload)\b/i;
const ABS_RE   = /^(\d+(?:\.\d+)?)\s*(?:kgs?|lbs?)\b/i;

function parseIntensity(tail) {
  let t = tail.trim().replace(/^@\s*/, '').replace(/^[-–:]\s*/, '').trim();
  if (!t) return { int: null, leftover: '' };
  let m;
  if ((m = PCT_RE.exec(t))) {
    const v = parseFloat(m[1]);
    const ramp = m[2] ? parseFloat(m[2].replace(/\s+/g, '')) : 0;
    return { int: { t: 'pct', v, ramp }, leftover: t.slice(m[0].length).trim() };
  }
  if ((m = LABEL_RE.exec(t))) {
    const w = m[1].toLowerCase();
    return { int: { t: 'label', v: w === 'med' ? 'medium' : w }, leftover: t.slice(m[0].length).trim() };
  }
  if ((m = ABS_RE.exec(t))) return { int: { t: 'abs', v: parseFloat(m[1]) }, leftover: t.slice(m[0].length).trim() };
  if ((m = /^(\d+(?:\.\d+)?)\s*$/.exec(t)) && parseFloat(m[1]) <= 100) {
    return { int: { t: 'pct', v: parseFloat(m[1]), ramp: 0 }, leftover: '', assumed: true };
  }
  return { int: null, leftover: t };
}

function parseRepsToken(tok) {
  const txt = tok.toLowerCase().replace(/\s+/g, '');
  if (txt === 'amrap' || txt === 'max') return { reps: 1, repsText: 'AMRAP' };
  return { reps: parseInt(txt, 10), repsText: txt };
}

const REST_RE = /^(\d+(?:\.\d+)?)\s*(m|min|mins|s|sec|secs)?\s*(?:\/\s*(?:(\d+(?:\.\d+)?)\s*(m|min|mins|s|sec|secs)?)?)?$/i;
const toSec = (n, u) => Math.round(parseFloat(n) * (/^m/i.test(u || '') ? 60 : 1));
/** "20/90" = 20 s between paired exercises, 90 s after each round. "90" = 90 s after each set/round. "20/" = between only. */
function parseRestSpec(txt) {
  const t = String(txt || '').trim(), m = REST_RE.exec(t);
  if (!m) return null;
  const slash = t.includes('/');
  const first = toSec(m[1], m[2]), second = m[3] != null ? toSec(m[3], m[4] || m[2]) : null;
  const r = slash ? (second != null ? { b: first, a: second } : { b: first, a: null }) : { b: null, a: first };
  if ([r.b, r.a].some(v => v != null && (v < 0 || v > 3600))) return null;
  return r;
}
const restText = r => r.b != null && r.a != null ? `${r.b}/${r.a}` : r.a != null ? String(r.a) : `${r.b}/`;
const SS_LABEL_RE = /^([A-Za-z])(\d)\s*[.):\-–]\s+(?=\S)/;
function exExtras(ex) {
  const o = {};
  if (ex.alts && ex.alts.length) o.alts = ex.alts.slice();
  if (ex.cues && ex.cues.length) o.cues = ex.cues.slice();
  if (ex.ss) o.ss = ex.ss;
  if (ex.rest) o.rest = Object.assign({}, ex.rest);
  return o;
}
function parseExerciseLine(line, ln, errors, warnings) {
  let alts = [], cues = [], restSpec = null, ss = null;
  const lm = SS_LABEL_RE.exec(line);
  if (lm) { ss = lm[1].toUpperCase(); line = line.slice(lm[0].length); }
  if (line.includes('|')) {
    const parts = line.split('|'); line = parts.shift().trim();
    let last = '';
    parts.forEach(pt => {
      const t = pt.trim(); if (!t) return;
      const m = /^(alts?|alternatives?|cues?|rest)\b\s*:?\s*(.*)$/i.exec(t);
      if (m) {
        last = /^a/i.test(m[1]) ? 'a' : /^c/i.test(m[1]) ? 'c' : 'r';
        if (last === 'a') alts.push(...m[2].split(/\s*\/\s*/).map(x => x.trim()).filter(Boolean));
        else if (last === 'c') cues.push(...m[2].split(/\s*[\/;]\s*/).map(x => x.trim().slice(0, 48)).filter(Boolean));
        else { restSpec = parseRestSpec(m[2]); if (!restSpec) warnings.push({ line: ln, msg: `Couldn't read rest "${m[2]}" (use e.g. | rest: 20/90 or | rest: 2m)` }); }
      } else if (last === 'a') alts.push(...t.split(/\s*\/\s*/).map(x => x.trim()).filter(Boolean));
      else warnings.push({ line: ln, msg: `Ignored "| ${t}"` });
    });
    alts = alts.slice(0, 8); cues = cues.slice(0, 6);
  }
  const m = SET_RE.exec(line);
  if (!m) { errors.push({ line: ln, msg: `Couldn't find sets × reps in "${line.slice(0, 50)}" (expected e.g. "Squat 4x6 @ 75%")` }); return null; }
  const name = line.slice(0, m.index).replace(/[\s:\-–—@,|]+$/, '').replace(/\s+/g, ' ').trim();
  if (!name) { errors.push({ line: ln, msg: 'Exercise name is missing before the sets × reps' }); return null; }
  const rest = line.slice(m.index);
  const groups = rest.split(/\s*[;,]\s*|\s+then\s+/i).filter(g => g.trim());
  const sets = [];
  groups.forEach(g => {
    const gm = SET_RE.exec(g);
    if (!gm) { warnings.push({ line: ln, msg: `Ignored "${g.trim()}"` }); return; }
    const n = parseInt(gm[1], 10);
    const rp = parseRepsToken(gm[2]);
    if (!(n >= 1 && n <= 20)) { errors.push({ line: ln, msg: `${n} sets looks wrong (use 1–20)` }); return; }
    if (!(rp.reps >= 1 && rp.reps <= 100)) { errors.push({ line: ln, msg: `${rp.repsText} reps looks wrong` }); return; }
    const rng = /^(\d+)-(\d+)/.exec(rp.repsText);
    if (rng && +rng[2] < +rng[1]) { errors.push({ line: ln, msg: `Rep range ${rp.repsText} is backwards` }); return; }
    const pi = parseIntensity(g.slice(gm.index + gm[0].length));
    if (pi.int && pi.int.t === 'pct' && !(pi.int.v > 0 && pi.int.v <= 120)) { errors.push({ line: ln, msg: `${pi.int.v}% is outside 1–120%` }); return; }
    if (pi.leftover) warnings.push({ line: ln, msg: `Ignored "${pi.leftover}"` });
    if (pi.assumed) warnings.push({ line: ln, msg: `"${gm[0]} @ ${pi.int.v}" read as ${pi.int.v}% of 1RM — add "kg" if you meant an absolute weight` });
    for (let i = 0; i < n; i++) sets.push({ reps: rp.reps, repsText: rp.repsText, int: pi.int ? Object.assign({}, pi.int) : null });
  });
  if (!sets.length) return null;
  return Object.assign({ name, sets }, exExtras({ alts, cues, ss, rest: restSpec }));
}

function parseProgramText(text) {
  const errors = [], warnings = [];
  const blocks = [];
  let progName = null, blk = null, grp = null, day = null;
  const newBlock = (name, hint) => { blk = { name, hint, groups: [] }; blocks.push(blk); grp = null; day = null; };
  const newGroup = (from, to, label, deload) => {
    if (!blk) newBlock('Block ' + (blocks.length + 1), null);
    grp = { from, to, label, deload, days: [] }; blk.groups.push(grp); day = null;
  };
  const newDay = name => {
    if (!grp) { if (blk && blk.hint) newGroup(blk.hint[0], blk.hint[1], '', false); else newGroup(1, 1, '', false); }
    day = { name, exercises: [] }; grp.days.push(day);
  };

  String(text || '').replace(/\r/g, '').split('\n').forEach((raw, i) => {
    const ln = i + 1;
    let line = raw.trim();
    if (!line || line.startsWith('//')) return;
    if (line[0] === '#') {
      line = line.replace(/^#+\s*/, '');
      if (!(RE_BLOCK.test(line) || RE_WEEK.test(line) || RE_DAY.test(line) || RE_PROG.test(line))) return; // comment
    }
    line = line.replace(/^(?:[-*•]|\d+[.)])\s+/, '').replace(/[*`]/g, '').trim();
    if (!line) return;
    let m;
    if ((m = RE_PROG.exec(line))) { progName = m[1].trim(); return; }
    if ((m = RE_BLOCK.exec(line))) {
      let name = (m[2] || '').trim(), hint = null;
      const hm = /\(?\bweeks?\s*(\d+)\s*(?:-|–|—|to)\s*(\d+)\)?/i.exec(name);
      if (hm) { hint = [+hm[1], +hm[2]]; name = name.replace(hm[0], '').replace(/[\s\-–—:,]+$/, '').trim(); }
      if (!name) name = 'Block ' + (m[1] || blocks.length + 1);
      newBlock(name, hint); return;
    }
    if ((m = RE_WEEK.exec(line))) {
      const a = +m[1]; let b = m[2] ? +m[2] : a;
      if (b < a) { errors.push({ line: ln, msg: `Week range ${a}-${b} is backwards` }); b = a; }
      if (b - a > 51) { errors.push({ line: ln, msg: 'A week range can span at most 52 weeks' }); b = a; }
      const rest = (m[3] || '').trim();
      const deload = /deload/i.test(rest);
      const label = rest.replace(/\(?\bdeload\b\)?/ig, '').replace(/^[\s:\-–—()]+|[\s:\-–—()]+$/g, '');
      newGroup(a, b, label, deload); return;
    }
    if ((m = RE_DAY.exec(line))) {
      const name = (m[2] || '').trim() || ('Day ' + (m[1] || (grp ? grp.days.length + 1 : 1)));
      newDay(name); return;
    }
    if ((m = /^(?:ss|supersets?|super-set)\s*[:\-–—]\s*(.+)$/i.exec(line))) {
      const bar = m[1].indexOf('|'), mods = bar >= 0 ? m[1].slice(bar) : '', main = bar >= 0 ? m[1].slice(0, bar) : m[1];
      const parts = main.split(/\s+\+\s+|\s*&\s*/).map(x => x.trim()).filter(Boolean);
      if (parts.length < 2) { errors.push({ line: ln, msg: 'A superset needs two exercises joined with + (e.g. Superset: Pull-ups 3x8 + Dips 3x10)' }); return; }
      if (!day) newDay('Day ' + (grp ? grp.days.length + 1 : 1));
      day.ssN = (day.ssN || 0) + 1; const id = 'S' + day.ssN;
      parts.forEach((pt, pi) => { const ex = parseExerciseLine(pi === 0 ? pt + ' ' + mods : pt, ln, errors, warnings); if (ex) { ex.ss = id; day.exercises.push(ex); } });
      return;
    }
    const ex = parseExerciseLine(line, ln, errors, warnings);
    if (!ex) return;
    if (!day) newDay('Day ' + (grp ? grp.days.length + 1 : 1));
    day.exercises.push(ex);
  });

  // expand week ranges (with optional per-week % ramp)
  const outBlocks = [];
  blocks.forEach((b, bi) => {
    const weeks = [];
    b.groups.forEach(g => {
      for (let n = g.from; n <= g.to; n++) {
        const k = n - g.from;
        const days = g.days.filter(d => d.exercises.length).map(d => ({
          name: d.name,
          exercises: d.exercises.map(ex => ({
            name: ex.name,
            ...exExtras(ex),
            sets: ex.sets.map(s => ({
              reps: s.reps, repsText: s.repsText,
              int: s.int ? (s.int.t === 'pct' ? { t: 'pct', v: r2(s.int.v + (s.int.ramp || 0) * k) } : Object.assign({}, s.int)) : null
            }))
          }))
        }));
        if (!days.length) { if (k === 0) warnings.push({ line: 0, msg: `Week ${n} has no exercises — skipped` }); continue; }
        weeks.push({ num: n, label: 'Week ' + n, note: g.label || '', deload: !!g.deload, days });
      }
    });
    if (weeks.length) outBlocks.push({ name: b.name, weeks });
    else warnings.push({ line: 0, msg: `Block "${b.name}" has no workouts — skipped` });
  });
  return finishParse({ name: progName, blocks: outBlocks }, errors, warnings);
}

function finishParse(program, errors, warnings) {
  const names = new Set();
  let weeks = 0, sessions = 0, lonely = 0;
  program.blocks.forEach(b => b.weeks.forEach(w => { weeks++; w.days.forEach(d => {
    sessions++;
    const cnt = {}; d.exercises.forEach(e => { if (e.ss) cnt[e.ss] = (cnt[e.ss] || 0) + 1; });
    d.exercises.forEach(e => { names.add(keyOf(e.name)); if (e.ss && cnt[e.ss] < 2) { delete e.ss; lonely++; } });
  }); }));
  if (lonely) warnings.push({ line: 0, msg: `${plural(lonely, 'superset label')} had no partner and ${lonely === 1 ? 'was' : 'were'} treated as a normal exercise` });
  if (!sessions && !errors.length) errors.push({ line: 0, msg: 'No workouts found. Add at least one exercise line like "Squat 4x6 @ 75%".' });
  return { program, errors, warnings, stats: { blocks: program.blocks.length, weeks, sessions, exercises: names.size } };
}

/** JSON import (same structure the app stores). */
function normalizeProgramJSON(o) {
  const errors = [], warnings = [];
  const normInt = i => {
    if (!i || typeof i !== 'object') return null;
    if (i.t === 'pct' && Number(i.v) > 0 && Number(i.v) <= 120) return { t: 'pct', v: Number(i.v) };
    if (i.t === 'label' && LABELS[i.v]) return { t: 'label', v: i.v };
    if (i.t === 'abs' && Number(i.v) > 0) return { t: 'abs', v: Number(i.v) };
    return null;
  };
  const prog = { name: o && o.name ? String(o.name) : null, blocks: [] };
  if (!o || !Array.isArray(o.blocks)) { errors.push({ line: 0, msg: 'JSON needs a "blocks" array' }); return finishParse(prog, errors, warnings); }
  o.blocks.forEach((b, bi) => {
    const blk = { name: String((b && b.name) || 'Block ' + (bi + 1)), weeks: [] };
    ((b && b.weeks) || []).forEach((w, wi) => {
      const num = Number.isFinite(+w.num) && +w.num > 0 ? +w.num : wi + 1;
      const wk = { num, label: String(w.label || 'Week ' + num), note: String(w.note || ''), deload: !!w.deload, days: [] };
      (w.days || []).forEach((d, di) => {
        const dy = { name: String(d.name || 'Day ' + (di + 1)), exercises: [] };
        (d.exercises || []).forEach(e => {
          if (!e || !e.name || !Array.isArray(e.sets) || !e.sets.length) { warnings.push({ line: 0, msg: 'Skipped an exercise without name/sets' }); return; }
          dy.exercises.push({
            name: String(e.name).trim(),
            ...(Array.isArray(e.alts) && e.alts.length ? { alts: e.alts.map(a => String(a).trim()).filter(Boolean).slice(0, 8) } : {}),
            ...(Array.isArray(e.cues) && e.cues.length ? { cues: e.cues.map(a => String(a).trim().slice(0, 48)).filter(Boolean).slice(0, 6) } : {}),
            ...(typeof e.ss === 'string' && /^[A-Za-z0-9]{1,3}$/.test(e.ss) ? { ss: e.ss } : {}),
            ...(e.rest && typeof e.rest === 'object' ? (() => { const b = e.rest.b == null ? null : clamp(Number(e.rest.b) || 0, 0, 3600), a = e.rest.a == null ? null : clamp(Number(e.rest.a) || 0, 0, 3600); return b == null && a == null ? {} : { rest: { b, a } }; })() : {}),
            sets: e.sets.map(s => {
              const reps = clamp(parseInt(s.reps, 10) || 1, 1, 100);
              return { reps, repsText: String(s.repsText || reps), int: normInt(s.int) };
            })
          });
        });
        if (dy.exercises.length) wk.days.push(dy);
      });
      if (wk.days.length) blk.weeks.push(wk);
    });
    if (blk.weeks.length) prog.blocks.push(blk);
  });
  return finishParse(prog, errors, warnings);
}

function parseInput(text, nameField) {
  const t = String(text || '').trim();
  let r;
  if (t.startsWith('{')) {
    try { r = normalizeProgramJSON(JSON.parse(t)); }
    catch (e) { r = finishParse({ name: null, blocks: [] }, [{ line: 0, msg: 'Invalid JSON: ' + e.message }], []); }
  } else r = parseProgramText(t);
  r.program.name = String(nameField || '').trim() || r.program.name || 'My Program';
  return r;
}

function groupSets(sets) {
  const out = [];
  sets.forEach(s => {
    const k = s.repsText + '|' + JSON.stringify(s.int || null);
    const l = out[out.length - 1];
    if (l && l.k === k) l.n++; else out.push({ k, n: 1, repsText: s.repsText, int: s.int });
  });
  return out;
}

function serializeProgram(p) {
  const out = [];
  p.blocks.forEach((b, bi) => {
    if (bi) out.push('');
    out.push(`BLOCK ${bi + 1}: ${b.name}`);
    b.weeks.forEach(w => {
      out.push(`WEEK ${w.num}${w.deload ? ' DELOAD' : ''}${w.note ? ' - ' + w.note : ''}`);
      w.days.forEach(d => {
        out.push(`DAY: ${d.name}`);
        const letters = new Map(), cnt = {};
        d.exercises.forEach(ex => { if (ex.ss && !letters.has(ex.ss)) letters.set(ex.ss, String.fromCharCode(65 + letters.size)); });
        d.exercises.forEach(ex => {
          let pre = '';
          if (ex.ss && letters.has(ex.ss)) { const L = letters.get(ex.ss); cnt[L] = (cnt[L] || 0) + 1; pre = `${L}${cnt[L]}. `; }
          out.push(`${pre}${ex.name} ${groupSets(ex.sets).map(g => `${g.n}x${g.repsText}${g.int ? ' @ ' + intName(g.int) : ''}`).join(', ')}`
            + (ex.alts && ex.alts.length ? ' | alt: ' + ex.alts.join(' / ') : '')
            + (ex.cues && ex.cues.length ? ' | cue: ' + ex.cues.join(' / ') : '')
            + (ex.rest ? ' | rest: ' + restText(ex.rest) : ''));
        });
      });
    });
  });
  return out.join('\n');
}

const flatSessions = p => {
  const out = [];
  p.blocks.forEach((b, bi) => b.weeks.forEach((w, wi) => w.days.forEach((d, di) => out.push({ b: bi, w: wi, d: di }))));
  return out;
};
const skey = (b, w, d) => b + '.' + w + '.' + d;
function doneKeys(p) {
  const set = new Set();
  S.logs.forEach(l => { if (l.programId === p.id && (l.cycle || 1) === (p.cycle || 1)) set.add(skey(l.b, l.w, l.d)); });
  return set;
}
function nextSession(p) {
  const done = doneKeys(p);
  return flatSessions(p).find(s => !done.has(skey(s.b, s.w, s.d))) || null;
}
const getProgram = id => S.programs.find(p => p.id === id) || null;
function activeProgram() {
  let p = getProgram(S.activeProgramId);
  if (!p && S.programs.length) { p = S.programs[0]; S.activeProgramId = p.id; }
  return p;
}
function missingFor(p) {
  const miss = new Map();
  p.blocks.forEach(b => b.weeks.forEach(w => w.days.forEach(d => d.exercises.forEach(ex => {
    if (!getLift(ex.name) && ex.sets.some(s => s.int && s.int.t !== 'abs')) miss.set(keyOf(ex.name), ex.name);
  }))));
  return [...miss.values()];
}
function missingLifts(p) {
  const miss = new Map();
  (p ? [p] : S.programs).forEach(pr => missingFor(pr).forEach(n => miss.set(keyOf(n), n)));
  return [...miss.values()];
}
